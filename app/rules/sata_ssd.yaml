category: "sata_ssd"
label: "SATA SSDs (2.5 Zoll)"

# BREITE SUCHBEGRIFFE (Fokus auf SATA / 2.5")
search_terms:
  - "SATA SSD"
  - "2.5 SSD"
  - "2.5 Zoll SSD"
  - "Crucial MX500"
  - "Samsung 870"
  - "Samsung 860"
  - "SanDisk SSD"
  - "Kingston A400"
  - "Intenso SSD"
  - "Intenso Top Performance"

# SCORING-GEWICHTUNG
scoring_weights:
  price: 0.9
  ausstattung: 0
  hardware_qualitaet: 0.1
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# EXCLUDES – NVMe, M.2 & Falschtreffer STRIKT AUSSCHLIESSEN
exclude_category:
  - "nvme"
  - "m.2"
  - "m2"
  - "pcie"
  - "defekt"
  - "fuer bastler"
  - "externe festplatte"
  - "externes gehaeuse"
  - "hdd"
  - "3.5"

# REGELN
rules:
  # ============================================================
  # 1TB SATA SSD (2.5")
  # ============================================================
  - label: "1TB SATA SSD ★ Top-Deal"
    match: 
      - "1tb sata"
      - "1 tb sata"
      - "1tb 2.5"
      - "1 tb 2.5"
      - "mx500 1tb"
      - "870 evo 1tb"
      - "860 evo 1tb"
      - "intenso 1tb"
      - "intenso top 1tb"
    price_history_model: "sata_ssd_1tb"
    exclude: 
      - "nvme"
      - "m.2"
      - "m2"
      - "2tb"
      - "4tb"
      - "500gb"
    max_price: 30
    deal_rating: "Top-Deal"

  - label: "1TB SATA SSD"
    match: 
      - "1tb sata"
      - "1 tb sata"
      - "1tb 2.5"
      - "1 tb 2.5"
      - "mx500 1tb"
      - "870 evo 1tb"
      - "860 evo 1tb"
      - "1tb ssd"
      - "intenso 1tb"
      - "intenso top 1tb"
    price_history_model: "sata_ssd_1tb"
    exclude: 
      - "nvme"
      - "m.2"
      - "m2"
      - "2tb"
      - "4tb"
      - "500gb"
    max_price: 45
    deal_rating: "Guter Preis"

  # ============================================================
  # 2TB SATA SSD (2.5")
  # ============================================================
  - label: "2TB SATA SSD ★ Top-Deal"
    match: 
      - "2tb sata"
      - "2 tb sata"
      - "2tb 2.5"
      - "2 tb 2.5"
      - "mx500 2tb"
      - "870 evo 2tb"
      - "860 evo 2tb"
      - "intenso 2tb"
      - "intenso top 2tb"
    price_history_model: "sata_ssd_2tb"
    exclude: 
      - "nvme"
      - "m.2"
      - "m2"
      - "1tb"
      - "4tb"
    max_price: 60
    deal_rating: "Top-Deal"

  - label: "2TB SATA SSD"
    match: 
      - "2tb sata"
      - "2 tb sata"
      - "2tb 2.5"
      - "2 tb 2.5"
      - "mx500 2tb"
      - "870 evo 2tb"
      - "860 evo 2tb"
      - "2tb ssd"
      - "intenso 2tb"
      - "intenso top 2tb"
    price_history_model: "sata_ssd_2tb"
    exclude: 
      - "nvme"
      - "m.2"
      - "m2"
      - "1tb"
      - "4tb"
    max_price: 85
    deal_rating: "Guter Preis"