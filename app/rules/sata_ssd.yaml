category: "sata_ssd"
label: "SATA SSDs (2.5 Zoll)"

# ============================================================
# Kapazitäts-Erkennung über requirements (storage.py)
# ============================================================

search_terms:
  - "SATA SSD"
  - "2.5 SSD"
  - "2.5 Zoll SSD"
  - "Crucial MX500"
  - "Samsung 870"
  - "Samsung 860"
  - "SanDisk SSD"
  - "Kingston A400"
  - "Intenso SSD"
  - "Intenso Top Performance"

# SCORING-GEWICHTUNG
scoring_weights:
  price: 0.9
  ausstattung: 0
  hardware_qualitaet: 0.1
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# EXCLUDES – NVMe, M.2, HDD & Falschtreffer STRIKT AUSSCHLIESSEN
exclude_category:
  - "nvme"
  - "m.2"
  - "m2"
  - "pcie"
  - "defekt"
  - "fuer bastler"
  - "externe festplatte"
  - "externes gehaeuse"
  - "hdd"
  - "3.5"

rules:
  # ============================================================
  # ~120-160GB SATA SSD
  # ============================================================
  - label: "~128GB SATA SSD ★ Top-Deal"
    price_history_model: "sata_ssd_128gb"
    requirements:
      min_ssd_gb: 60
      max_ssd_gb: 159
    max_price: 12
    deal_rating: "Top-Deal"

  - label: "~128GB SATA SSD"
    price_history_model: "sata_ssd_128gb"
    requirements:
      min_ssd_gb: 60
      max_ssd_gb: 159
    max_price: 25
    deal_rating: "Guter Preis"

  # ============================================================
  # ~250GB SATA SSD (deckt 240/250/256GB ab)
