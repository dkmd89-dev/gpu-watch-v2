category: "sata_ssd"
label: "SATA SSDs (2.5 Zoll)"

# Kategorieweise-Auswertung-Auftrag: SATA-SSD wird als zweites ausgewertet/geloggt.
scan_priority: 2


# ============================================================
# Kapazitäts-Erkennung über requirements (storage.py)
# ============================================================

search_terms:
  - "SATA SSD"
  - "2.5 SSD"
  - "2.5 Zoll SSD"
  - "Crucial MX500"
  - "Samsung 870"
  - "Samsung 860"
  - "SanDisk SSD"
  - "Kingston A400"
  - "Intenso SSD"
  - "Intenso Top Performance"
  # Generische Begriffe (Schritt A): decken markenlose Angebote ab, die
  # von den obigen markenspezifischen Suchbegriffen nicht erfasst werden.
  - "SSD 250GB"
  - "SSD 500GB"
  - "SSD 1TB"
  - "WD Blue SSD"
  - "ADATA SSD"
  - "Toshiba SSD"
  - "Samsung SSD" 

# SCORING-GEWICHTUNG
scoring_weights:
  price: 0.9
  ausstattung: 0
  hardware_qualitaet: 0.1
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# EXCLUDES – NVMe, HDD & Falschtreffer STRIKT AUSSCHLIESSEN
# Schritt A: "m.2"/"m2" bewusst NICHT mehr pauschal ausgeschlossen -- M.2
# ist nur ein Formfaktor, kein Interface. Es gibt reale M.2-SSDs mit
# SATA-Interface (B+M-Key), die durch den bisherigen Blanket-Exclude
# faelschlich verworfen wurden. Explizite NVMe-Erwaehnungen ("nvme",
# "pcie") werden weiterhin ausgeschlossen, da NVMe zuverlaessig im Titel
# genannt wird, wenn es sich um eine NVMe-SSD handelt.
exclude_category:
  - "nvme"
  - "pcie"
  - "defekt"
  - "fuer bastler"
  - "externe festplatte"
  - "externes gehaeuse"
  # FIX (Active-False-Positive-Audit, docs/ACTIVE_FALSE_POSITIVE_AUDIT.md):
  # "externe festplatte"/"externes gehaeuse" deckten nur diese beiden
  # exakten Phrasen ab -- externe USB-SSDs mit anderer Formulierung
  # ("Portable SSD", "Externer Speicher") matchten weiterhin faelschlich
  # als interne 2.5" SATA-SSD. Real bestaetigt gegen found.json (3 Titel
  # im vollstaendigen 75-Titel-Match-Korpus): "SanDisk Portable SSD 1 TB
  # Speicher", "Seagate Expansion SSD, 500GB, Portable External Solid
  # State Drive...", "SSK Pro 1TB SSD Externer Speicher USB-Stick" --
  # alle USB-Laufwerke, kein SATA-Interface.
  - "portable"
  - "externer speicher"
  - "hdd"
  - "3.5"

  # KONSOLEN (NEU)
  - "playstation"
  - "ps1"
  - "ps2"
  - "ps3"
  - "ps4"
  - "ps5"
  - "xbox"
  - "nintendo"
  - "switch"
  - "spielekonsole"
  - "konsole"

  # Laptop PC
  - "laptop"
  - "notebook"
  - "komplett pc"
  - "komplettsystem"
  - "fertig pc"
  - "pc komplett"
  - "dell optiplex"      # NEU: häufige Office-PCs
  - "hp prodesk"         # NEU
  - "hp elitebook"       # NEU (Laptop-Serie)
  - "fujitsu esprimo"    # NEU
  - "lenovo thinkcentre" # NEU
  - "lenovo thinkpad"    # NEU (Laptop-Serie)
  - "acer aspire"        # NEU (Laptop-Serie)
  - "asus vivobook"      # NEU (Laptop-Serie)
  - "zbook"              # NEU (HP Workstation-Laptop)
  - "server"             # NEU
  - "mini-pc"            # NEU
  - "nuc"                # NEU (Intel Mini-PC)
  - "thin client"        # NEU
  - "workstation"        # NEU
  - "adapter"            # NEU
  - "gehäuse"            # NEU
  - "case"               # NEU
  - "halterung"          # NEU

  # LAPTOP-MODELLE (ohne "laptop"/"notebook" im Titel)
  - "dell e5440"
  - "dell latitude"
  - "dell precision"
  - "hp elitebook"
  - "hp probook"
  - "hp zbook"
  - "lenovo thinkpad"
  - "lenovo yoga"
  - "acer aspire"
  - "asus vivobook"
  - "asus zenbook"
  - "toshiba satellite"
  - "toshiba portege"
  - "macbook"
  - "surface"
  
  # KOMPLETTE PCs (erweitert)
  - "gaming pc"
  - "gaming-pc"
  - "gamer pc"
  - "spiele pc"
  - "komplett pc"
  - "fertig pc"
  - "pc komplett"
  - "komplettsystem"
  - "komplett-system"
  - "workstation"
  - "setup"
  
  # HDD-MODELLE (ohne "hdd" im Titel)
  - "travelstar"        # Hitachi HDD-Serie
  - "deskstar"          # Hitachi HDD-Serie
  - "caviar"            # WD HDD-Serie
  - "barracuda"         # Seagate HDD-Serie (Achtung: gibt auch Barracuda SSD!)
  - "red pro"           # WD NAS HDD
  - "purple"            # WD Surveillance HDD
  - "gold"              # WD Enterprise HDD
  
  # KOMPLETTE PCs (ohne "pc" im Titel)
  - "optiplex"          # Dell Office-PCs
  - "precision"         # Dell Workstations
  - "thinkcentre"       # Lenovo Office-PCs
  - "esprimo"           # Fujitsu Office-PCs
  - "prodesk"           # HP Office-PCs
  - "elitedesk"         # HP Office-PCs
  - "nuc"               # Intel Mini-PCs
  - "mini pc"           # Mini-PCs
  
  # SERVER
  - "proliant"          # HP Server
  - "poweredge"         # Dell Server
  - "thinkstation"      # Lenovo Workstations

rules:
  # ============================================================
  # ~120-160GB SATA SSD
  # ============================================================
  - label: "~128GB SATA SSD ★ Top-Deal"
    price_history_model: "sata_ssd_128gb"
    requirements:
      min_ssd_gb: 60
      max_ssd_gb: 159
    max_price: 10
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 20
    negotiation_score_component: "profit"

  - label: "~128GB SATA SSD"
    price_history_model: "sata_ssd_128gb"
    requirements:
      min_ssd_gb: 60
      max_ssd_gb: 159
    max_price: 17
    deal_rating: "Guter Preis"

  # ============================================================
  # ~250GB SATA SSD (deckt 240/250/256GB ab)
  # ============================================================
  - label: "~250GB SATA SSD ★ Top-Deal"
    price_history_model: "sata_ssd_250gb"
    requirements:
      min_ssd_gb: 160
      max_ssd_gb: 319
    # Kalibriert anhand 31 realer price_history.jsonl-Datenpunkte (03.08.2026):
    # p10 = 25€ -> Top-Deal-Grenze. Vorher 26€ (grober Schaetzwert, minimale
    # Differenz -- keine Zensierungs-/Duplikat-Auffaelligkeiten in den Daten).
    max_price: 25
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 20
    negotiation_score_component: "profit"

  - label: "~250GB SATA SSD"
    price_history_model: "sata_ssd_250gb"
    requirements:
      min_ssd_gb: 160
      max_ssd_gb: 319
    # Kalibriert: Marktpreis (getrimmter Mittelwert p10-p90) = 32,43€ ->
    # gerundet 32€. Vorher 33€ (grober Schaetzwert).
    max_price: 32
    deal_rating: "Guter Preis"

  # ============================================================
  # ~500GB SATA SSD (deckt 480/500/512GB ab)
  # ============================================================
  - label: "~500GB SATA SSD ★ Top-Deal"
    price_history_model: "sata_ssd_500gb"
    requirements:
      min_ssd_gb: 320
      max_ssd_gb: 639
    # Kalibriert anhand 44 (von 77) realer price_history.jsonl-Datenpunkte
    # (03.08.2026): p10 = 40,30€ -> gerundet 40€. Vorher 49€ (grober
    # Schaetzwert). ACHTUNG: 33 der 77 Rohdatenpunkte (alle exakt 71,50€,
    # eBay, alle im selben ~2-Sekunden-Fenster, fingerprint=null) wurden
    # bewusst NICHT in die Kalibrierung einbezogen -- vermutlicher
    # Duplicate-Detection-Blindspot bei Alt-Daten ohne Fingerprint. Ohne
    # Bereinigung waere p10 faelschlich bei 47,40€ gelandet. Ursache noch
    # nicht behoben, folgt als eigener, spaeter freizugebender Schritt.
    max_price: 40
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 20
    negotiation_score_component: "profit"

  - label: "~500GB SATA SSD"
    price_history_model: "sata_ssd_500gb"
    requirements:
      min_ssd_gb: 320
      max_ssd_gb: 639
    # Kalibriert (siehe Kommentar oben, gleiche bereinigte Datenbasis):
    # Marktpreis = 56,03€ -> gerundet 56€. Vorher 67€ (grober Schaetzwert).
    max_price: 56
    deal_rating: "Guter Preis"

  # ============================================================
  # ~1TB SATA SSD (deckt 960/1000/1024GB ab)
  # ============================================================
  - label: "~1TB SATA SSD ★ Top-Deal"
    price_history_model: "sata_ssd_1tb"
    requirements:
      min_ssd_gb: 640
      max_ssd_gb: 1279
    max_price: 69
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 20
    negotiation_score_component: "profit"

  - label: "~1TB SATA SSD"
    price_history_model: "sata_ssd_1tb"
    requirements:
      min_ssd_gb: 640
      max_ssd_gb: 1279
    max_price: 89
    deal_rating: "Guter Preis"

  # ============================================================
  # ~2TB SATA SSD (deckt 2000/2048GB ab)
  # ============================================================
  - label: "~2TB SATA SSD ★ Top-Deal"
    price_history_model: "sata_ssd_2tb"
    requirements:
      min_ssd_gb: 1280
      max_ssd_gb: 2559
    max_price: 115
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 20
    negotiation_score_component: "profit"

  - label: "~2TB SATA SSD"
    price_history_model: "sata_ssd_2tb"
    requirements:
      min_ssd_gb: 1280
      max_ssd_gb: 2559
    max_price: 155
    deal_rating: "Guter Preis"
