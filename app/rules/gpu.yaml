# ============================================================
# GPU-Watcher Regel-Matrix (2026 - Deutschlandweit)
# ============================================================
# Preisgrenzen wurden anhand aktueller Kleinanzeigen-Angebote kalibriert
# (Stichprobe Juli 2026: RTX 3060 12GB pendelt meist zwischen 200-280€,
# RTX 3060 Ti/3070 8GB überraschend hoch bei 200-300€ -- Gebraucht-GPU-Preise
# sind 2026 höher als noch 2024/25). Das sind Richtwerte -- pass sie an,
# sobald du ein Gefühl dafür hast, wie viele/welche Treffer reinkommen.
#
# Jede Regel wird nacheinander geprüft. Die ERSTE passende Regel
# entscheidet über die max. erlaubte Preisgrenze.
#
# match: Liste von Begriffen – mindestens EINER muss im Titel vorkommen
# require_all_of: Liste von Listen – JEDE Unterliste braucht mind. 1 Treffer.
#   Marke und Modellreihe gehören in SEPARATE Unterlisten
#   (["asus"], ["tuf","rog strix"]), sonst reicht z.B. "dual" allein aus
#   allen Marken (ODER-Verknüpfung).
# exclude: Begriffe, die NICHT im Titel vorkommen dürfen
# max_price: Preisobergrenze in Euro
# min_vram_gb: Minimum VRAM in GB
# label: Klartext-Name für die Benachrichtigung
# deal_rating: "Top-Deal" (⭐) / "Guter Preis" (👍) / "Okay" (⚠️)
# ============================================================
# NEU in v2: category/label/search_terms bilden den Kategorie-Kopf.
# Der Rest (defaults-Overrides, rules:) ist 1:1 aus der alten
# rules.yaml übernommen -- keine inhaltliche Änderung.
# ============================================================

category: "gpu"
label: "Grafikkarten"

# Kategorieweise-Auswertung-Auftrag: GPU wird zuerst ausgewertet/geloggt.
scan_priority: 1

# Notification-Gate-Folgeschritt: eigenes Preislimit fuer den ntfy-Push.
# Die Regel-eigenen max_price-Werte oben liegen zwischen 160€ und 350€ --
# ein einzelnes Limit muss also einen Kompromiss zwischen "greift ueberhaupt"
# und "wirklich noch ein Schnaeppchen" finden. 250€ deckt den Grossteil der
# Regeln ab, ohne die teuersten (RTX 4070er-Klasse, bis 350€) automatisch
# als "Top-Deal" durchzuwinken. Bei Bedarf anpassen.
notify_max_price: 250

# BREITE SUCHBEGRIFFE
search_terms:
  - "Grafikkarte"
  - "GPU"
  - "RTX"
  - "RX"
  - "Radeon"
  - "GeForce"
  - "RTX 3060"
  - "RTX 3070"
  - "RTX 4060"
  - "RX 6700"
  - "RX 6800"

# Diese Kategorie sucht ausschließlich einzelne Grafikkarten. Komplette
# PC-Systeme, Laptops und Zubehör sollen NICHT als GPU-Treffer erscheinen
# (dafür gibt es künftig die Kategorien "office_pc"/"gaming_pc", die diese
# Begriffe bewusst NICHT ausschließen). Inhaltlich identisch zur alten
# PC_AUSSCHLIESSEN-Konstante in matcher.py -- jetzt hier konfigurierbar,
# ohne Code-Änderung.
# ============================================================
# Kategorie-eigene Deal-Score-Gewichte (Phase 6, Nachbesserung)
# ============================================================
# Überschreibt für diese Kategorie die globalen scoring_weights aus
# _global.yaml (50% Preis / 25% Ausstattung / 25% Hardwarequalität).
# Grund: Bei einer einzelnen Grafikkarte (kein komplettes System) sind
# "Ausstattung" (has_ssd/has_dedicated_gpu) und "Hardwarequalität"
# strukturell kaum aussagekräftig:
#   - Ausstattung: has_ssd/has_dedicated_gpu sind bei GPU-Titel-Matching
#     immer None ("nicht anwendbar") -> liefert nur den neutralen
#     Platzhalterwert (60), egal wie gut das Angebot ist.
#   - Hardwarequalität: es gibt keinen cpu_headroom/ram_headroom-Bonus
#     bei klassischem Titel-Matching, daher bleibt der Score bei der
#     Basis-Einstufung stehen (Top-Deal=85, Guter Preis=65, Okay=45)
#     -- unabhängig vom tatsächlichen Preis.
# Mit den globalen 25%/25% auf diese beiden gedeckelten Komponenten war
# ★★★★★ (>=95 Punkte) für die GPU-Kategorie rechnerisch NIE erreichbar,
# selbst bei 0€ Preis (siehe Testfall in test_app_notification_gate.py).
# Für Einzelkarten ist der Preis relativ zur Regel-Preisgrenze das mit
# Abstand aussagekräftigste Signal -- daher hier stark auf Preis (90%)
# gewichtet, mit 10% Hardwarequalität als grobem Tie-Breaker zwischen
# gleich günstigen Angeboten unterschiedlicher Deal-Rating-Stufe.
# Ausstattung/Hersteller/Zustand/Lieferumfang bleiben auf 0, da für
# diese Kategorie kein echtes Signal existiert (kein "Fake"-Score).
# ============================================================

scoring_weights:
  price: 0.9
  ausstattung: 0
  hardware_qualitaet: 0.1
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# ============================================================
# OPTIMIERTE EXCLUDES – NUR klare PCs
# ============================================================
exclude_category:
  # KOMPLETTE PCs
  - "gaming pc"
  - "gaming-pc"
  - "gamer pc"
  - "spiele pc"
  - "komplett pc"
  - "fertig pc"
  - "pc komplett"
  - "komplettsystem"
  - "komplett-system"
  - "workstation"
  - "setup"

  # LAPTOPS / MOBILE GERÄTE (NEU)
  - "laptop"
  - "laptops"
  - "notebook"
  - "notebooks"
  - "legion"          # Lenovo Gaming-Laptops
  - "nitro"           # Acer Nitro Laptops
  - "omen"            # HP Omen Laptops
  - "gaming laptop"
  - "gaming-notebook"
  - "mobil"
  - "tragbar"

  # KONSOLEN (NEU)
  - "playstation"
  - "ps1"
  - "ps2"
  - "ps3"
  - "ps4"
  - "ps5"
  - "xbox"
  - "nintendo"
  - "switch"
  - "spielekonsole"
  - "konsole"
  
  # MONITORE & PERIPHERIE
  - "monitor"
  - "monitore"
  - "bildschirm"
  - "tastatur"
  - "maus"
  - "mit monitor"
  - "mit bildschirm"
  
  # KÜHLUNG / ZUBEHÖR
  - "wasserkühler"
  - "waterblock"
  - "gpu block"
  - "gpu-block"
  - "kühlkörper"
  - "backplate"
  - "luftkühler"

  # ZUSTAND / DEFEKTE WARE
  - "defekt"
  - "defekte"
  - "bastler"
  - "für bastler"
  - "an bastler"
  - "kaputt"
  - "not tested"
  - "ungeprüft"


# ============================================================
