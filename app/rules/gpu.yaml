  # RTX 3060 12GB
  # ============================================================
  - label: "RTX 3060 12GB ★ Top-Deal"
    match: 
      - "rtx 3060"
      - "3060 12g"
      - "3060-12g"
      - "3060 12gb"
    price_history_model: "rtx_3060_12gb"
    exclude: 
      - "ti"
      - "3070"
      - "3080"
      - "4060"
    max_price: 220
    deal_rating: "Top-Deal"

