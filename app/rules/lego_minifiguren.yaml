# ============================================================
# LEGO Minifiguren – Sammler-/Seltenheits-Watcher
# ============================================================
# Zweck:
#   Suche gezielt nach LEGO-Minifiguren mit möglichem Sammlerwert.
#
# Fokus:
#   - Ninjago
#   - Star Wars
#   - Marvel / DC
#   - Collectible Minifigures (CMF)
#   - Castle / Pirates / Space / Fantasy
#   - Promo-, Exclusive- und seltene Figuren
#   - Figuren-Konvolute und Sammlungen
#
# WICHTIG:
#   Die Preisgrenzen sind bewusst als DEAL-FILTER gedacht und nicht
#   als garantierte Marktwerte. Ein tatsächlicher Wert hängt u.a. von
#   Figur, Variante, Zustand, Zubehör und Originalität ab.
#
# ARCHITEKTUR:
#   Rein YAML-basiert wie die bisherige Spielzeug-Bundle-Kategorie.
#   Kein neuer Python-Detector erforderlich.
#
# Priorität:
#   Die spezifischeren Regeln stehen vor den allgemeinen Regeln.
#   Dadurch können besonders interessante Figuren mit niedrigeren
#   Deal-Grenzen zuerst erkannt werden.
# ============================================================

category: "lego_minifiguren"
label: "LEGO Minifiguren – Sammlerwert"

min_vram_gb: 0

# Obergrenze für allgemeine Benachrichtigungen.
# Spezifische Regeln besitzen eigene max_price-Werte.
notify_max_price: 100

search_terms:
  # Allgemein
  - "LEGO Minifigur"
  - "LEGO Minifiguren"
  - "LEGO Figur"
  - "LEGO Figuren"
  - "LEGO Figuren Sammlung"
  - "LEGO Minifiguren Sammlung"
  - "LEGO Figuren Konvolut"
  - "LEGO Minifiguren Konvolut"
  - "LEGO Figuren Posten"

  # Ninjago
  - "LEGO Ninjago Minifigur"
  - "LEGO Ninjago Figur"
  - "Ninjago Minifiguren"
  - "Ninjago Figur Sammlung"
  - "Ninjago Figuren Konvolut"

  # Star Wars
  - "LEGO Star Wars Minifigur"
  - "LEGO Star Wars Figur"
  - "Star Wars Minifiguren"
  - "Star Wars Figuren Sammlung"
  - "Star Wars Figuren Konvolut"
  - "LEGO Clone Wars Minifigur"
  - "LEGO Clone Trooper"
  - "LEGO Phase 2 Clone Trooper"

  # CMF
  - "LEGO CMF"
  - "LEGO Sammelfigur"
  - "LEGO Collectible Minifigures"
  - "LEGO Serie Minifiguren"

  # Weitere Sammlerbereiche
  - "LEGO Castle Minifigur"
  - "LEGO Pirates Minifigur"
  - "LEGO Space Minifigur"
  - "LEGO Marvel Minifigur"
  - "LEGO DC Minifigur"
  - "LEGO Herr der Ringe Minifigur"
  - "LEGO Hobbit Minifigur"
  - "LEGO Harry Potter Minifigur"
  - "LEGO Monster Fighters Minifigur"
  - "LEGO Fantasy Minifigur"
  - "LEGO Promo Minifigur"
  - "LEGO Exclusive Minifigur"
  - "LEGO Limited Edition Minifigur"

exclude_category:
  # Keine Bücher / Medien
  - "buch"
  - "bücher"
  - "roman"
  - "comic"
  - "magazin"
  - "hörspiel"
  - "dvd"
  - "blu-ray"
  - "spiel"
  - "videospiel"

  # Keine digitalen Artikel
  - "digital"
  - "download"
  - "code"

  # Keine offensichtlichen Nicht-Figuren-Angebote
  - "nur steine"
  - "nur bausteine"
  - "kiloware"
  - "lego steine"
  - "lego teile"
  - "ersatzteile"

  # Defekt / Repro möglichst vermeiden
  - "defekt"
  - "kaputt"
  - "beschädigt"
  - "repro"
  - "replik"
  - "fake"
  - "nachbau"
  - "custom"          # verhindert viele nicht originale Custom-Figuren

scoring_weights:
  price: 0.70
  ausstattung: 0
  hardware_qualitaet: 0
  hersteller: 0.10
  zustand: 0.10
  lieferumfang: 0.10

