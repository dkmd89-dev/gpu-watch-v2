  - label: "LEGO Star Wars – Darth Revan ★ Top-Deal"
    require_all_of:
      - ["lego", "star wars"]
      - ["darth revan", "revan"]
    price_history_model: "lego_sw_rare"
    max_price: 40
    deal_rating: "Top-Deal"

