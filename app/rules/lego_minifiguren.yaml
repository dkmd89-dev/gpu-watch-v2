# ============================================================
# LEGO Minifiguren – Sammler-/Seltenheits-Watcher
# ============================================================
# Zweck:
#   Suche gezielt nach LEGO-Minifiguren mit möglichem Sammlerwert.
#
# Fokus:
#   - Ninjago
#   - Star Wars
#   - Marvel / DC
#   - Collectible Minifigures (CMF)
#   - Castle / Pirates / Space / Fantasy
#   - Promo-, Exclusive- und seltene Figuren
#   - Figuren-Konvolute und Sammlungen
#
# WICHTIG:
#   Die Preisgrenzen sind bewusst als DEAL-FILTER gedacht und nicht
#   als garantierte Marktwerte. Ein tatsächlicher Wert hängt u.a. von
#   Figur, Variante, Zustand, Zubehör und Originalität ab.
#
# ARCHITEKTUR:
#   Rein YAML-basiert wie die bisherige Spielzeug-Bundle-Kategorie.
#   Kein neuer Python-Detector erforderlich.
#
# Priorität:
#   Die spezifischeren Regeln stehen vor den allgemeinen Regeln.
#   Dadurch können besonders interessante Figuren mit niedrigeren
#   Deal-Grenzen zuerst erkannt werden.
#
# resale_price_group (Option 2, "Flip-Kandidaten-Logik optimieren",
# STATUS.md Abschnitt 33b): optionaler, zusätzlicher Schlüssel je Regel.
# Wirkt AUSSCHLIESSLICH auf die estimated_resale_price-Schätzung (Flip-
# Kandidat/Dashboard-Margenfelder) -- market_price/deal_score/
# Notification-Gate bleiben unverändert an price_history_model gekoppelt.
# Grund: bei dieser Kategorie ist die Preishistorie je einzelnem
# price_history_model strukturell zu dünn für eine belastbare P75-P90-
# Schätzung (siehe STATUS.md: 185/386 Treffer betroffen). Mehrere
# thematisch/preislich ähnliche Einzelfigur-Regeln (Okay-Preisgrenze
# ~35-50€) teilen sich deshalb "lego_rare_minifig_common", die beiden
# Konvolut-/Sammlungs-Regeln (~60-70€) "lego_bundle_common". Bewusst
# NICHT einbezogen: lego_sw_rare (deutlich höheres Preisniveau, bis 80€)
# und lego_cmf (deutlich niedrigeres Preisniveau, bis 25€) -- eine
# Zusammenlegung würde dort spürbar unterschiedliche Preisniveaus
# vermischen und die Schätzung eher verschlechtern als verbessern.
# ============================================================

category: "lego_minifiguren"
label: "LEGO Minifiguren – Sammlerwert"

min_vram_gb: 0

# Obergrenze für allgemeine Benachrichtigungen.
# Spezifische Regeln besitzen eigene max_price-Werte.
notify_max_price: 100

search_terms:
  # Allgemein
  - "LEGO Minifigur"
  - "LEGO Minifiguren"
  - "LEGO Figur"
  - "LEGO Figuren"
  - "LEGO Figuren Sammlung"
  - "LEGO Minifiguren Sammlung"
  - "LEGO Figuren Konvolut"
  - "LEGO Minifiguren Konvolut"
  - "LEGO Figuren Posten"

  # Ninjago
  - "LEGO Ninjago Minifigur"
  - "LEGO Ninjago Figur"
  - "Ninjago Minifiguren"
  - "Ninjago Figur Sammlung"
  - "Ninjago Figuren Konvolut"

  # Star Wars
  - "LEGO Star Wars Minifigur"
  - "LEGO Star Wars Figur"
  - "Star Wars Minifiguren"
  - "Star Wars Figuren Sammlung"
  - "Star Wars Figuren Konvolut"
  - "LEGO Clone Wars Minifigur"
  - "LEGO Clone Trooper"
  - "LEGO Phase 2 Clone Trooper"

  # CMF
  - "LEGO CMF"
  - "LEGO Sammelfigur"
  - "LEGO Collectible Minifigures"
  - "LEGO Serie Minifiguren"

  # Weitere Sammlerbereiche
  - "LEGO Castle Minifigur"
  - "LEGO Pirates Minifigur"
  - "LEGO Space Minifigur"
  - "LEGO Marvel Minifigur"
  - "LEGO DC Minifigur"
  - "LEGO Herr der Ringe Minifigur"
  - "LEGO Hobbit Minifigur"
  - "LEGO Harry Potter Minifigur"
  - "LEGO Monster Fighters Minifigur"
  - "LEGO Fantasy Minifigur"
  - "LEGO Promo Minifigur"
  - "LEGO Exclusive Minifigur"
  - "LEGO Limited Edition Minifigur"

exclude_category:
  # Keine Bücher / Medien
  - "buch"
  - "bücher"
  - "roman"
  - "comic"
  - "magazin"
  - "hörspiel"
  - "dvd"
  - "blu-ray"
  - "spiel"
  - "videospiel"

  # Keine digitalen Artikel
  - "digital"
  - "download"
  - "code"

  # Keine offensichtlichen Nicht-Figuren-Angebote
  - "nur steine"
  - "nur bausteine"
  - "kiloware"
  - "lego steine"
  - "lego teile"
  - "ersatzteile"

  # Defekt / Repro möglichst vermeiden
  - "defekt"
  - "kaputt"
  - "beschädigt"
  - "repro"
  - "replik"
  - "fake"
  - "nachbau"
  - "custom"          # verhindert viele nicht originale Custom-Figuren

scoring_weights:
  price: 0.70
  ausstattung: 0
  hardware_qualitaet: 0
  hersteller: 0.10
  zustand: 0.10
  lieferumfang: 0.10

rules:

  # ============================================================
  # STAR WARS – besonders interessante/seltene Figuren
  # ============================================================

  - label: "LEGO Star Wars – Darth Revan ★ Top-Deal"
    # BUG-FIX (Phase 12, Schritt 3): ["lego", "star wars"] als EINE
    # require_all_of-Gruppe bedeutet "mind. EINES der beiden Woerter"
    # (ODER-Semantik innerhalb einer Gruppe, siehe matcher.py::_any_term()-
    # Docstring: "aus JEDER Gruppe muss min. 1 Wort matchen"). Da "lego"
    # praktisch in jedem LEGO-Titel vorkommt, war die "star wars"-Bedingung
    # dadurch faktisch wirkungslos -- bestaetigt durch echte Preishistorie-
    # Daten: u.a. "LEGO Ninjago Limited Edition Minifigur Sawyer" und
    # "LEGO Nexo Knights Limited Edition Minifigur Merlok" wurden bisher
    # faelschlich als "lego_sw_rare" gefuehrt (siehe PRICE_CALIBRATION_
    # REVIEW.md). Fix: zwei GETRENNTE Gruppen -- "lego" UND "star wars"
    # muessen beide vorkommen (require_all_of verknuepft die Gruppen
    # bereits UND-artig, siehe evaluate()-Docstring).
    require_all_of:
      - ["lego"]
      - ["star wars"]
      - ["darth revan", "revan"]
    price_history_model: "lego_sw_rare"
    max_price: 40
    deal_rating: "Top-Deal"

  - label: "LEGO Star Wars – Darth Revan 👍 Guter Preis"
    # BUG-FIX (Phase 12, Schritt 3): siehe Top-Deal-Regel oben.
    require_all_of:
      - ["lego"]
      - ["star wars"]
      - ["darth revan", "revan"]
    price_history_model: "lego_sw_rare"
    max_price: 60
    deal_rating: "Guter Preis"

  - label: "LEGO Star Wars – Darth Revan ⚠️ Interessant"
    # BUG-FIX (Phase 12, Schritt 3): siehe Top-Deal-Regel oben.
    require_all_of:
      - ["lego"]
      - ["star wars"]
      - ["darth revan", "revan"]
    price_history_model: "lego_sw_rare"
    max_price: 80
    deal_rating: "Interessant"

  # HINWEIS (Phase 12, Schritt 3): Die folgenden drei Clone-Wars-Regeln
  # (price_history_model "lego_sw_clone") nutzen DASSELBE ["lego","star
  # wars"]-Muster und sind vom selben strukturellen Bug betroffen -- aber
  # NICHT Teil des explizit beauftragten Fix-Umfangs dieses Schritts
  # (nur lego_sw_rare war angefordert). Bewusst UNVERAENDERT gelassen,
  # als offener Punkt fuer einen separaten, spaeteren Schritt dokumentiert.
  # BUG-FIX (Phase 12, Schritt 4): dasselbe strukturelle Muster wie bei
  # lego_sw_rare (Schritt 3) -- ["lego", "star wars"] als EINE Gruppe
  # bedeutet "mind. eines der beiden Woerter" (ODER), nicht "beide" (UND).
  # Bestaetigt durch Live-Test: "LEGO Marvel Spider-Man Minifigur Clone
  # Sammler selten" matchte bisher faelschlich als lego_sw_clone (Marvel,
  # kein Star Wars). Fix: "lego" als eigene Gruppe.
  - label: "LEGO Star Wars – Clone Wars ★ Top-Deal"
    require_all_of:
      - ["lego"]
      - ["star wars"]
      - ["clone wars", "clone trooper", "clone", "501st", "phase 2", "phase ii"]
    price_history_model: "lego_sw_clone"
    resale_price_group: "lego_rare_minifig_common"
    max_price: 20
    deal_rating: "Top-Deal"

  - label: "LEGO Star Wars – Clone Wars 👍 Guter Preis"
    require_all_of:
      - ["lego"]
      - ["star wars"]
      - ["clone wars", "clone trooper", "clone", "501st", "phase 2", "phase ii"]
    price_history_model: "lego_sw_clone"
    resale_price_group: "lego_rare_minifig_common"
    max_price: 35
    deal_rating: "Guter Preis"

  - label: "LEGO Star Wars – Clone Wars ⚠️ Interessant"
    require_all_of:
      - ["lego"]
      - ["star wars"]
      - ["clone wars", "clone trooper", "clone", "501st", "phase 2", "phase ii"]
