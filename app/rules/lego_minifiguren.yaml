    max_price: 15
    deal_rating: "Top-Deal"

  - label: "LEGO Star Wars – seltene Figur 👍 Guter Preis"
    # BUG-FIX (Phase 12, Schritt 3): siehe Darth-Revan-Regeln oben.
    require_all_of:
      - ["lego"]
