# ============================================================
# Office-PC Regel-Matrix (Phase 5)
# ============================================================
# Anders als bei GPU-Regeln (Titel-Stichwort-Matching) werden hier
# Hardware-MINDESTANFORDERUNGEN geprüft, ausgewertet über die Detectors
# in categories/detectors/. Siehe matcher._evaluate_hardware_requirements().
#
# INTERPRETATION der CPU-Mindestanforderung (siehe Commit-Begründung):
# Der Auftrag nennt konkrete Modelle (i5-8400+/8500+/8600+, i7-8700+,
# Ryzen 5 2600+/3600+/5600+). Das wird hier als MUSTER interpretiert:
# "Intel i5 oder besser, 8. Generation oder neuer" bzw. "AMD Ryzen 5
# oder besser, 2000er-Serie oder neuer" -- deckt alle genannten Modelle
# ab und bleibt auch für neuere Generationen (z.B. i5-12400) gültig,
# ohne dass diese YAML bei jeder neuen CPU-Generation angepasst werden
# müsste. Falls eine exakte Modell-Whitelist gewünscht ist, bitte
# Rückmeldung geben.
# ============================================================

category: "office_pc"
label: "Office-PC"

# Notification-Gate-Folgeschritt: eigenes Preislimit fuer den ntfy-Push.
# Reale Scan-Daten zeigten Office-PCs bisher bei 130-190€ (max_price der
# Regel oben: 300€). 200€ deckt die bisher beobachtete Preisspanne
# vollstaendig ab und laesst trotzdem Luft nach oben. Bei Bedarf anpassen.
notify_max_price: 200
search_terms:
  - "Office PC"
  - "Büro PC"
  - "PC Komplettsystem"
  - "Business PC"

# Diese Kategorie WILL komplette PC-Systeme. Ursprünglich bewusst KEIN
# exclude_category (anders als bei gpu.yaml, wo PCs ausgeschlossen
# werden) -- das galt so lange, wie kein realer Fehltreffer belegt war.
#
# FIX (Active-False-Positive-Audit, docs/ACTIVE_FALSE_POSITIVE_AUDIT.md):
# Die "requirements:"-Regel unten prüft RAM-Größe, CPU-Tier und dass das
# Gehäuse NICHT als Tiny/Mini/USFF/SFF/AiO erkannt wird (case.exclude_
# categories) -- sie verlangt aber nicht, dass überhaupt ein Gehäuse
# vorhanden ist. matcher.py::_case_meets_requirement() behandelt "kein
# erkennbares Gehäuse" bewusst als ERFÜLLT (Kommentar dort: neutral, kein
# Fehlverhalten des Detectors). Für bare Komponenten-Bundles (Mainboard +
# CPU + RAM, kein Gehäuse im Angebot) ist das aber genau der Fall, der
# fälschlich durchrutscht -- ein "Aufrüstkit" ersetzt per Definition nur
# Teile eines bereits vorhandenen PCs, ist aber kein "komplettes System".
# Bestätigt gegen den echten found.json-Korpus (69 aktuell matchende
# Titel, echte Preise): 27 reale Fehltreffer über 2 Muster, 0 Kollisionen
# mit den verbleibenden 42 echten Notebook-/Business-PC-Treffern (auch
# explizit gegen Gehäuse-/Tower-Nennungen in den geflaggten Titeln
# geprüft).
#
# 1. "mainboard"/"motherboard" (bare Wort): identisches, bereits in
#    notebook_resell.yaml etabliertes Muster (siehe dortige Begründung,
#    "Lenovo ThinkPad X390 Mainboard..." NM-B891) -- ein bares Mainboard-
#    Ersatzteil trägt oft eine eigene RAM-Angabe, die hier faelschlich
#    als RAM-Anforderung des Gesamtsystems gewertet wird.
# 2. "aufrüstkit"/"aufrüstbundle" (bare Wort, NEU -- kein Aequivalent in
#    notebook_resell.yaml): "Aufrüstkit"/"Aufrüstbundle" ist ein
#    eindeutiger deutscher Fachbegriff fuer ein Nachruest-Set (Mainboard+
#    CPU+RAM, ohne Gehaeuse) -- bezeichnet nie ein komplettes System.
#    21+3 reale Treffer, alle nach identischem Muster "PC Aufrüstkit
#    Bundle [CPU] bis [RAM] mit [Mainboard-Modell]", keiner davon nennt
#    ein Gehaeuse.
#
# Bewusst NICHT (P1/P2, siehe Audit-Doku, gleiche Root-Cause aber kein
# eindeutiges Signalwort): bare "bundle"/"kit" -- zu generisch, würde
# auch echte Komplettsystem-Angebote mit Zubehoer-Bundle treffen
# (Kollisionsrisiko nicht ausgeschlossen, kein sicherer Fix ohne
# zusaetzlichen Gehaeuse-Nachweis-Mechanismus).
exclude_category:
  - "mainboard"
  - "motherboard"
  - "aufrüstkit"
  - "aufrüstbundle"

rules:
  - label: "Office-PC (Mindestanforderung erfüllt)"
    # Phase 7.1: stabiler Gruppierungs-Schluessel fuer die Preishistorie.
    # Bisher nur eine Regel in dieser Kategorie -- Modell = Kategorie.
    price_history_model: "office_pc"
    requirements:
      min_ram_gb: 8
      ram_type_exclude:
        - "DDR3"
      min_cpu:
        intel:
          min_tier_rank: 5   # i5 oder besser (i5=5, i7=7, i9=9)
          min_generation: 8  # 8. Generation oder neuer
        amd:
          min_tier_rank: 5   # Ryzen 5 oder besser
          min_generation: 2000  # 2000er-Serie oder neuer
      case:
        exclude_categories:
          - "excluded"       # kein Tiny/Mini/USFF/SFF/All-in-One
      requires_dedicated_gpu: false  # optional, schließt PCs MIT GPU nicht aus
    max_price: 300
    deal_rating: "Okay"
    # Verhandlungs-Assistent (STATUS.md Abschnitt 16, Punkt 7), aktiviert
    # analog zum GPU-Muster (rules/gpu.yaml). Bewusst NICHT
    # "hardware_qualitaet" als Komponente: diese Regel hat deal_rating
    # "Okay" (Basis-Score 45, siehe scoring/deal_score.py::
    # _hardware_qualitaet_score()), max. erreichbarer Wert mit CPU-/RAM-
    # Headroom-Bonus waere 60 -- ein Schwellenwert von 70 (wie bei GPU)
    # waere hier NIE erreichbar (identisches Problem wie bei der GPU-
    # "Guter Preis"-Regel, siehe Abschnitt 16). Stattdessen "ausstattung"
    # (SSD/dedizierte GPU, siehe _ausstattung_score(), 0/50/100): passt
    # inhaltlich besser zum Auftrag ("Optional: SSD, hochwertiges
    # Netzteil" als Kaufargument fuer einen ueberteuerten Office-PC).
    # Schwelle 50 = mindestens EIN Zusatzmerkmal (SSD ODER dedizierte
    # GPU) muss vorhanden sein, sonst kein Verhandlungskandidat.
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 50
    negotiation_score_component: "ausstattung"
