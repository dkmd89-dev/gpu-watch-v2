# ============================================================
# iPhone (Nischen-/Kategorien-Erweiterung, YAML-basiert)
# ============================================================
# Rein additiv -- kein Python-Code geaendert (Discovery ueber
# categories/registry.py, siehe dortiger Docstring: jede *.yaml in
# rules/ ausser _global.yaml wird automatisch als Kategorie erkannt).
#
# ARCHITEKTUR-ENTSCHEIDUNG: Titel-Keyword-Matching (wie rules/gpu.yaml,
# rules/retro_konsolen.yaml), KEIN "requirements:"-Block (wie
# office_pc.yaml) -- fuer iPhones existiert kein Hardware-Detector.
#
# TEILPHRASEN-KONFLIKTE (allgemeines Matching-Prinzip, nicht nur
# iPhone-spezifisch -- gilt analog fuer Air/Air M2, 13/13 mini,
# 15/15 Plus etc.): werden ueber gezielte "exclude"-Begriffe je Regel
# innerhalb der Modellhierarchie verhindert. Konkret hier: "iPhone 13
# Pro" ist Teilphrase von "iPhone 13 Pro Max" -> die "Pro"-Regel
# schliesst "pro max" aus; die Basis-Regel ("iPhone 13") schliesst
# "mini"/"plus"/"pro" aus, da alle Varianten "iPhone 13" als Teilstring
# enthalten.
#
# PREIS-TIER-EINHEIT: jede Regel bildet genau eine marktuebliche
# Verkaufsvariante ab (Generation x Variante x Speicherstufe), abgebildet
# als eigener price_history_model-Wert (z.B. "iphone_15_pro_max_512gb").
# Nutzt die bestehende price_stats.py-Gruppierung nach "model" ohne
# Code-Aenderung -- jede Variante erhaelt dadurch automatisch eigene
# Marktpreis-Statistik/Trend (siehe price_history.py/price_stats.py).
#
# ICLOUD-/AKTIVIERUNGSSPERRE + VERTRAGSBINDUNG: kategorie-eigener
# Ausschluss (exclude_category), da exclude_global (_global.yaml)
# dieses Kriterium bisher nicht abdeckt und es fachlich nur fuer
# Apple-Geraete (Wiederverkaufsrisiko) relevant ist.
#
# min_vram_gb: 0 -- deaktiviert den globalen VRAM-Check (_vram_gb()
# erkennt jede "<Zahl>GB"-Angabe im Titel, hier: die Speichergroesse
# des iPhones selbst -- ohne Override wuerde das faelschlich als
# "VRAM zu niedrig" interpretiert und das Angebot verworfen).
#
# SCORING: price-dominant (analog Retro-Konsolen/Vintage-Elektronik).
# "ausstattung" bewusst 0: _ausstattung_score() ist fest an die
# PC-spezifischen Detector-Signale has_ssd/has_dedicated_gpu gekoppelt
# und liefert fuer iPhones nur den neutralen Platzhalter-Wert, kein
# echtes Differenzierungssignal. Die gewuenschte Speicher-Differenzierung
# (z.B. 512GB vs. 128GB) erfolgt stattdessen granular ueber die
# Preis-Tier-Struktur oben (siehe price_history_model) -- keine
# Aenderung an _ausstattung_score() (siehe Freigabe-Entscheidung).
#
# PREISGRENZEN SIND PLATZHALTER (analog allen bisherigen Nischen-
# Kategorien): mangels vorhandener price_history-Datenpunkte grob
# geschaetzt. Muessen nach ausreichend gesammelten Scan-Daten anhand
# echter Marktpreise nachkalibriert werden.
# ============================================================

category: "iphone"
label: "iPhone"

min_vram_gb: 0

notify_max_price: 150

search_terms:
  - "iPhone 11"
  - "iPhone 12"
  - "iPhone 13"
  - "iPhone 14"
  - "iPhone 15"
  - "iPhone 16"

# Kategorie-eigene Ausschluesse (zusaetzlich zu exclude_global aus
# _global.yaml). Wiederverkaufsrisiko: gesperrte/vertragsgebundene
# Geraete sind fuer den Zweck dieses Bots wertlos bzw. riskant.
exclude_category:
  - "icloud"
  - "aktivierungssperre"
  - "activation lock"
  - "mit vertrag"
  - "vertragsgebunden"
  - "simlock"
  - "sim-lock"
  - "netlock"
  - "blacklist"
  - "gesperrt"

  # Phase 15 (kontrollierter Review, "Service/Modding-Fix"): Reparatur-/
  # Modding-DIENSTLEISTUNGS-Angebote statt Geraeteverkauf. Bewusst als
  # Mehrwort-Phrase, NICHT bare "service" -- ein bare Exclude waere fuer
  # Geraete-Zustandsbeschreibungen riskant.
  - "modding service"
  - "reparatur service"
  - "repair service"

  # Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): unbedingte
  # Ausschlüsse für Standalone-Gehäuse-/Shell-Angebote, die nicht über die
  # kontextbewusste "gehäuse"-Prüfung unten laufen (zusammengesetzte
  # Wörter/englische Begriffe, siehe handhelds.yaml-Begründung).
  - "ersatzgehäuse"
  - "leergehäuse"
  - "wechselgehäuse"
  - "replacement shell"
  - "back shell"
  - "shell replacement"
  - "backplate"
  - "replacement housing"
  - "housing replacement"

# Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): "gehäuse"
# ist zweideutig (lose Ersatzschale/Backcover vs. Zustandsbeschreibung
# eines kompletten iPhones, z.B. "Gehäuse minimal verkratzt") -- schließt
# daher nur aus, wenn im GESAMTEN Titel kein Kontextbegriff vorkommt
# (siehe matcher.py::_any_conditional_exclude_presence(), ausführliche
# Begründung in handhelds.yaml).
exclude_category_unless_also_contains:
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

