    - "und"
    - "sowie"
  account:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"

  # Typische lose Controller-/Bedien- und Ersatzteile
  controller:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  joystick:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
