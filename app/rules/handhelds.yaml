category: "handhelds"
label: "Handheld-Konsolen & PC-Handhelds"

scan_priority: 9
notify_max_price: 250

search_terms:
  - "Nintendo 3DS"
  - "3DS XL"
  - "New 3DS"
  - "2DS XL"
  - "PS Vita"
  - "PSVita"
  - "Steam Deck"
  - "SteamDeck"
  - "ROG Ally"
  - "Lenovo Legion Go"

exclude_category:
  - "hülle"
  - "case"
  - "tasche"
  - "schutzfolie"
  - "glas"
  - "grips"
  - "sd karte"
  - "dock"
  - "ladestation"
  - "ersatzteil"
  - "display"
  - "akku"
  - "ovp nur"
  - "spiel"
  - "spielesammlung"
  - "spiele sammlung"
  - "modul"
  - "cartridge"
  # Phase 14 (Data-Quality-Fix): bisher fehlende Zubehoer-/Ersatzteil-
  # Begriffe.
  - "netzteil"
  - "ladekabel"
  - "kabel"
  - "ladegerät"
  - "anleitung"

  # Phase 15 (kontrollierter Review, "Service/Modding-Fix").
  - "modding service"
  - "reparatur service"
  - "repair service"

  # Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix").
  - "ersatzgehäuse"
  - "leergehäuse"
  - "wechselgehäuse"
  - "replacement shell"
  - "back shell"
  - "shell replacement"
  - "backplate"
  - "replacement housing"
  - "housing replacement"

# "gehäuse" ist zweideutig: lose Ersatzschale vs. Zustandsbeschreibung eines
# kompletten Geräts. Deshalb nur dann ausschließen, wenn kein Zustandskontext
# im gesamten Titel vorkommt.
exclude_category_unless_also_contains:
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"

# Phase 16: Kontextbewusste Ausschlüsse gegen häufige False-Positive-Quellen.
# Ein Standalone-Zubehör-/Software-Begriff blockiert den Treffer. Wird derselbe
# Begriff als Teil eines echten Geräte-Bundles genannt ("mit", "inkl.", "+",
# "und", "sowie"), bleibt das komplette Handheld-Angebot matchbar.
# Wichtig: diese Begriffe stehen NICHT in exclude_category, weil dort ein
# kontextloser Ausschluss auch legitime Bundles fälschlich entfernen würde.
exclude_category_unless_preceded_by:
  # Spiele / Software / digitale Inhalte
  spiele:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  game:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  games:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  software:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  download:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  "digital code":
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  key:
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  dlc:
    - "inkl."
    - "inkl"
    - "mit"
