category: "handhelds"
label: "Handheld-Konsolen & PC-Handhelds"

scan_priority: 9
notify_max_price: 250

search_terms:
  - "Nintendo 3DS"
  - "3DS XL"
  - "New 3DS"
  - "2DS XL"
  - "PS Vita"
  - "PSVita"
  - "Steam Deck"
  - "SteamDeck"
  - "ROG Ally"
  - "Lenovo Legion Go"

exclude_category:
  - "hülle"
  - "case"
  - "tasche"
  - "schutzfolie"
  - "glas"
  - "grips"
  - "sd karte"
  - "sd karten"
  - "dock"
  - "ladestation"
  - "ersatzteil"
  - "display"
  - "akku"
  - "ovp nur"
  - "spiel"
  - "spielesammlung"
  - "spiele sammlung"
  - "modul"
  - "cartridge"
  # Phase 14 (Data-Quality-Fix): bisher fehlende Zubehoer-/Ersatzteil-
  # Begriffe. Grund: Steam Deck / ROG Ally / Lenovo Legion Go sind -- anders
  # als "3ds"/"ps vita" -- eindeutige, mehrwortige Produktnamen ohne
  # generisches Kurzwort. Die Suchbegriffe dieser Kategorie SIND die
  # Markennamen selbst (siehe search_terms oben), d.h. JEDES gescrapte
  # Angebot -- ob echtes Geraet oder reines Zubehoer -- enthaelt den
  # Markennamen zwangslaeufig im Titel. Eine zusaetzliche require_all_of-
  # Gruppe mit Positivbegriffen (retro_konsolen-Muster) haette hier KEINE
  # Trennschaerfe: Zubehoer-Anzeigen wie "Netzteil fuer Steam Deck"
  # enthalten "steam deck" genauso wie echte Geraete-Anzeigen -- eine
  # zweite Gruppe, die (fuer Fall "nacktes 'Steam Deck'" zwingend noetig)
  # auch die Markenbegriffe selbst enthalten muesste, waere immer erfuellt
  # und damit wirkungslos (siehe PHASE14_DATA_QUALITY_REPORT.md /
  # PHASE14_MATCHING_FIX_REPORT.md). Die einzige wirksame Trennung ist
  # daher -- analog zum retro_konsolen-Prinzip "praezise Phrasen statt
  # Pauschal-Exclude" -- eine gezielt erweiterte Exclude-Liste:
  - "netzteil"
  - "ladekabel"
  - "kabel"
  - "ladegerät"
  - "anleitung"

  # Phase 15 (kontrollierter Review, "Service/Modding-Fix"): Reparatur-/
  # Modding-DIENSTLEISTUNGS-Angebote ("kein Geraet wechselt den Besitzer")
  # statt Geraeteverkauf, siehe PHASE15_OPTIMIERUNG.md-Folgereview. Bewusst
  # als Mehrwort-Phrase, NICHT als bare "service"/"modding" -- ein bare
  # Exclude waere fuer Geraete-Zustandsbeschreibungen riskant. Reines
  # Additiv, kein bestehendes Feld veraendert.
  - "modding service"
  - "reparatur service"
  - "repair service"

  # Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): unbedingte
  # Ausschlüsse für Standalone-Gehäuse-/Shell-Angebote, die NICHT über die
  # kontextbewusste "gehäuse"-Prüfung unten laufen (zusammengesetzte Wörter
  # -- "ersatzgehäuse" enthält "gehäuse" nicht als eigenes Wort, siehe
  # matcher.py::_contains_term()-Wortgrenzen-Docstring -- bzw. englische
  # Begriffe, die "gehäuse" gar nicht enthalten). Alle hier gelisteten
  # Phrasen sind eindeutige Produktbezeichnungen für lose Ersatzteile,
  # keine Zustandsbeschreibungen eines kompletten Geräts.
  - "ersatzgehäuse"
  - "leergehäuse"
  - "wechselgehäuse"
  - "replacement shell"
  - "back shell"
  - "shell replacement"
  - "backplate"
  - "replacement housing"
  - "housing replacement"

  # FIX (kontrollierter Review, found.json-Audit): weitere Standalone-
  # Zubehör-/Ersatzteil-Muster, die bisher NICHT abgedeckt waren (24 von
  # 38 sichtbaren found.json-Einträgen dieser Kategorie, u.a. "Original
  # Valve Steam Deck Docking Station" 119,99EUR Top-Deal, "Lenovo Legion
  # Go Gaming Mainboard Handheld Reparatur Repair" 229EUR Top-Deal,
  # "Kingston NV3 2TB SSD M.2 2230 NVMe PCIe 4.0 - Steam Deck, ROG Ally,
  # etc." 180EUR Top-Deal). "dockingstation"/"docking station" ergänzt
  # das bestehende bare "dock" (Kompositum-/Wortgrenzen-Lücke, analog
  # "ladekabel"/"kabel"). "joystick"/"thumbstick" bewusst NICHT hier,
  # sondern unten in exclude_category_unless_also_contains -- Stick-Drift
  # ist bei Steam Deck/ROG Ally ein bekanntes, oft in echten
  # Geräte-Zustandsbeschreibungen genanntes Merkmal (verifiziert: "ROG
  # Ally X, rechter Joystick minimales Drift, ansonsten neuwertig 512GB"
  # ist ein echtes Geräteangebot, kein Zubehör), ein bare Exclude wäre
  # hier riskant (identisches Muster wie beim Gehäuse/Shell-Fix).
  - "dockingstation"
  - "docking station"
  - "memory card"
  - "microsd"
  - "m.2 ssd"
  - "mainboard"
  - "motherboard"
  - "for parts"
  - "not working"
  - "batterieabdeckung"

  # FIX (Ruleset-Qualitaetssystem, 251-Listing-Stichprobe 2026-08-14): "ssd"/
  # "festplatte" und "headset"/"kopfhörer"/"in-ear" ergaenzt -- bare Woerter,
  # da kein Steam-Deck/ROG-Ally/3DS/PS-Vita-GERAET jemals selbst als "SSD"
  # oder "Headset" beworben wird (identisches Prinzip wie die bereits
  # vorhandenen bare Excludes "akku"/"display"). Das bestehende "m.2 ssd"
  # greift nur bei unmittelbarer Wortfolge ("M.2 2230 SSD" mit Zahl
  # dazwischen bisher nicht erfasst). Blast Radius gemessen: 4 SSD- + 1
  # Headset-Treffer, 0 Kollisionen.
  - "ssd"
  - "festplatte"
  - "headset"
  - "kopfhörer"
  - "in-ear"

  # FIX (kontrollierter Review, DASHBOARD_MATCH_FORENSICS.md): weitere
  # Standalone-Zubehör-Muster, die bei Regeln mit nur EINER
  # require_all_of-Gruppe (Steam Deck, ROG Ally/Legion Go -- siehe
  # Begründung oben, Markenname selbst ist die einzige Bedingung)
  # bisher durchrutschten, u.a. "USB-C HUB für Steam Deck HDMI 4k 60Hz
  # USB 3.0 PD" und "Steam Deck Skin Faceplate Schutz Klebefolie Design
  # Vinyl Aufkleber Skins OLED". Alle sechs Begriffe eindeutige
  # Zubehör-Produktbezeichnungen (kein Zustands-/Bundle-Wort, keine
  # Doppeldeutigkeit wie "gehäuse"/"joystick" oben -- daher bare Excludes,
  # kein exclude_category_unless_...-Mechanismus nötig). Verifiziert
  # gegen alle 22 damals sichtbaren TRUE_POSITIVE-Treffer dieser
  # Kategorie: 0 Kollisionen.
  - "hub"
  - "skin"
  - "faceplate"
  - "vinyl"
  - "klebefolie"
  - "aufkleber"
  - "ladeadapter"
  - "reisetasche"

  # Nachtrag (Active-False-Positive-Audit, docs/ACTIVE_FALSE_POSITIVE_AUDIT.md,
  # Realdatenabgleich gegen found.json, 1736 eindeutige Titel): 12 neue
  # Excludes für 8 real aktuell laufende Standalone-Zubehör-/Ersatzteil-/
  # Software-Fehltreffer-Muster (zusammen 10 betroffene Titel -- einzelne
  # Muster wie "Ersatzstift/Touchpen/Stylus" decken mehrere Titel ab),
  # alle 0 Kollisionen gegen den vollständigen Korpus (jeder Begriff kommt
  # AUSSCHLIESSLICH in den jeweils gefundenen Fehltreffer-Titeln vor,
  # verifiziert inkl. aller Handheld-Markennamen). Bewusst nur real
  # belegte Begriffe -- KEINE hypothetischen Ergänzungen wie
  # "ersatzknopf"/"leerkarton"/"flashkarte" (0 Treffer im Korpus, nicht
  # Teil dieses Fixes).
  - "displayschutz" # Kompositum, von bare "display" nicht erfasst (Wortgrenzen)
  - "ersatzstift"
  - "ersatzstifte" # Pluralform, von "ersatzstift" nicht erfasst (Wortgrenzen)
  - "touchpen"
  - "stylus"
  - "schutzhülle" # Kompositum, von bare "hülle" nicht erfasst -- bereits in
  # controller.yaml/konsolen_bundles.yaml als eigener Begriff etabliert
  - "grip" # bereits in controller.yaml etabliert, fehlte hier
  - "leere box" # leere Sammler-Verpackung ohne Gerät, kein "OVP"-Text im Titel
  - "spielkarte"
  - "flash karte" # Flashcart-/Speicherkarten-Produkt, kein Gerät
  - "spiele für" # Pluralform zu "spiel" -- "Spiele für X Konsole" ist ein
  # Software-Angebot, keine Konsole (identisches Muster wie "spiel für" in
  # konsolen_bundles.yaml)
  # "Controller Rechts"/"Controller Links": bei Legion Go trennbare
  # Controller-Hälften -- ein Angebot nur EINER Hälfte ist Ersatzteil,
  # kein Komplettgerät. Enge Phrase (kein bare "controller", das würde
  # echte Bundle-Beschreibungen wie "Legion Go inkl. beide Controller"
  # treffen).
  - "controller rechts"

# Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): "gehäuse"
# ist -- anders als die o.g. Begriffe -- ZWEIDEUTIG: es bezeichnet sowohl
# lose Ersatzschalen ("Nintendo 3DS XL Gehäuse Blau") als auch die
# Zustandsbeschreibung eines kompletten Geräts ("Gehäuse leicht
# vergilbt/verkratzt"). Ein bare exclude_category-Eintrag würde daher auch
# echte Geräte-Angebote fälschlich blockieren (siehe kontrollierter Review,
# PROJEKTSTAND_KOMPLETT.md). Stattdessen: schließt "gehäuse" nur aus, wenn
# im GESAMTEN Titel KEIN Begriff aus der Kontextliste vorkommt (siehe
# matcher.py::_any_conditional_exclude_presence()).
exclude_category_unless_also_contains:
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"
  # FIX (kontrollierter Review, found.json-Audit): "joystick"/"thumbstick"
  # sind wie "gehäuse" zweideutig -- Standalone-Ersatzteil-Angebote
  # ("tmr joysticks für rog ally x") vs. Stick-Drift als übliche
  # Zustandsbeschreibung eines echten Geräts ("ROG Ally, rechter Joystick
  # minimales Drift, ansonsten neuwertig"). Gleicher Mechanismus wie oben,
  # eigene, stick-spezifische Kontextliste (Housing-Zustandswörter wie
  # "vergilbt" sind hier nicht einschlägig). Pluralform "joysticks"/
  # "thumbsticks" als eigener Schlüssel noetig -- Wortgrenzen-Matching
  # (_contains_term()) erkennt "joystick" nicht als Teil von "joysticks"
  # (identisches Muster wie "spiel"/"spiele").
  joystick:
    - "drift"
    - "ausgeleiert"
    - "verschlissen"
    - "neuwertig"
    - "gebraucht"
    - "funktioniert"
    - "funktionsfähig"
  joysticks:
    - "drift"
    - "ausgeleiert"
    - "verschlissen"
    - "neuwertig"
    - "gebraucht"
    - "funktioniert"
    - "funktionsfähig"
  thumbstick:
    - "drift"
    - "ausgeleiert"
    - "verschlissen"
    - "neuwertig"
    - "gebraucht"
    - "funktioniert"
    - "funktionsfähig"
  thumbsticks:
    - "drift"
    - "ausgeleiert"
    - "verschlissen"
    - "neuwertig"
    - "gebraucht"
    - "funktioniert"
    - "funktionsfähig"

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

rules:
  # ============================================================
  # NINTENDO 3DS / 2DS XL (Enorm begehrte Sammler/Flipping-Objekte)
  # ============================================================
  - label: "Nintendo New 3DS / 3DS XL / 2DS XL ★ Top-Deal"
    price_history_model: "handheld_nintendo_3ds"
    require_all_of:
      - ["3ds", "2ds", "3dsxl", "2dsxl"]
      - ["xl", "new 3ds", "new 2ds", "konsole"]
    exclude:
      - "defekt"
      - "bastler"
      - "ohne funktion"
    min_vram_gb: 0
    max_price: 65
    deal_rating: "Top-Deal"

  - label: "Nintendo New 3DS / 3DS XL / 2DS XL 👍 Guter Preis"
    price_history_model: "handheld_nintendo_3ds"
    require_all_of:
      - ["3ds", "2ds", "3dsxl", "2dsxl"]
      - ["xl", "new 3ds", "new 2ds", "konsole"]
    exclude:
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 95
    deal_rating: "Guter Preis"

  # ============================================================
  # SONY PS VITA (Sehr beliebt bei Sammlern / Homebrew)
  # ============================================================
  - label: "PlayStation Vita (PCH-1000 / PCH-2000) ★ Top-Deal"
    price_history_model: "handheld_ps_vita"
    require_all_of:
      - ["ps vita", "psvita", "playstation vita"]
      - ["konsole", "bundle", "set", "ovp", "system"]
    exclude:
      - "defekt"
      - "bastler"
      - "hülle nur"
      - "tasche"
      - "display nur"
      - "tv"
    min_vram_gb: 0
    max_price: 60
    deal_rating: "Top-Deal"

  - label: "PlayStation Vita (PCH-1000 / PCH-2000) 👍 Guter Preis"
    price_history_model: "handheld_ps_vita"
    require_all_of:
      - ["ps vita", "psvita", "playstation vita"]
      - ["konsole", "bundle", "set", "ovp", "system"]
    exclude:
      - "defekt"
      - "bastler"
      - "hülle nur"
      - "tasche"
      - "display nur"
      - "tv"
    min_vram_gb: 0
    max_price: 90
    deal_rating: "Guter Preis"

  # ============================================================
  # VALVE STEAM DECK (LCD / OLED)
  # ============================================================
  - label: "Valve Steam Deck ★ Top-Deal"
    price_history_model: "handheld_steam_deck"
    require_all_of:
      - ["steam deck", "steamdeck"]
    exclude:
      - "defekt"
      - "bastler"
      - "dock nur"
    min_vram_gb: 0
    max_price: 180
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0

  - label: "Valve Steam Deck 👍 Guter Preis"
    price_history_model: "handheld_steam_deck"
    require_all_of:
      - ["steam deck", "steamdeck"]
    exclude:
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 240
    deal_rating: "Guter Preis"

  # ============================================================
  # ASUS ROG ALLY / LEGION GO (High-End PC Handhelds)
  # ============================================================
  - label: "Asus ROG Ally / Lenovo Legion Go ★ Top-Deal"
    price_history_model: "handheld_pc_preator"
    require_all_of:
      - ["rog ally", "legion go"]
    exclude:
      - "defekt"
      - "bastler"
      - "case"
    min_vram_gb: 0
    max_price: 250
    deal_rating: "Top-Deal"

  - label: "Asus ROG Ally / Lenovo Legion Go 👍 Guter Preis"
    price_history_model: "handheld_pc_preator"
    require_all_of:
      - ["rog ally", "legion go"]
    exclude:
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 330
    deal_rating: "Guter Preis"
