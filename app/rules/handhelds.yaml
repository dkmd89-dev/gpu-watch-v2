  # Zubehörformulierung, die fast immer ein Angebot FÜR das Gerät beschreibt.
  - "für steam deck"
  - "for steam deck"
  - "für rog ally"
  - "for rog ally"
  - "für legion go"
  - "for legion go"
  - "für lenovo legion go"
  - "for lenovo legion go"
  - "compatible with steam deck"
  - "compatible with rog ally"
  - "compatible with legion go"

# "gehäuse" ist zweideutig: lose Ersatzschale vs. Zustandsbeschreibung eines
# kompletten Geräts. Deshalb nur dann ausschließen, wenn kein Zustandskontext
# im gesamten Titel vorkommt.
exclude_category_unless_also_contains:
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"

# Kontextbewusste Ausschlüsse: Zubehör/Software allein blockiert, Zubehör
# als Bestandteil eines echten Geräte-Bundles bleibt erlaubt. Diese Begriffe
# stehen deshalb NICHT in exclude_category.
exclude_category_unless_preceded_by:
  spiele: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  game: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  games: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  software: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  download: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  "digital code": ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  key: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  dlc: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  account: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  controller: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  joystick: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  thumbstick: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  "analog stick": ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  button: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  buttons: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  trigger: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  bumper: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  "replacement part": ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  ersatzteil: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  netzteil: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  ladekabel: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  ladegerät: ["inkl.", "inkl", "mit", "+", "und", "sowie"]
  anleitung: ["inkl.", "inkl", "mit", "+", "und", "sowie"]

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

rules:
  - label: "Nintendo New 3DS / 3DS XL / 2DS XL ★ Top-Deal"
    price_history_model: "handheld_nintendo_3ds"
    require_all_of:
      - ["3ds", "2ds", "3dsxl", "2dsxl"]
      - ["xl", "new 3ds", "new 2ds", "konsole"]
    exclude: ["defekt", "bastler", "ohne funktion"]
    min_vram_gb: 0
    max_price: 65
    deal_rating: "Top-Deal"

  - label: "Nintendo New 3DS / 3DS XL / 2DS XL 👍 Guter Preis"
    price_history_model: "handheld_nintendo_3ds"
    require_all_of:
      - ["3ds", "2ds", "3dsxl", "2dsxl"]
      - ["xl", "new 3ds", "new 2ds", "konsole"]
    exclude: ["defekt", "bastler"]
    min_vram_gb: 0
    max_price: 95
    deal_rating: "Guter Preis"

  - label: "PlayStation Vita (PCH-1000 / PCH-2000) ★ Top-Deal"
    price_history_model: "handheld_ps_vita"
    require_all_of:
      - ["ps vita", "psvita", "playstation vita"]
      - ["konsole", "bundle", "set", "ovp", "system"]
    exclude: ["defekt", "bastler", "hülle nur", "tasche", "display nur", "tv"]
    min_vram_gb: 0
    max_price: 60
    deal_rating: "Top-Deal"

  - label: "PlayStation Vita (PCH-1000 / PCH-2000) 👍 Guter Preis"
    price_history_model: "handheld_ps_vita"
    require_all_of:
      - ["ps vita", "psvita", "playstation vita"]
      - ["konsole", "bundle", "set", "ovp", "system"]
    exclude: ["defekt", "bastler", "hülle nur", "tasche", "display nur", "tv"]
    min_vram_gb: 0
    max_price: 90
    deal_rating: "Guter Preis"

  - label: "Valve Steam Deck ★ Top-Deal"
    price_history_model: "handheld_steam_deck"
    require_all_of:
      - ["steam deck", "steamdeck"]
    exclude: ["defekt", "bastler", "dock nur"]
    min_vram_gb: 0
    max_price: 180
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0

  - label: "Valve Steam Deck 👍 Guter Preis"
    price_history_model: "handheld_steam_deck"
    require_all_of:
      - ["steam deck", "steamdeck"]
    exclude: ["defekt", "bastler"]
    min_vram_gb: 0
    max_price: 240
    deal_rating: "Guter Preis"

  - label: "Asus ROG Ally / Lenovo Legion Go ★ Top-Deal"
    price_history_model: "handheld_pc_preator"
    require_all_of:
      - ["rog ally", "legion go"]
    exclude: ["defekt", "bastler", "case"]
    min_vram_gb: 0
    max_price: 250
    deal_rating: "Top-Deal"

  - label: "Asus ROG Ally / Lenovo Legion Go 👍 Guter Preis"
    price_history_model: "handheld_pc_preator"
    require_all_of:
      - ["rog ally", "legion go"]
    exclude: ["defekt", "bastler"]
    min_vram_gb: 0
    max_price: 330
    deal_rating: "Guter Preis"
