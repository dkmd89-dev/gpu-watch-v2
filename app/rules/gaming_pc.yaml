# ============================================================
# Gaming-PC Regel-Matrix (Phase 5)
# ============================================================
# Nutzt denselben Mechanismus wie office_pc.yaml (Hardware-Mindest-
# anforderungen über categories/detectors/, ausgewertet über
# matcher._evaluate_hardware_requirements()). RAM/CPU/Gehäuse-
# Mindestanforderung ist laut Auftrag IDENTISCH zu Office-PC,
# zusätzlich wird eine dedizierte GPU verlangt.
#
# Zwei gestaffelte Regeln (analog zur Top-Deal/Okay-Staffelung bei
# den GPU-Regeln in gpu.yaml):
#   1. "Top-Deal": dedizierte GPU MUSS aus der im Auftrag genannten
#      Vorzugsliste stammen (GpuMatch.is_preferred, siehe
#      categories/detectors/gpu.py) -> preferred_gpu_only: true
#   2. "Okay": irgendeine dedizierte GPU genügt (z.B. eine neuere,
#      nicht in der Vorzugsliste gepflegte Karte)
# Die zuerst passende Regel gewinnt (siehe evaluate()), Top-Deal
# steht daher vor Okay.
#
# ANNAHME (bitte prüfen): Preisgrenzen sind Platzhalter, da keine
# Marktdaten für komplette Gaming-PCs vorliegen (anders als bei den
# einzelnen GPU-Preisen in gpu.yaml). Nach dem ersten echten Scan
# bitte kalibrieren.
# ============================================================

category: "gaming_pc"
label: "Gaming-PC"

# Notification-Gate-Folgeschritt: eigenes Preislimit fuer den ntfy-Push.
# Reale Scan-Daten zeigten Gaming-PCs bisher bei 200-550€ (Median ca. 465€),
# nie unter 200€ -- ein pauschales 150€-Limit haette hier strukturell NIE
# gegriffen. 400€ orientiert sich an der Top-Deal-Preisgrenze der Regeln
# oben und deckt damit die guenstigere Haelfte der beobachteten Treffer ab.
# Bei Bedarf anpassen.
notify_max_price: 400

# ------------------------------------------------------------
# DATENSAMMLUNG-MODUS (temporaer, siehe STATUS.md "Gaming-PC-Preis-
# kalibrierung"): price_history.jsonl wird NUR bei einem Regel-Match
# geschrieben (append_price_point() in app.py) -- die bisherige
# "Okay"-Obergrenze von 550€ hat die Marktpreis-Statistik dadurch
# zensiert (15% aller Datenpunkte lagen exakt an dieser Deckelung,
# echte Preise darueber wurden nie erfasst). notify_max_price bleibt
# bewusst bei 400€ (siehe oben) -- nur das Erfassungsfenster (max_price
# der "Okay"-Regel unten) wird angehoben, damit fuer eine Sammelphase
# unzensierte Daten bis 750€ geloggt werden. Sobald genug frische
# Datenpunkte vorliegen: echte Kalibrierung (analog SATA-SSD, p5/p10/
# Median via price_stats.compute_price_stats()) und diese Obergrenze
# danach auf einen aus echten Daten hergeleiteten Wert zuruecksetzen.
# ------------------------------------------------------------
search_terms:
  - "Gaming PC"
  - "Gamer PC"
  - "Spiele PC"
  - "Gaming Komplett PC"

# Diese Kategorie WILL komplette PC-Systeme -- bewusst KEIN
# exclude_category (identisch zur Begründung in office_pc.yaml).

rules:
  - label: "Gaming-PC (Top-Deal, bevorzugte GPU)"
    # Phase 7.1: beide Regeln dieser Kategorie teilen sich denselben
    # price_history_model-Schluessel -- Top-Deal/Okay sind Rating-Stufen
    # DESSELBEN Bundle-Typs "Gaming-PC", keine unterschiedliche Hardware
    # (anders als z.B. die vielen Einzel-GPU-Modelle in gpu.yaml).
    price_history_model: "gaming_pc"
    requirements:
      min_ram_gb: 8
      ram_type_exclude:
        - "DDR3"
      min_cpu:
        intel:
          min_tier_rank: 5
          min_generation: 8
        amd:
          min_tier_rank: 5
          min_generation: 2000
      case:
        exclude_categories:
          - "excluded"
      requires_dedicated_gpu: true
      preferred_gpu_only: true
    max_price: 400
    deal_rating: "Top-Deal"

  - label: "Gaming-PC (Mindestanforderung erfüllt)"
    price_history_model: "gaming_pc"
    requirements:
      min_ram_gb: 8
      ram_type_exclude:
        - "DDR3"
      min_cpu:
        intel:
          min_tier_rank: 5
          min_generation: 8
        amd:
          min_tier_rank: 5
          min_generation: 2000
      case:
        exclude_categories:
          - "excluded"
      requires_dedicated_gpu: true
    # 550 -> 750: Erfassungsfenster fuer die Datensammlung geoeffnet (siehe
    # Kommentar zu notify_max_price oben). notify_max_price bleibt bei 400€,
    # d.h. Treffer zwischen 550-750€ werden weiterhin NUR gespeichert/im
    # Dashboard gezeigt, loesen aber keine Benachrichtigung aus.
    max_price: 750
    deal_rating: "Okay"
