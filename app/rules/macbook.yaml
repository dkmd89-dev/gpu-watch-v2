# ============================================================
# MacBook (Nischen-/Kategorien-Erweiterung, YAML-basiert)
# ============================================================
# Rein additiv -- kein Python-Code geaendert (Discovery ueber
# categories/registry.py). Gleiche Architektur wie iphone.yaml.
#
# CHIP-GENERATION STATT PRO/MAX-DIFFERENZIERUNG: der Auftrag verlangt
# "Intel vs. M1-M4" als Preis-Tier-Dimension -- NICHT die zusaetzliche
# Unterscheidung M1/M1 Pro/M1 Max innerhalb einer Chip-Generation. Ein
# "MacBook Pro M1 Max"-Titel matcht daher bewusst unter der "M1"-Stufe.
# Falls die feinere Pro/Max-Differenzierung spaeter gewuenscht ist, ist
# das rein additiv (weitere require_all_of-Gruppen je Chip) moeglich.
#
# TEILPHRASEN-KONFLIKTE: "MacBook Air" und "MacBook Pro" sind disjunkte
# Phrasen (keine Teilphrase der jeweils anderen) -- kein zusaetzlicher
# exclude noetig, anders als bei iPhone Pro/Pro-Max.
#
# INTEL-ERKENNUNG: kein "Ix"-Chipname wie bei Apple Silicon -- stattdessen
# ueber "intel"/"i5"/"i7"/"i9" im Titel erkannt (uebliche Verkaeufer-
# Formulierung fuer die Vor-2020/2021-Generation). Titel ohne einen
# dieser Begriffe UND ohne "m1"-"m4" fallen durch keine Regel (bewusste
# Einschraenkung, kein Crash) -- kann bei Bedarf ergaenzt werden.
#
# PREIS-TIER-EINHEIT: wie bei iphone.yaml -- jede Regel = eigener
# price_history_model-Wert (z.B. "macbook_pro_m3_1tb"), nutzt die
# bestehende price_stats.py-Gruppierung ohne Code-Aenderung.
#
# ICLOUD-/AKTIVIERUNGSSPERRE ("Find My Mac"): gleiche Problematik wie
# bei iPhone (Wiederverkaufsrisiko) -- kategorie-eigener Ausschluss.
#
# min_vram_gb: 0 -- Speichergroessen-Zahlen ("512GB") sollen nicht
# faelschlich als zu niedriger VRAM-Wert interpretiert werden.
#
# SCORING: price-dominant, "ausstattung: 0" -- identische Begruendung
# wie bei iphone.yaml (_ausstattung_score() ist an PC-Detector-Signale
# gekoppelt, keine Aenderung daran, siehe Freigabe-Entscheidung).
#
# PREISGRENZEN SIND PLATZHALTER, muessen nach Datensammlung kalibriert
# werden (analog allen bisherigen Nischen-Kategorien).
# ============================================================

category: "macbook"
label: "MacBook"

min_vram_gb: 0

notify_max_price: 150

search_terms:
  - "MacBook Air"
  - "MacBook Pro"

# Kategorie-eigene Ausschluesse (zusaetzlich zu exclude_global aus
# _global.yaml). Identische Begruendung wie bei iphone.yaml.
exclude_category:
  - "icloud"
  - "aktivierungssperre"
  - "activation lock"
  - "find my mac"
  - "mit vertrag"
  - "vertragsgebunden"
  - "blacklist"
  - "gesperrt"

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

