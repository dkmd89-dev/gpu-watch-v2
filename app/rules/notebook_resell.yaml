category: "notebook_resell"
label: "Notebooks (Reselling)"
scan_priority: 6
notify_max_price: 650

# FIX (Stand: 2026-08-08, siehe STATUS.md "Analyse RAM/CPU+Mainboard/
# Notebook"): search_terms sind für die Kleinanzeigen-Volltextsuche
# ausschließlich als AND-Verknüpfung wirksam ("ThinkPad Ryzen" verlangt
# BEIDE Wörter im Titel). Die eigentliche Matching-Regel unten
# ("ThinkPad T14/X13...") verlangt aber gar kein "ryzen" -- nur
# "thinkpad" + Modellcode (t14/t490/x13/x390/l14). Da ThinkPads dieser
# Modellreihen überwiegend mit Intel-CPUs verkauft werden, filterte der
# alte Suchbegriff genau die Mehrheit der eigentlich passenden Angebote
# schon vor der Bewertung heraus -- zu eng, unabhängig vom Preis.
# Ersetzt durch je einen Suchbegriff pro Modellcode aus der
# Matching-Regel, ohne "ryzen"-Einschränkung.
search_terms:
  - "ThinkPad T14"
  - "ThinkPad X13"
  - "ThinkPad T490"
  - "ThinkPad X390"
  - "ThinkPad L14"
  - "Lenovo Legion"
  - "ASUS ROG"
  - "ASUS TUF Gaming"
  - "Acer Nitro 5"
  - "HP Omen"
  - "Gaming Laptop"
  - "Gaming Notebook"

scoring_weights:
  price: 0.50
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0.10
  lieferumfang: 0
  profit: 0.25

exclude_category:
  # defekt/bastler/kaputt/ohne funktion/ersatzteil/leerkarton bereits über
  # exclude_global (_global.yaml) für ALLE Kategorien abgedeckt -- hier
  # nicht dupliziert (siehe Begründung im Chat-Output).
  - "für teile"
  - "displayschaden"
  - "not tested"
  # "netzteil"/"ladekabel"/"tasche"/"hülle"/"karton"/"ovp" bewusst NICHT
  # als bare-word-Exclude: würde auch legitime Notebook-Angebote treffen,
  # die ihr Zubehör als Kaufargument im Titel nennen (z.B. "inkl.
  # Netzteil und Tasche") -- verifiziert, siehe Test unten. Stattdessen
  # präzise auf Einzelteil-Angebote eingegrenzt (kein Notebook dabei).
  - "nur netzteil"
  - "nur ladekabel"
  - "nur tasche"
  - "nur hülle"
  - "i3"
  - "celeron"
  - "pentium"
  - "atom"
  - "core 2 duo"
  - "amd a4"
  - "amd a6"
  - "amd a8"

rules:
  - label: "ThinkPad T14/X13 (Ryzen/Modern) ★ Resell-Top"
    price_history_model: "thinkpad_modern"
    # MATCHING-FIX (Phase 12, Schritt 3): dritte Gruppe ergaenzt --
    # verlangt eine RAM-/Speicher-Groessenangabe im Titel. Ohne dieses
    # Kriterium matchten auch reine Einzelteil-Angebote (Power-Button,
    # Lautsprecher, Gehaeuse, Kuehler/Luefter) statt kompletter Notebooks,
    # da diese ebenfalls "thinkpad"+Modellcode enthalten koennen --
    # bestaetigt durch echte Preishistorie-Daten (vier der guenstigsten
    # Datenpunkte waren Einzelteile ohne jede GB-Angabe, alle echten
    # Komplettgeraete-Angebote enthielten dagegen durchgaengig eine
    # RAM-/SSD-Groesse, siehe PRICE_CALIBRATION_REVIEW.md). Deckt gaengige
    # RAM-/SSD-Groessen ab (4-512GB in ueblichen Zweierpotenz-Schritten
    # sowie 1TB/2TB) -- exaktes Wort-Grenzen-Matching (_contains_term)
    # verlangt die Ziffer direkt an "gb"/"tb" angehaengt (z.B. "16gb"),
    # bewusst KEIN bare "gb"/"ram" als eigener Begriff (wuerde an der
    # Wortgrenzen-Logik ohnehin nicht an Zahlen andocken, siehe
    # matcher.py::_contains_term()-Docstring).
    require_all_of:
      - ["thinkpad", "think pad"]
      - ["t14", "t490", "x13", "x390", "l14"]
      - ["4gb", "8gb", "16gb", "32gb", "64gb", "128gb", "256gb", "512gb", "1tb", "2tb", "ssd", "nvme"]
    exclude:
      - "t420"
      - "t430"
      - "t440"
      - "t450"
      - "t460"
    min_vram_gb: 0
    max_price: 180
    deal_rating: "Top-Deal"

  - label: "ThinkPad T14/X13 (Ryzen/Modern)"
    price_history_model: "thinkpad_modern"
    # MATCHING-FIX (Phase 12, Schritt 3): siehe Resell-Top-Regel oben.
    require_all_of:
      - ["thinkpad", "think pad"]
      - ["t14", "t490", "x13", "x390", "l14"]
      - ["4gb", "8gb", "16gb", "32gb", "64gb", "128gb", "256gb", "512gb", "1tb", "2tb", "ssd", "nvme"]
    exclude:
      - "t420"
      - "t430"
      - "t440"
      - "t450"
      - "t460"
    min_vram_gb: 0
    max_price: 240
    deal_rating: "Guter Preis"

  - label: "Gaming Laptop (RTX 3060) ★ Resell-Top"
    price_history_model: "gaming_laptop_rtx3060"
    require_all_of:
      - ["rtx 3060", "3060m", "3060 gtx"]
      - ["laptop", "notebook", "gaming"]
    min_vram_gb: 0
    max_price: 400
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0

  - label: "Gaming Laptop (RTX 3060)"
    price_history_model: "gaming_laptop_rtx3060"
    require_all_of:
      - ["rtx 3060", "3060m", "3060 gtx"]
      - ["laptop", "notebook", "gaming"]
    min_vram_gb: 0
    max_price: 490
    deal_rating: "Guter Preis"

  - label: "Gaming Laptop (RTX 4060) ★ Resell-Top"
    price_history_model: "gaming_laptop_rtx4060"
    require_all_of:
      - ["rtx 4060", "4060m"]
      - ["laptop", "notebook", "gaming"]
    min_vram_gb: 0
    max_price: 550
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 12.0
