category: "notebook_resell"
label: "Notebooks (Reselling)"
scan_priority: 6
notify_max_price: 650

# FIX (Stand: 2026-08-08, siehe STATUS.md "Analyse RAM/CPU+Mainboard/
# Notebook"): search_terms sind für die Kleinanzeigen-Volltextsuche
# ausschließlich als AND-Verknüpfung wirksam ("ThinkPad Ryzen" verlangt
# BEIDE Wörter im Titel). Die eigentliche Matching-Regel unten
# ("ThinkPad T14/X13...") verlangt aber gar kein "ryzen" -- nur
# "thinkpad" + Modellcode (t14/t490/x13/x390/l14). Da ThinkPads dieser
# Modellreihen überwiegend mit Intel-CPUs verkauft werden, filterte der
# alte Suchbegriff genau die Mehrheit der eigentlich passenden Angebote
# schon vor der Bewertung heraus -- zu eng, unabhängig vom Preis.
# Ersetzt durch je einen Suchbegriff pro Modellcode aus der
# Matching-Regel, ohne "ryzen"-Einschränkung.
search_terms:
  - "ThinkPad T14"
  - "ThinkPad X13"
  - "ThinkPad T490"
  - "ThinkPad X390"
  - "ThinkPad L14"
  - "Lenovo Legion"
  - "ASUS ROG"
  - "ASUS TUF Gaming"
  - "Acer Nitro 5"
  - "HP Omen"
  - "Gaming Laptop"
  - "Gaming Notebook"

scoring_weights:
  price: 0.50
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0.10
  lieferumfang: 0
  profit: 0.25

exclude_category:
  # defekt/bastler/kaputt/ohne funktion/ersatzteil/leerkarton bereits über
  # exclude_global (_global.yaml) für ALLE Kategorien abgedeckt -- hier
  # nicht dupliziert (siehe Begründung im Chat-Output).
  - "für teile"
  - "displayschaden"
  - "not tested"
  # "netzteil"/"ladekabel"/"tasche"/"hülle"/"karton"/"ovp" bewusst NICHT
  # als bare-word-Exclude: würde auch legitime Notebook-Angebote treffen,
  # die ihr Zubehör als Kaufargument im Titel nennen (z.B. "inkl.
  # Netzteil und Tasche") -- verifiziert, siehe Test unten. Stattdessen
  # präzise auf Einzelteil-Angebote eingegrenzt (kein Notebook dabei).
  - "nur netzteil"
  - "nur ladekabel"
  - "nur tasche"
  - "nur hülle"
  # FIX (kontrollierter Review, DASHBOARD_MATCH_FORENSICS.md, Fall
  # "Lenovo ThinkPad X390 Mainboard ... 8GB RAM NM-B891"): ein blosses
  # Mainboard/Motherboard-Einzelteil traegt haeufig eine eigene
  # RAM-Groessenangabe (die verloetete/aufgesteckte RAM-Menge des Boards
  # selbst), die die dritte require_all_of-Gruppe (RAM-/SSD-Groesse,
  # siehe Regel-Kommentar unten -- urspruenglich gegen Power-Button/
  # Lautsprecher/Gehaeuse/Kuehler-Einzelteile eingefuehrt) unbeabsichtigt
  # erfuellt, obwohl kein komplettes Notebook angeboten wird. Bewusst als
  # bare Wort-Exclude (nicht "nur mainboard" o.ae.): niemand bewirbt ein
  # komplettes, funktionierendes Notebook mit dem Wort "Mainboard"/
  # "Motherboard" -- verifiziert gegen alle 59 damals sichtbaren
  # TRUE_POSITIVE-Treffer dieser Kategorie: 0 Kollisionen.
  - "mainboard"
  - "motherboard"
  - "i3"
  - "celeron"
  - "pentium"
  - "atom"
  - "core 2 duo"
  - "amd a4"
  - "amd a6"
  - "amd a8"

  # FIX (Active-False-Positive-Audit, docs/ACTIVE_FALSE_POSITIVE_AUDIT.md):
  # "Ohne SSD/RAM" enthält das Wort "ssd" wörtlich -- die dritte
  # require_all_of-Gruppe akzeptiert bare "ssd"/"nvme" als Alternative zu
  # einer konkreten Speichergrößenangabe (siehe Regel-Kommentar oben),
  # ohne die vorangestellte Negation zu erkennen. Real bestätigt gegen
  # found.json (2 Titel im vollständigen 84-Titel-Match-Korpus, exakt
  # dieses Muster): "Lenovo ThinkPad L14 Gen 3 | Ryzen 5 PRO 5675U | BIOS
  # OK | Ohne SSD/RAM" -- ein bloßes Mainboard+CPU-Gehäuse ganz ohne RAM
  # UND ohne Storage, kein funktionsfähiges Notebook. Bewusst NICHT als
  # generelleres "ohne ssd" ausgeschlossen: 2 weitere Titel im Korpus
  # ("...8GB RAM OHNE SSD...") haben echtes RAM und erfüllen Gruppe 3
  # bereits unabhängig über die RAM-Größe -- ein bare "ohne ssd"-Exclude
  # würde diese echten Barebone-mit-RAM-Angebote fälschlich blockieren.
  - "ohne ssd/ram"

rules:
  - label: "ThinkPad T14/X13 (Ryzen/Modern) ★ Resell-Top"
    price_history_model: "thinkpad_modern"
    # MATCHING-FIX (Phase 12, Schritt 3): dritte Gruppe ergaenzt --
    # verlangt eine RAM-/Speicher-Groessenangabe im Titel. Ohne dieses
    # Kriterium matchten auch reine Einzelteil-Angebote (Power-Button,
    # Lautsprecher, Gehaeuse, Kuehler/Luefter) statt kompletter Notebooks,
    # da diese ebenfalls "thinkpad"+Modellcode enthalten koennen --
    # bestaetigt durch echte Preishistorie-Daten (vier der guenstigsten
    # Datenpunkte waren Einzelteile ohne jede GB-Angabe, alle echten
    # Komplettgeraete-Angebote enthielten dagegen durchgaengig eine
    # RAM-/SSD-Groesse, siehe PRICE_CALIBRATION_REVIEW.md). Deckt gaengige
    # RAM-/SSD-Groessen ab (4-512GB in ueblichen Zweierpotenz-Schritten
    # sowie 1TB/2TB) -- exaktes Wort-Grenzen-Matching (_contains_term)
    # verlangt die Ziffer direkt an "gb"/"tb" angehaengt (z.B. "16gb"),
    # bewusst KEIN bare "gb"/"ram" als eigener Begriff (wuerde an der
    # Wortgrenzen-Logik ohnehin nicht an Zahlen andocken, siehe
    # matcher.py::_contains_term()-Docstring).
    require_all_of:
      - ["thinkpad", "think pad"]
      - ["t14", "t490", "x13", "x390", "l14"]
      - ["4gb", "8gb", "16gb", "32gb", "64gb", "128gb", "256gb", "512gb", "1tb", "2tb", "ssd", "nvme"]
    exclude:
      - "t420"
      - "t430"
      - "t440"
      - "t450"
      - "t460"
    min_vram_gb: 0
    max_price: 180
    deal_rating: "Top-Deal"

  - label: "ThinkPad T14/X13 (Ryzen/Modern)"
    price_history_model: "thinkpad_modern"
    # MATCHING-FIX (Phase 12, Schritt 3): siehe Resell-Top-Regel oben.
    require_all_of:
      - ["thinkpad", "think pad"]
      - ["t14", "t490", "x13", "x390", "l14"]
      - ["4gb", "8gb", "16gb", "32gb", "64gb", "128gb", "256gb", "512gb", "1tb", "2tb", "ssd", "nvme"]
    exclude:
      - "t420"
      - "t430"
      - "t440"
      - "t450"
      - "t460"
    min_vram_gb: 0
    max_price: 240
    deal_rating: "Guter Preis"

  # FIX (kontrollierter Review, found.json-Audit): Gruppe 2 enthielt bisher
  # zusaetzlich "gaming" als Alternative zu "laptop"/"notebook". Fast jede
  # Grafikkarte traegt "Gaming" im Produktnamen (ASUS TUF Gaming, MSI
  # Gaming X Trio, Gigabyte GAMING OC, Zotac Gaming) -- dadurch matchten
  # 32 von 120 sichtbaren found.json-Eintraegen dieser Kategorie als reine
  # Standalone-Grafikkarte oder Desktop-Gaming-PC statt als Notebook (u.a.
  # "MSI GeForce RTX 4060 Ti Gaming X Trio 8GB Top Zustand + OVP", 300EUR
  # Top-Deal, kein Notebook im Angebot). "gaming" entfernt -- "laptop"/
  # "notebook" reichen als Geraete-Indikator, echte Gaming-Notebooks
  # nennen sich im Titel praktisch immer so.
  - label: "Gaming Laptop (RTX 3060) ★ Resell-Top"
    price_history_model: "gaming_laptop_rtx3060"
    require_all_of:
      - ["rtx 3060", "3060m", "3060 gtx"]
      - ["laptop", "notebook"]
    min_vram_gb: 0
    max_price: 400
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0

  - label: "Gaming Laptop (RTX 3060)"
    price_history_model: "gaming_laptop_rtx3060"
    require_all_of:
      - ["rtx 3060", "3060m", "3060 gtx"]
      - ["laptop", "notebook"]
    min_vram_gb: 0
    max_price: 490
    deal_rating: "Guter Preis"

  - label: "Gaming Laptop (RTX 4060) ★ Resell-Top"
    price_history_model: "gaming_laptop_rtx4060"
    require_all_of:
      - ["rtx 4060", "4060m"]
      - ["laptop", "notebook"]
    min_vram_gb: 0
    max_price: 550
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 12.0
