# ============================================================
# Curved-Monitor Regel-Matrix
# ============================================================
# Auftrag: neue Kategorie "Monitore", aber bewusst NUR Curved-Monitore
# (keine Flat-Monitore). Nutzt denselben Titel-Matching-Mechanismus wie
# rules/gpu.yaml (require_all_of/exclude/max_price) statt der
# Requirements-Detector-Logik von office_pc/gaming_pc/sata_ssd/netzteil --
# "curved" ist ein einfaches Titel-Stichwort, keine strukturierte
# Hardware-Eigenschaft (Kapazitaet/Watt/RAM), fuer die ein eigener
# Detector noetig waere. Reine YAML-Ergaenzung, KEIN Python-Code
# geaendert (siehe Phase 2/10-Auftrag: neue Kategorien nur ueber YAML).
#
# require_all_of statt "match": eine Gruppe ["curved"] UND eine Gruppe
# ["monitor","display","bildschirm"] muessen JEWEILS mindestens einen
# Treffer liefern -- verhindert, dass z.B. "Curved Soundbar" oder
# "Monitorarm" allein schon matchen (siehe exclude weiter unten fuer
# die haeufigsten Fehltreffer-Quellen).
#
# min_vram_gb: 0 -- WICHTIGER Bugfix aus vorheriger Session (siehe
# STATUS.md Abschnitt 6/rules/sata_ssd.yaml): matcher.py's generische
# VRAM-Check-Heuristik (Regex \d{1,2}\s*gb) wuerde sonst Angaben wie
# "HDMI 2.1 48Gbps" faelschlich als "0GB VRAM" interpretieren und das
# Match verwerfen. Deaktiviert den GPU-spezifischen Check fuer diese
# Kategorie, exakt wie bei sata_ssd.yaml.
# ============================================================

category: "monitor_curved"
label: "Curved Monitore"

search_terms:
  - "Curved Monitor"
  - "Curved Gaming Monitor"
  - "Curved Display"
  - "Curved Bildschirm"
  - "Samsung Curved Monitor"
  - "LG Curved Monitor"
  - "AOC Curved Monitor"
  - "MSI Curved Monitor"
  - "Curved 27 Zoll"
  - "Curved 32 Zoll"
  - "Curved 34 Zoll"
  - "Curved Ultrawide"

# SCORING-GEWICHTUNG
# Analog zu sata_ssd.yaml/netzteil.yaml: ein Monitor ist eine einzelne,
# austauschbare Komponente ohne CPU/RAM/GPU-Ausstattungsmerkmale --
# Preis dominiert, hardware_qualitaet (hier: Deal-Rating-Stufe als grober
# Tie-Breaker) fliesst leicht mit ein. hersteller bleibt bei 0: die
# vorhandene manufacturer_reputation-Tabelle deckt PC-OEM-Marken ab
# (Dell, HP, ...), nicht Monitor-Hersteller (Samsung, LG, AOC, ...) --
# eine Aktivierung wuerde hier nur den globalen _default-Wert liefern.
scoring_weights:
  price: 0.8
  ausstattung: 0
  hardware_qualitaet: 0.2
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# EXCLUDES – Fehltreffer-Quellen STRIKT AUSSCHLIESSEN
# "defekt"/"bastler"/"ersatzteil" etc. NICHT hier dupliziert -- bereits
# ueber exclude_global in _global.yaml fuer ALLE Kategorien abgedeckt.
exclude_category:
  # Curved TVs sind KEINE PC-Monitore (anderer Markt, andere Preisklasse,
  # wuerden die Suche sonst fluten) -- wichtigster Ausschluss dieser Kategorie.
  - "curved tv"
  - "curved fernseher"
  - "fernseher"
  - "smart tv"

  # Zubehoer/Peripherie mit "curved" im Titel, aber kein Monitor
  - "curved soundbar"
  - "curved tastatur"
  - "curved keyboard"
  - "curved maus"

  # Nur Zubehoer, kein Geraet
  - "monitorarm"
  - "monitorhalterung"
  - "monitor halterung"
  - "standfuß"
  - "vesa halterung"
  - "nur halterung"
  - "nur standfuß"

  # Komplette PCs/Laptops (Monitor nur als Bundle-Beilage erwaehnt)
  - "gaming pc"
  - "gaming-pc"
  - "komplett pc"
  - "pc komplett"
  - "laptop"
  - "notebook"

  # Konsolen
  - "playstation"
  - "xbox"
  - "nintendo"
  - "switch"

  # Handy-/Smartwatch-Zubehoer mit "curved ... display" im Titel (z.B.
  # "Full Cover Schutzfolie ... 3D Curved Edge Display", "Smartwatch
  # curved Display", "Display-Oeffnungswerkzeug curved") -- matchten
  # bisher faelschlich ueber require_all_of (["curved"] + ["display"]),
  # obwohl kein PC-Monitor. Gefunden bei der Preiskalibrierung (5 von 212
  # price_history.jsonl-Punkten, alle unter 26€ -- verzerrten
  # percentile_5/percentile_10 nach unten, siehe Begruendung im Chat).
  - "folie"
  - "spudger"
  - "öffnungswerkzeug"
  - "smartwatch"

rules:
  # ============================================================
  # Curved Monitor (alle Groessen -- Auftrag verlangt nur "curved",
  # keine weitere Segmentierung nach Zoll/Aufloesung/Hz)
  # ============================================================
  - label: "Curved Monitor ★ Top-Deal"
    price_history_model: "monitor_curved"
    require_all_of:
      - ["curved"]
      - ["monitor", "display", "bildschirm"]
    min_vram_gb: 0
    # KALIBRIERT (analog Methodik SATA-SSD/Gaming-PC, siehe STATUS.md
    # Abschnitt 15/17.2): p10-Perzentil aus price_history.jsonl (207
    # bereinigte Datenpunkte, 5 Handy-/Smartwatch-Zubehoer-Fehltreffer
    # ausgeklammert -- siehe exclude_category oben) = 69,59€ -> 70€.
    # Ehemaliger Platzhalter: 100€.
    max_price: 70
    deal_rating: "Top-Deal"
    # Verhandlungs-Assistent (STATUS.md Abschnitt 16, Punkt 7), analog zum
    # GPU-Muster (rules/gpu.yaml) UND aus demselben Grund bewusst NUR auf
    # dieser Regel aktiviert, nicht auf der "Guter Preis"-Regel unten:
    # deal_rating "Top-Deal" hat Basis-Score 85 (siehe scoring/deal_score.py
    # ::_hardware_qualitaet_score()), "Guter Preis" nur 65 -- die Schwelle
    # 70 waere dort nie erreichbar (kein CPU-/RAM-Headroom-Bonus bei
    # Monitoren, hardware_qualitaet == reine Rating-Stufe ohne Bonus).
    negotiation_tolerance_pct: 15.0
    negotiation_min_score: 70
    negotiation_score_component: "hardware_qualitaet"

  - label: "Curved Monitor"
    price_history_model: "monitor_curved"
    require_all_of:
      - ["curved"]
      - ["monitor", "display", "bildschirm"]
    min_vram_gb: 0
    # KALIBRIERT: Marktpreis (getrimmter Mittelwert p10-p90) aus
    # price_history.jsonl (207 bereinigte Datenpunkte) = 120,67€ -> 121€.
    # Ehemaliger Platzhalter: 180€.
    #
    # Hinweis Zensierung: 9,0% der 212 Rohdatenpunkte lagen bei >=170€,
    # 6 davon exakt bei der alten 180€-Deckelung (max_price wird nur bei
    # Regel-Match geschrieben -- teurere Curved-Monitore oberhalb der
    # bisherigen Grenze wurden nie erfasst). Deutlich schwaecher als beim
    # Gaming-PC-Fall (dort 28%/15%, siehe STATUS.md Abschnitt 15) und der
    # Marktpreis liegt mit 121€ komfortabel unter der alten 180€-Grenze --
    # Kalibrierung daher belastbar. estimated_resale_price (oberes
    # Preissegment) kann trotzdem leicht unterschaetzt sein; bei der
    # naechsten Kalibrierung erneut pruefen.
    max_price: 121
    deal_rating: "Guter Preis"
