# ============================================================
# Spielzeug-Bundles (Nischen-/Kategorien-Erweiterung, YAML-basiert)
# ============================================================
# Dritte von drei geplanten Nischen-Kategorien (siehe retro_konsolen.yaml
# fuer die Architektur-Begruendung: reines Titel-Keyword-Matching, kein
# Hardware-Detector, rein additiv, kein Python-Code geaendert).
#
# BEWUSSTE EINSCHRAENKUNG: Diese Kategorie zielt explizit auf BUNDLES/
# KILOWARE/SAMMLUNGEN ab, nicht auf einzelne neue Sets. Deshalb sind die
# Marken-Begriffe ("lego", "playmobil", "spielzeug") NICHT allein als
# match-Kriterium hinterlegt, sondern nur in Kombination mit einem
# Bundle-Signalwort (Konvolut/Kiloware/Sammlung/Posten/kg) ueber
# require_all_of -- ein einzelnes neues Lego-Set wird dadurch NICHT
# gematcht.
#
# KEIN Gewichts-/Kilopreis-Detector in dieser ersten Version: Lego-
# Kiloware wird haeufig ueber einen Kilopreis (typisch ca. 8-15€/kg,
# je nach Sortierung/Marke) gehandelt, eine automatische Gewichts-
# erkennung aus dem Titel (z.B. "5kg Lego Konvolut") waere aber ein
# NEUER Detector -> Code-Aenderung, und damit ausdruecklich NICHT Teil
# dieses rein additiven YAML-Schritts. Flache Preisgrenzen als
# Platzhalter, analog retro_konsolen.yaml/vintage_elektronik.yaml.
# Ein Kilopreis-Detector waere ein moeglicher spaeterer, separat
# freizugebender Schritt (siehe STATUS.md-Ausblick nach Abschluss).
# ============================================================

category: "spielzeug_bundles"
label: "Spielzeug-Bundles"

min_vram_gb: 0

notify_max_price: 100

search_terms:
  - "Lego Konvolut"
  - "Lego Kiloware"
  - "Lego Kilo"
  - "Lego Sammlung"
  - "Lego Posten"
  - "Playmobil Konvolut"
  - "Playmobil Sammlung"
  - "Spielzeug Konvolut"
  - "Spielzeug Sammlung"

exclude_category:
  - "neu ovp"           # einzelnes neues Set, keine Bundle-/Kiloware
  - "originalverpackt"
  - "einzelset"
  - "digital"           # z.B. Lego-App/Digitalcode-Angebote

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

rules:
  # ------------------------------------------------------------
  # Lego (Konvolut / Kiloware / Sammlung / Posten)
  # ------------------------------------------------------------
  - label: "Lego Konvolut/Kiloware ★ Top-Deal"
    require_all_of:
      - ["lego"]
      - ["konvolut", "kiloware", "kilo", "sammlung", "posten", "kg"]
    price_history_model: "lego_bundle"
    max_price: 40
    deal_rating: "Top-Deal"

  - label: "Lego Konvolut/Kiloware 👍 Guter Preis"
    require_all_of:
      - ["lego"]
      - ["konvolut", "kiloware", "kilo", "sammlung", "posten", "kg"]
    price_history_model: "lego_bundle"
    max_price: 80
    deal_rating: "Guter Preis"

  - label: "Lego Konvolut/Kiloware ⚠️ Okay"
    require_all_of:
      - ["lego"]
      - ["konvolut", "kiloware", "kilo", "sammlung", "posten", "kg"]
    price_history_model: "lego_bundle"
    max_price: 150
    deal_rating: "Okay"

  # ------------------------------------------------------------
  # Playmobil (Konvolut / Sammlung)
  # ------------------------------------------------------------
  - label: "Playmobil Konvolut/Sammlung ★ Top-Deal"
    require_all_of:
      - ["playmobil"]
      - ["konvolut", "sammlung", "posten"]
    price_history_model: "playmobil_bundle"
    max_price: 30
    deal_rating: "Top-Deal"

  - label: "Playmobil Konvolut/Sammlung 👍 Guter Preis"
    require_all_of:
      - ["playmobil"]
      - ["konvolut", "sammlung", "posten"]
    price_history_model: "playmobil_bundle"
    max_price: 60
    deal_rating: "Guter Preis"

  - label: "Playmobil Konvolut/Sammlung ⚠️ Okay"
    require_all_of:
      - ["playmobil"]
      - ["konvolut", "sammlung", "posten"]
    price_history_model: "playmobil_bundle"
    max_price: 100
    deal_rating: "Okay"

  # ------------------------------------------------------------
  # Sonstiges Spielzeug (generischer Catch-All fuer andere Marken)
  # ------------------------------------------------------------
  - label: "Spielzeug-Konvolut/-Sammlung (sonstige Marken) ★ Top-Deal"
    require_all_of:
      - ["spielzeug", "spielsachen"]
      - ["konvolut", "sammlung", "posten", "kiloware"]
    price_history_model: "spielzeug_bundle_sonstige"
    max_price: 25
    deal_rating: "Top-Deal"

  - label: "Spielzeug-Konvolut/-Sammlung (sonstige Marken) 👍 Guter Preis"
    require_all_of:
      - ["spielzeug", "spielsachen"]
      - ["konvolut", "sammlung", "posten", "kiloware"]
    price_history_model: "spielzeug_bundle_sonstige"
    max_price: 50
    deal_rating: "Guter Preis"

  - label: "Spielzeug-Konvolut/-Sammlung (sonstige Marken) ⚠️ Okay"
    require_all_of:
      - ["spielzeug", "spielsachen"]
      - ["konvolut", "sammlung", "posten", "kiloware"]
    price_history_model: "spielzeug_bundle_sonstige"
    max_price: 90
    deal_rating: "Okay"
