# ============================================================
# Globale Defaults – gelten für ALLE Kategorien, sofern eine
# Kategorie-YAML sie nicht selbst überschreibt.
# ============================================================
# Historie: bis Version 2 lag dieser Block als "defaults:" oben in
# der (jetzt aufgeteilten) rules.yaml. Inhalt unverändert übernommen.
# ============================================================

defaults:
  min_vram_gb: 12
  location_plz: "76477"
  radius_km: 999999 # Unbegrenzt / ganz Deutschland
exclude_global:
  # Defekt & Bastler
  - defekt
  - kaputt
  - bastler
  - ersatzteil
  - "ohne funktion"
  - beschädigt
  - "funktion nicht getestet"
  - "funktion unbekannt"
  - "ungetestet"
  - "für teilespender"
  - teilespender
  - "schrott"

  # Verpackungen & Merch
  - "nur ovp"
  - leerkarton
  - verpackung
  - "nur karton"
  - "leerbox"
  - "kabel"

  # Gesuche, Tausch & Mietschrott
  - tausch
  - suche
  - gesucht
  - kaufe
  - mieten
  - vermietung
  - "zur miete"

  # Rechtliches / Riskant
  - "ohne rückgabe"
  - "sperrgut"

# ============================================================
# Globale Benachrichtigungseinstellungen (ntfy)
# ============================================================
# urgent_price_threshold: Treffer bis zu diesem Preis werden mit
#   Priorität "urgent" verschickt, alles darüber mit "default".
#   (bisher hart in app.py: `priority="urgent" if price <= 150 ...`)
# tags: ntfy-Tags/Icons für die Benachrichtigung.
#
# gate_min_stars / gate_max_price (Phase 6b): NUR Angebote, die BEIDE
# Bedingungen erfüllen, lösen überhaupt eine Benachrichtigung aus.
# Alle anderen Treffer werden weiterhin gespeichert (found.json) und
# im Dashboard angezeigt, aber NICHT per ntfy verschickt.
# ============================================================
notifications:
  urgent_price_threshold: 150
  tags:
    - moneybag
  gate_min_stars: "★☆☆☆☆"
  gate_max_price: 250

# ============================================================
# Deal-Score-Gewichte (Phase 6) -- siehe scoring/deal_score.py
# ============================================================
# Hersteller/Zustand/Lieferumfang sind bewusst auf 0 gesetzt: für diese
# drei Komponenten existiert noch kein Detector (siehe deal_score.py-
# Docstring), sie würden sonst nur den neutralen Platzhalterwert (60)
# liefern und den erreichbaren Maximal-Score künstlich auf 92 (4 Sterne)
# deckeln. Deren Gewicht wurde stattdessen auf die drei Komponenten mit
# echter Datengrundlage verteilt: Preis 50%, Ausstattung 25%,
# Hardwarequalität 25%. Damit sind wieder 100 Punkte / 5 Sterne
# erreichbar. Sobald Detectors für Hersteller/Zustand/Lieferumfang
# existieren, können diese Gewichte neu verteilt werden.
# ============================================================
scoring_weights:
  price: 0.7
  ausstattung: 0.15
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# ============================================================
# Hersteller-Reputationstabelle (Detector-Folgeschritt)
# ============================================================
# Werte 0-100, genutzt von scoring/deal_score.py::_hersteller_score(),
# NUR wenn categories/detectors/manufacturer.py einen Hersteller erkennt
# (siehe dort für die erkannten Namen -- müssen hier exakt übereinstimmen,
# z.B. "HP" nicht "Hewlett-Packard"). "_default" greift für erkannte,
# aber hier noch nicht gepflegte Marken.
#
# WICHTIG: Das "hersteller"-Gewicht in scoring_weights (oben) steht
# weiterhin bewusst auf 0 -- diese Tabelle macht die Komponente technisch
# nutzbar, ändert aber NICHT automatisch den produktiv laufenden Score.
# Aktivierung (Gewicht > 0, ggf. Neuverteilung der übrigen Gewichte) ist
# eine separate, bewusste Entscheidung (siehe Commit-Begründung).
# ============================================================
manufacturer_reputation:
  Dell: 80
  HP: 78
  Lenovo: 85
  Fujitsu: 75
  Acer: 60
  Asus: 75
  MSI: 75
  Medion: 55
  Apple: 90
  Captiva: 55
  Schenker: 78
  Terra: 70
  Eigenbau: 65
  _default: 60
