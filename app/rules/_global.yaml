# ============================================================
# Globale Defaults – gelten für ALLE Kategorien, sofern eine
# Kategorie-YAML sie nicht selbst überschreibt.
# ============================================================
# Historie: bis Version 2 lag dieser Block als "defaults:" oben in
# der (jetzt aufgeteilten) rules.yaml. Inhalt unverändert übernommen.
# ============================================================

defaults:
  min_vram_gb: 12
  location_plz: "76477"
  radius_km: 999999 # Unbegrenzt / ganz Deutschland
exclude_global:
  # Defekt & Bastler
  - defekt
  - kaputt
  - bastler
  - ersatzteil
  - "ohne funktion"
  - beschädigt
  - "funktion nicht getestet"
  - "funktion unbekannt"
  - "ungetestet"
  - "für teilespender"
  - teilespender
  - "schrott"

  # Verpackungen & Merch
  - "nur ovp"
  - leerkarton
  - verpackung
  - "nur karton"
  - "leerbox"
  - "kabel"

  # Gesuche, Tausch & Mietschrott
  - tausch
  - suche
  - gesucht
  - kaufe
  - mieten
  - vermietung
  - "zur miete"

  # Rechtliches / Riskant
  - "ohne rückgabe"
  - "sperrgut"

# ============================================================
# Globale Benachrichtigungseinstellungen (ntfy)
# ============================================================
# urgent_price_threshold: Treffer bis zu diesem Preis werden mit
#   Priorität "urgent" verschickt, alles darüber mit "default".
#   (bisher hart in app.py: `priority="urgent" if price <= 150 ...`)
# tags: ntfy-Tags/Icons für die Benachrichtigung.
#
# gate_min_stars / gate_max_price (Phase 6b): NUR Angebote, die BEIDE
# Bedingungen erfüllen, lösen überhaupt eine Benachrichtigung aus.
# Alle anderen Treffer werden weiterhin gespeichert (found.json) und
# im Dashboard angezeigt, aber NICHT per ntfy verschickt.
#
# gate_max_price ist der FALLBACK-Preis, falls eine Kategorie kein
# eigenes "notify_max_price" definiert (siehe rules/gpu.yaml,
# rules/office_pc.yaml, rules/gaming_pc.yaml). Grund: ein einziges
# globales Preislimit passt strukturell nicht zu allen Kategorien --
# Gaming-PCs liegen typisch bei 200-550€, Office-PCs bei 130-300€,
# ein fuer reine GPUs gedachtes Limit wuerde dort nie greifen.
# rules/sata_ssd.yaml definiert bewusst kein eigenes notify_max_price
# und nutzt diesen Fallback (150€ liegt ueber allen SSD-eigenen
# max_price-Werten, hoechster Wert aktuell 155€ bei 2TB "Guter Preis";
# nur die strengeren "Top-Deal"-Schwellen (<=115€) koennen ohnehin
# ueberhaupt eine Benachrichtigung ausloesen, siehe gate_min_stars).
# ============================================================
notifications:
  urgent_price_threshold: 150
  tags:
    - moneybag
  gate_min_stars: "★★★☆☆"
  gate_max_price: 150

# ============================================================
# Deal-Score-Gewichte (Phase 6) -- siehe scoring/deal_score.py
# ============================================================
# Hersteller/Zustand/Lieferumfang sind bewusst auf 0 gesetzt: für diese
# drei Komponenten existiert noch kein Detector (siehe deal_score.py-
# Docstring), sie würden sonst nur den neutralen Platzhalterwert (60)
# liefern und den erreichbaren Maximal-Score künstlich auf 92 (4 Sterne)
# deckeln. Deren Gewicht wurde stattdessen auf die drei Komponenten mit
# echter Datengrundlage verteilt: Preis 50%, Ausstattung 25%,
# Hardwarequalität 25%. Damit sind wieder 100 Punkte / 5 Sterne
# erreichbar. Sobald Detectors für Hersteller/Zustand/Lieferumfang
# existieren, können diese Gewichte neu verteilt werden.
# ============================================================
scoring_weights:
  price: 0.7
  ausstattung: 0.15
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# ============================================================
# Hersteller-Reputationstabelle (Detector-Folgeschritt)
# ============================================================
# Werte 0-100, genutzt von scoring/deal_score.py::_hersteller_score(),
# NUR wenn categories/detectors/manufacturer.py einen Hersteller erkennt
# (siehe dort für die erkannten Namen -- müssen hier exakt übereinstimmen,
# z.B. "HP" nicht "Hewlett-Packard"). "_default" greift für erkannte,
# aber hier noch nicht gepflegte Marken.
#
# WICHTIG: Das "hersteller"-Gewicht in scoring_weights (oben) steht
# weiterhin bewusst auf 0 -- diese Tabelle macht die Komponente technisch
# nutzbar, ändert aber NICHT automatisch den produktiv laufenden Score.
# Aktivierung (Gewicht > 0, ggf. Neuverteilung der übrigen Gewichte) ist
# eine separate, bewusste Entscheidung (siehe Commit-Begründung).
# ============================================================
manufacturer_reputation:
  Dell: 80
  HP: 78
  Lenovo: 85
  Fujitsu: 75
  Acer: 60
  Asus: 75
  MSI: 75
  Medion: 55
  Apple: 90
  Captiva: 55
  Schenker: 78
  Terra: 70
  Eigenbau: 65
  _default: 60

# ============================================================
# Gebührenmodell (Reselling-/Arbitrage-Konzept, siehe STATUS.md
# Abschnitt 16) -- genutzt von scoring/profit.py::compute_profit().
# ============================================================
# Bildet die Kosten ab, die beim Weiterverkauf eines Angebots anfallen,
# damit der Profit-Score nicht die reine Preisdifferenz (Kaufpreis vs.
# geschätzter Verkaufspreis) als Marge ausweist, sondern die tatsächlich
# realistisch verbleibende Marge.
#
# platform_fee_pct: prozentuale Verkaufsgebühr der Zielplattform (z.B.
#   eBay-Verkaufsprovision), bezogen auf den geschätzten Verkaufspreis.
# payment_fee_pct: prozentuale Zahlungsabwicklungsgebühr (z.B. PayPal),
#   ebenfalls bezogen auf den geschätzten Verkaufspreis.
# shipping_cost: pauschale Versandkosten in Euro (Fixbetrag je Verkauf).
# packaging_cost: pauschale Verpackungskosten in Euro (Fixbetrag).
#
# Alle vier Werte sind bewusst als einzelne, additive Kostenpositionen
# statt einer einzigen Pauschale modelliert, damit sie unabhängig
# voneinander kalibriert werden können (z.B. wenn sich eine Gebühr
# ändert, ohne die anderen neu schätzen zu müssen). Fehlt "fees:"
# komplett oder eine einzelne Position, greift in profit.py ein
# neutraler Default von 0 für die fehlende Position (rückwärtskompatibel
# -- kein Crash bei alten/unvollständigen Configs).
#
# WICHTIG: Diese Sektion macht die Profit-Berechnung nur TECHNISCH
# nutzbar. Ob/wie stark sie in den Deal-Score einfließt, wird separat
# über scoring_weights.profit gesteuert (Folgeschritt, aktuell noch
# nicht angebunden -- siehe STATUS.md Abschnitt 16).
# ============================================================
fees:
  platform_fee_pct: 10.0
  payment_fee_pct: 2.5
  shipping_cost: 6.0
  packaging_cost: 1.5

# ============================================================
# Duplicate-/Cross-Posting-Erkennung (Reselling-/Arbitrage-Konzept,
# siehe STATUS.md Abschnitt 16, Baustein 5) -- genutzt von
# duplicate_detection.py::find_duplicate() ueber app.py::run_scan().
# ============================================================
# Verhindert, dass mehrfach gepostete/identische Angebote (gleicher
# Verkaeufer postet erneut, oder parallel auf mehreren Plattformen) die
# Marktpreis-Statistik (price_history.jsonl) verzerren. Ein Angebot gilt
# als Duplikat eines bereits erfassten Datenpunkts, wenn Modell UND
# normalisierter Titel uebereinstimmen UND der Preis innerhalb
# price_tolerance_pct liegt UND der bestehende Datenpunkt nicht aelter
# als window_days ist.
#
# price_tolerance_pct: erlaubte prozentuale Preisabweichung, damit zwei
#   Angebote noch als dasselbe physische Objekt gelten (z.B. leicht
#   unterschiedliche Preise bei Cross-Posting auf verschiedenen
#   Plattformen).
# window_days: wie lange ein bestehender Preishistorie-Datenpunkt als
#   moeglicher Duplikat-Partner gilt. Aeltere Datenpunkte werden nicht
#   mehr verglichen (das Angebot koennte in der Zwischenzeit tatsaechlich
#   erneut -- zu einem ggf. neuen Marktpreis -- angeboten worden sein).
#
# Fehlt diese Sektion komplett oder einzelne Werte, fallen
# duplicate_detection.py's Modulkonstanten (DEFAULT_PRICE_TOLERANCE_PCT=5.0,
# DEFAULT_WINDOW_DAYS=30.0) als Default ein -- kein Crash, volle
# Rueckwaertskompatibilitaet (aeltere Configs ohne diese Sektion).
# ============================================================
duplicate_detection:
  price_tolerance_pct: 5.0
  window_days: 30.0

# ============================================================
# Bundle-/Part-Out-Erkennung (Reselling-/Arbitrage-Konzept, siehe
# STATUS.md Abschnitt 16, Baustein 3) -- genutzt von matcher.py::evaluate().
# ============================================================
# Markiert PC-Angebote (Office-/Gaming-PC o.ae.), bei denen die im Titel
# erkannte dedizierte GPU laut bereits gesammeltem GPU-Marktpreis (siehe
# rules/gpu.yaml-Kategorie, Nachschlage-Tabelle in
# rules/mappings/component_values.yaml) einen grossen Teil des PC-Gesamt-
# preises ausmacht -- "der PC ist im Grunde nur die enthaltene GPU wert".
#
# gpu_value_ratio_threshold_pct: Schwelle in Prozent
#   (gpu_marktpreis / pc_preis * 100), ab der is_part_out_candidate=True
#   gesetzt wird. 70% als Startwert: eine GPU, die 70%+ des PC-Preises
#   ausmacht, ist ein starkes Signal, dass sich Einzelverkauf der GPU
#   eher lohnt als der PC als Ganzes.
#
# Fehlt diese Sektion komplett oder der Wert, faellt matcher.py's
# Modulkonstante DEFAULT_PART_OUT_THRESHOLD_PCT (=70.0) als Default ein --
# kein Crash, volle Rueckwaertskompatibilitaet (aeltere Configs ohne diese
# Sektion). Reines Zusatzsignal (MatchResult.part_out_*-Felder) -- KEIN
# Einfluss auf deal_score/deal_stars/Notification-Gate.
# ============================================================
part_out_detection:
  gpu_value_ratio_threshold_pct: 70.0
