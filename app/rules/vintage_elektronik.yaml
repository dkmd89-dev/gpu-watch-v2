# ============================================================
# Vintage-Elektronik & Audio (Nischen-/Kategorien-Erweiterung, YAML-basiert)
# ============================================================
# Zweite von drei geplanten Nischen-Kategorien (siehe retro_konsolen.yaml
# fuer die Architektur-Begruendung: reines Titel-Keyword-Matching, kein
# Hardware-Detector anwendbar, rein additiv, kein Python-Code geaendert).
#
# Zwei fachlich unterschiedliche Preisklassen in einer Kategorie:
#  - CRT-Roehrenfernseher: meist geringer Wert (Entsorgung/Umzug), AUSSER
#    gesuchte Profi-Monitore (Sony PVM/BVM/Trinitron), die bei Retro-
#    Gaming/Fotografie/Videokunst deutlich hoehere Preise erzielen ->
#    eigene, hoeher angesetzte Regelgruppe.
#  - Vintage-HiFi-Verstaerker: hoeheres Margenpotenzial, v.a. bekannte
#    Marken (Sansui, Marantz, Pioneer, Yamaha, Kenwood, Onkyo, McIntosh)
#    und Roehrenverstaerker.
#
# PREISGRENZEN SIND PLATZHALTER (mangels price_history-Daten fuer diese
# Kategorie) -- Kalibrierung nach ausreichend gesammelten Scan-Daten
# erforderlich, analog retro_konsolen.yaml/Gaming-PC/SATA-SSD.
# ============================================================

category: "vintage_elektronik"
label: "Vintage-Elektronik & Audio"

min_vram_gb: 0

notify_max_price: 150

search_terms:
  - "Röhrenfernseher"
  - "CRT Fernseher"
  - "Röhren TV"
  - "Sony Trinitron"
  - "Sony PVM"
  - "Sony BVM"
  - "Vintage Verstärker"
  - "HiFi Verstärker"
  - "Röhrenverstärker"
  - "Stereo Vollverstärker"
  - "Vintage HiFi"

exclude_category:
  - "flachbildschirm"   # kein modernes Geraet faelschlich als "TV" gematcht
  - "led fernseher"
  - "lcd fernseher"
  - "ersatzteile"        # bereits in exclude_global, hier zur Klarheit doppelt
  - "nur fernbedienung"
  - "receiver only"
  - "nur receiver"

  # FIX (Active-False-Positive-Audit, docs/ACTIVE_FALSE_POSITIVE_AUDIT.md):
  # Die "Profi-CRT-Monitor"-Regeln (PVM/BVM/Trinitron) hatten -- anders
  # als die "Röhrenfernseher"-Regeln direkt darunter -- KEINE Excludes
  # fuer Ersatzteile/Fernbedienungen. Realer, sehr grosser Fehltreffer-
  # Cluster im vollstaendigen 108-Titel-Match-Korpus (40 Titel ueber
  # 11 Muster), auf Kategorie-Ebene behoben statt dreifach pro
  # Rating-Stufe der Profi-CRT-Regel dupliziert:
  #
  # 1. Ersatzteile/Zubehoer fuer Sony PVM/BVM (Platine/Transformator/Akku/
  #    Ladegeraet/Chip/Schutzblende/Einbauset), z.B. "SONY PVM-14M4U CRT
  #    Monitor Transformer Assy Flyback", "Li-Ion Akku ... fuer Sony
  #    BVM-D9H1U", "Charger fuer SONY BVM-D9", "2x Sony BVM-2010 ...
  #    Chip Semiconductor" -- Ersatzteil, kein komplettes Geraet.
  - "board"              # "Circuit/Analog/ISR/Mounted C. Board" (Platine)
  - "semiconductor"
  - "akku"
  - "charger"
  - "assy"               # "Transformer/Resistor/High-Voltage Assy" (Baugruppe)
  - "protection panel"
  - "breakout adapter"
  - "einbauset"
  - "netzkabel für"       # nicht bare "netzkabel" -- ein echtes Komplett-
                          # geraet koennte "inkl. Netzkabel" bewerben

  # 2. Fernbedienungen fuer Profi-CRT-Monitore (bare "fernbedienung" war
  #    nur bei den "Roehrenfernseher"-Regeln als Exclude vorhanden, nicht
  #    bei "Profi-CRT-Monitor"), z.B. "Sony Trinitron RM 694
  #    Fernbedienung", "Sony PVM Monitor Fernbedienung RM668".
  #    "ersatzfernbedienung" zusaetzlich noetig (zusammengeschriebenes
  #    Wort, "fernbedienung" allein wuerde wegen fehlender Wortgrenze
  #    zwischen "Ersatz" und "fernbedienung" NICHT greifen).
  - "fernbedienung"
  - "ersatzfernbedienung"

  # 3. Subwoofer-ZUBEHOER fuer ein Geraet (nicht bare "subwoofer" --
  #    das wuerde einen echten TRUE_POSITIVE-Roehrenverstaerker mit
  #    Subwoofer-Ausgang treffen, "HiFi Bluetooth Hybrid Roehren
  #    Verstaerker Stereo Subwoofer Tube Power Amplifier"), z.B.
  #    "Subwoofer von/fuer SONY Trinitron KV-E2911A Fernseher".
  - "subwoofer für"
  - "subwoofer von"

  # 4. Sammler-/Merchandise-/Dokumentations-Artikel ohne jedes Geraet,
  #    real bestaetigt: "- Altes Foto"/"- Foto" (Sammlerfotos/Postkarten,
  #    6 Titel, z.B. "Giraffe auf Roehrenfernseher 1954 - Altes Foto"),
  #    "Testbild T-Shirt ... Shirt" (Merchandise), "... Wandhalterung"
  #    (Montage-Zubehoer), "TV Kippsicherung ... Kippschutz"
  #    (Sicherheits-Zubehoer), "Rollkarte Schulkarte ..." (Lehrmaterial),
  #    "Philips Service Fernsehgeraete Funktionsbeschreibung 1964/65"
  #    (Dokumentation), "KENWOOD HiFi Vintage Werbekoffer Aktenkoffer
  #    Vertreterkoffer" (Vertreter-Demokoffer, kein Verstaerker), "37x
  #    SCART Cinch Adapter Konvolut" (Adapterkabel-Sammelposten).
  - "foto"
  - "t-shirt"
  - "shirt"
  - "wandhalterung"
  - "kippsicherung"
  - "kippschutz"
  - "schulkarte"
  - "rollkarte"
  - "funktionsbeschreibung"
  - "werbekoffer"
  - "vertreterkoffer"
  - "cinch adapter"

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

rules:
  # ------------------------------------------------------------
  # Profi-CRT-Monitore (Sony PVM/BVM/Trinitron) -- gesuchte
  # Retro-Gaming-/Videokunst-Ware, deutlich hoehere Preisklasse
  # als normale Roehrenfernseher.
  # ------------------------------------------------------------
  - label: "Profi-CRT-Monitor (Sony PVM/BVM/Trinitron) ★ Top-Deal"
    match:
      - "sony pvm"
      - "sony bvm"
      - "sony trinitron"
    # MATCHING-FIX (Phase 12, Schritt 3): ohne Exclude matchten auch
    # Vintage-Papier-Werbeanzeigen aus den 1970er/80er-Jahren ("...vintage
    # advert werbung reklame...") -- Sammler-Papierwaren, keine
    # funktionsfaehigen Monitore. Bestaetigt durch echte Preishistorie-
    # Daten (vier der guenstigsten Datenpunkte waren Werbeanzeigen,
    # siehe PRICE_CALIBRATION_REVIEW.md). "anleitung"/"bedienungsanleitung"
    # ebenfalls ausgeschlossen (Dokumentation statt Geraet).
    exclude:
      - "werbung"
      - "reklame"
      - "advert"
      - "anleitung"
      - "bedienungsanleitung"
    price_history_model: "crt_profi_monitor"
    max_price: 80
    deal_rating: "Top-Deal"

  - label: "Profi-CRT-Monitor (Sony PVM/BVM/Trinitron) 👍 Guter Preis"
    match:
      - "sony pvm"
      - "sony bvm"
      - "sony trinitron"
    # MATCHING-FIX (Phase 12, Schritt 3): siehe Top-Deal-Regel oben.
    exclude:
      - "werbung"
      - "reklame"
      - "advert"
      - "anleitung"
      - "bedienungsanleitung"
    price_history_model: "crt_profi_monitor"
    max_price: 150
    deal_rating: "Guter Preis"

  - label: "Profi-CRT-Monitor (Sony PVM/BVM/Trinitron) ⚠️ Okay"
    match:
      - "sony pvm"
      - "sony bvm"
      - "sony trinitron"
    # MATCHING-FIX (Phase 12, Schritt 3): siehe Top-Deal-Regel oben.
    exclude:
      - "werbung"
      - "reklame"
      - "advert"
      - "anleitung"
      - "bedienungsanleitung"
    price_history_model: "crt_profi_monitor"
    max_price: 250
    deal_rating: "Okay"

  # ------------------------------------------------------------
  # Normale Roehrenfernseher (geringerer Wert)
  # ------------------------------------------------------------
  - label: "Röhrenfernseher ★ Top-Deal"
    match:
      - "röhrenfernseher"
      - "crt fernseher"
      - "röhren tv"
    # MATCHING-FIX (Phase 12, Schritt 3): ohne diese Excludes matchten
    # auch reine Einzelteile/Zubehoer/Dokumentation statt kompletter
    # Geraete -- bestaetigt durch echte Preishistorie-Daten (guenstigste
    # Datenpunkte waren Widerstands-Set, Bedienungsanleitung,
    # Fernbedienung, Netzschalter, siehe PRICE_CALIBRATION_REVIEW.md).
    exclude:
      - "pvm"
      - "bvm"
      - "trinitron"
      - "ersatzteil"
      - "anleitung"
      - "bedienungsanleitung"
      - "schaltplan"
      - "fernbedienung"
      - "netzschalter"
      - "widerstand"
    price_history_model: "roehrenfernseher"
    max_price: 10
    deal_rating: "Top-Deal"

  - label: "Röhrenfernseher 👍 Guter Preis"
    match:
      - "röhrenfernseher"
      - "crt fernseher"
      - "röhren tv"
    # MATCHING-FIX (Phase 12, Schritt 3): siehe Top-Deal-Regel oben.
    exclude:
      - "pvm"
      - "bvm"
      - "trinitron"
      - "ersatzteil"
      - "anleitung"
      - "bedienungsanleitung"
      - "schaltplan"
      - "fernbedienung"
      - "netzschalter"
      - "widerstand"
    price_history_model: "roehrenfernseher"
    max_price: 25
    deal_rating: "Guter Preis"

  - label: "Röhrenfernseher ⚠️ Okay"
    match:
      - "röhrenfernseher"
      - "crt fernseher"
      - "röhren tv"
    # MATCHING-FIX (Phase 12, Schritt 3): siehe Top-Deal-Regel oben.
    exclude:
      - "pvm"
      - "bvm"
      - "trinitron"
      - "ersatzteil"
      - "anleitung"
      - "bedienungsanleitung"
      - "schaltplan"
      - "fernbedienung"
      - "netzschalter"
      - "widerstand"
    price_history_model: "roehrenfernseher"
    max_price: 45
    deal_rating: "Okay"

  # ------------------------------------------------------------
  # Vintage-HiFi-Verstaerker (bekannte Marken + Roehrenverstaerker)
  # ------------------------------------------------------------
  - label: "Vintage-HiFi-Verstärker (Markenware) ★ Top-Deal"
    require_all_of:
      - ["verstärker", "vollverstärker", "receiver", "hifi"]
      - ["sansui", "marantz", "pioneer", "yamaha", "kenwood", "onkyo", "mcintosh", "röhrenverstärker", "röhren"]
    price_history_model: "vintage_hifi_verstaerker"
    max_price: 60
    deal_rating: "Top-Deal"

  - label: "Vintage-HiFi-Verstärker (Markenware) 👍 Guter Preis"
    require_all_of:
      - ["verstärker", "vollverstärker", "receiver", "hifi"]
      - ["sansui", "marantz", "pioneer", "yamaha", "kenwood", "onkyo", "mcintosh", "röhrenverstärker", "röhren"]
    price_history_model: "vintage_hifi_verstaerker"
    max_price: 120
    deal_rating: "Guter Preis"

  - label: "Vintage-HiFi-Verstärker (Markenware) ⚠️ Okay"
    require_all_of:
      - ["verstärker", "vollverstärker", "receiver", "hifi"]
      - ["sansui", "marantz", "pioneer", "yamaha", "kenwood", "onkyo", "mcintosh", "röhrenverstärker", "röhren"]
    price_history_model: "vintage_hifi_verstaerker"
    max_price: 200
    deal_rating: "Okay"
