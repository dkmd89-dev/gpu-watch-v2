# ============================================================
# Retro-Konsolen & Spiele (Nischen-/Kategorien-Erweiterung, YAML-basiert)
# ============================================================
# Erste von drei geplanten Nischen-Kategorien (Retro-Konsolen, Vintage-
# Elektronik, Spielzeug-Bundles). Rein additiv -- kein Python-Code
# geaendert, siehe categories/registry.py-Docstring: jede *.yaml in
# rules/ (ausser _global.yaml) wird automatisch als Kategorie erkannt.
#
# ARCHITEKTUR-ENTSCHEIDUNG: Titel-Keyword-Matching (wie rules/gpu.yaml,
# rules/sata_ssd.yaml), KEIN "requirements:"-Block (wie office_pc.yaml).
# Begruendung: Fuer Retro-Konsolen existiert kein Hardware-Detector
# (CPU/RAM/Case) -- das waere strukturell unpassend. Titel-Matching ist
# hier das etablierte Muster fuer Kategorien ohne Hardware-Spec-Pruefung.
#
# min_vram_gb: 0 -- der globale VRAM-Check (_global.yaml defaults,
# eigentlich fuer GPU-Angebote gedacht) wird hier bewusst deaktiviert.
# Grund: _vram_gb() erkennt jede Zahl+"GB" im Titel (z.B. eine erwaehnte
# "64GB SD-Karte" als Zubehoer) -- ohne diese Ueberschreibung koennte das
# faelschlich als "VRAM zu niedrig" interpretiert werden und ein
# eigentlich gueltiges Konsolen-Angebot verwerfen.
#
# PREISGRENZEN SIND PLATZHALTER (analog Gaming-PC/SATA-SSD vor Kalibrierung,
# siehe STATUS.md Abschnitt 15/17.2): mangels vorhandener price_history-
# Datenpunkte fuer diese Kategorie grob geschaetzt. Muessen nach ausreichend
# gesammelten Scan-Daten anhand echter Marktpreise nachkalibriert werden.
#
# resale_price_group (Option 2, "Flip-Kandidaten-Logik optimieren",
# STATUS.md Abschnitt 33b): wirkt AUSSCHLIESSLICH auf estimated_resale_price
# (Flip-Kandidat/Dashboard-Margenfelder), market_price/deal_score/
# Notification-Gate bleiben unveraendert an price_history_model gekoppelt.
# nintendo_retro_konsole und sony_retro_konsole (aehnliches Preisniveau,
# Okay-Grenze 90-100€) teilen sich "retro_konsole_single". retro_konvolut
# (Preisniveau/Charakter -- mehrere Konsolen/Items -- deutlich anders,
# Okay-Grenze 117€) bleibt bewusst eigene Gruppe.
# ============================================================

category: "retro_konsolen"
label: "Retro-Konsolen & Spiele"

min_vram_gb: 0

notify_max_price: 120

search_terms:
  - "Nintendo 64"
  - "N64"
  - "GameCube"
  - "Nintendo DS"
  - "PlayStation 1"
  - "PS1"
  - "PlayStation 2"
  - "PS2"
  - "Retro Konsole"
  - "Konvolut Konsole"

# Kategorie-eigene Ausschluesse (zusaetzlich zu exclude_global aus
# _global.yaml, das u.a. bereits "defekt"/"bastler"/"tausch" global
# ausschliesst).
exclude_category:
  - "repro"           # Nachbau-/Bootleg-Module, kein Original
  - "nachbau"
  - "modul einzeln"    # einzelnes Spielmodul ohne Konsole
  - "spiel einzeln"
  - "nur controller"
  - "controller only"
  - "emulator"         # Software-Emulation, keine echte Hardware
  # Optimierung (Robin-Feedback: "ich bekomme Spiele und Sonstiges"):
  # die o.g. Excludes griffen nur bei exakter Wortkombination, nicht bei
  # den in der Praxis ueblichen freien Formulierungen fuer Spiel-only-
  # bzw. Zubehoer-only-Angebote (Marken-Treffer wie "ps2"/"n64" steckt
  # in "PS2 Spiel GTA" oder "N64 Modul Mario Kart" genauso wie in einem
  # echten Konsolen-Angebot).
  - "spiel für"
  - "spiele für"
  - "spielesammlung"
  - "spiele sammlung"
  - "spielepaket"
  - "spiele paket"
  - "spielebundle"
  - "nur spiele"
  - "nur spiel"
  - "spiele konvolut"
  - "spielekonvolut"
  - "nur modul"
  - "ohne konsole"      # deckt auch "modul/spiele ... ohne Konsole" ab
  - "ohne gerät"
  - "nur anleitung"
  - "hülle ohne"
  - "nur hülle"
  - "nur speicherkarte"
  # Bewusst NICHT ausgeschlossen: "modul"/"cartridge"/"anleitung" als
  # Einzelwort -- das wuerde auch legitime Konsole+Spiel-Bundles
  # ("N64 Konsole inkl. 2 Module") faelschlich ausschliessen. Die
  # spezifischeren Varianten oben ("nur modul", "modul ohne konsole")
  # decken die eigentlichen Spiel-only-Angebote ab.

  # Nachtrag: Matcher-Fix Einzelspiel-/Zubehoer-Fehltreffer (siehe unten,
  # "Positiv-Liste verschlankt"). Gegen 152 bisherige Treffer aus found.json
  # verifiziert: reduziert Fehltreffer von 152 auf 59 verbleibende Treffer,
  # 93 Einzelspiele/Zubehoer fallen weg.
  - "cib"               # "Complete In Box" -- Sammler-Begriff fast
                         # ausschliesslich fuer Einzelspiele, nicht Konsolen
  - "controller für"     # Zubehoer-Verkaufsformulierung ("Controller FUER
                         # PS2"), keine Konsole -- anders als "mit Controller"
                         # (Bundle-Formulierung), die weiterhin matcht
  - "adapter"            # z.B. RF-Adapter/Netzteil-Adapter als Einzelteil
  - "modulator"          # z.B. RF-Modulator als Einzelteil
  # Phase 15 (kontrollierter Review, "Service/Modding-Fix"): Reparatur-/
  # Modding-DIENSTLEISTUNGS-Angebote statt Konsolenverkauf. Bewusst als
  # Mehrwort-Phrase, NICHT bare "service" -- ein bare Exclude waere fuer
  # Geraete-Zustandsbeschreibungen riskant (siehe kontrollierter Review).
  - "modding service"
  - "reparatur service"
  - "repair service"
  # Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): unbedingte
  # Ausschlüsse für Standalone-Gehäuse-/Shell-Angebote, die nicht über die
  # kontextbewusste "gehäuse"-Prüfung unten laufen (zusammengesetzte
  # Wörter/englische Begriffe, siehe handhelds.yaml-Begründung).
  - "ersatzgehäuse"
  - "leergehäuse"
  - "wechselgehäuse"
  - "replacement shell"
  - "back shell"
  - "shell replacement"
  - "backplate"
  - "replacement housing"
  - "housing replacement"
  # Bekannte Restluecke (bewusst nicht weiter ueber Keywords geloest, siehe
  # STATUS.md-Nachtrag): vereinzelte Angebote, die NUR einen Controller
  # verkaufen, aber ohne die Formulierung "für"/"fuer" (z.B. "Original PS2
  # DualShock Controller SCPH-10010") rutschen weiterhin durch. Eine
  # zuverlaessige Unterscheidung "Konsole" vs. "loser Controller" wuerde
  # hier einen eigenen Detector statt Keyword-Matching brauchen -- ausserhalb
  # des Rahmens dieses rein additiven YAML-Fixes.

# Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): "gehäuse"
# ist zweideutig (lose Ersatzschale vs. Zustandsbeschreibung einer
# kompletten Retro-Konsole, z.B. "Gehäuse leicht vergilbt" -- bei
# Retro-Konsolen ein besonders häufiges, legitimes Merkmal) -- schließt
# daher nur aus, wenn im GESAMTEN Titel kein Kontextbegriff vorkommt
# (siehe matcher.py::_any_conditional_exclude_presence(), ausführliche
# Begründung in handhelds.yaml).
exclude_category_unless_also_contains:
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"

# Scoring: kein Hardware-Detector anwendbar (analog sata_ssd.yaml) --
# Preis ist das mit Abstand aussagekraeftigste Signal. Ausstattung/
# Hersteller/Zustand/Lieferumfang/Profit bleiben auf dem globalen
# Default 0 (hier nicht ueberschrieben).
scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

# ------------------------------------------------------------
# NACHTRAG (Matcher-Fix, Freigabe "Option A"): Die urspruengliche zweite
# require_all_of-Wortgruppe bei Nintendo/Sony enthielt zusaetzlich "ovp",
# "komplett", "funktioniert", "getestet" -- diese Begriffe sind ZU generisch
# (jedes einzelne Spiel/Zubehoerteil kann "OVP"/"komplett"/"getestet" sein),
# und haben in der Praxis mehrheitlich EINZELSPIELE statt Konsolen
# durchgelassen (Fund: 72% aller bisherigen Treffer waren tatsaechlich
# Spiele/Zubehoer, siehe found.json-Stichprobe). Entfernt -- verbleibende
# Positiv-Begriffe ("konsole"/"gerät"/"system"/"controller"/"netzteil")
# sind zwar auch nicht perfekt, aber deutlich seltener in Einzelspiel-Titeln.
# Ergaenzend: neue Excludes unten (cib/"controller für"/adapter/modulator).
# Verifiziert gegen alle 152 bisherigen retro_konsolen-Treffer aus
# found.json: 93 Fehltreffer (Spiele/Zubehoer) fallen weg, 59 plausible
# Konsolen-Angebote bleiben. Preiskalibrierung fuer nintendo_retro_konsole/
# sony_retro_konsole bewusst VERSCHOBEN (naechster Schritt, nach neuer,
# bereinigter Datensammlung) -- die bisherige price_history.jsonl ist durch
# die Fehltreffer verzerrt und keine verlaessliche Kalibrierungsgrundlage.
# ------------------------------------------------------------

rules:
  # ------------------------------------------------------------
  # Nintendo (N64 / GameCube / DS) -- typischerweise Konsole +
  # mind. 1 Controller/Zubehoer
  # ------------------------------------------------------------
  - label: "Nintendo Retro-Konsole (N64/GameCube/DS) ★ Top-Deal"
    match:
      - "nintendo 64"
      - "n64"
      - "gamecube"
      - "nintendo ds"
    # Optimierung: Konsolen-Indikator zwingend erforderlich (require_all_of
    # zusaetzlich zu "match"), sonst matchen auch Einzelspiele/Zubehoer,
    # die die Konsole nur im Titel erwaehnen ("PS2 Spiel GTA", "N64 Modul
    # Zelda"). "match" bleibt als OR-Vorfilter bestehen (Konsolenname
    # muss ohnehin vorkommen), require_all_of ergaenzt die zusaetzliche
    # UND-Bedingung.
    require_all_of:
      - ["nintendo 64", "n64", "gamecube", "nintendo ds"]
      - ["konsole", "gerät", "system", "controller", "netzteil"]
    price_history_model: "nintendo_retro_konsole"
    resale_price_group: "retro_konsole_single"
    max_price: 40
    deal_rating: "Top-Deal"

  - label: "Nintendo Retro-Konsole (N64/GameCube/DS) 👍 Guter Preis"
    match:
      - "nintendo 64"
      - "n64"
      - "gamecube"
      - "nintendo ds"
    # Optimierung: Konsolen-Indikator zwingend erforderlich (require_all_of
    # zusaetzlich zu "match"), sonst matchen auch Einzelspiele/Zubehoer,
    # die die Konsole nur im Titel erwaehnen ("PS2 Spiel GTA", "N64 Modul
    # Zelda"). "match" bleibt als OR-Vorfilter bestehen (Konsolenname
    # muss ohnehin vorkommen), require_all_of ergaenzt die zusaetzliche
    # UND-Bedingung.
    require_all_of:
      - ["nintendo 64", "n64", "gamecube", "nintendo ds"]
      - ["konsole", "gerät", "system", "controller", "netzteil"]
    price_history_model: "nintendo_retro_konsole"
    resale_price_group: "retro_konsole_single"
    max_price: 70
    deal_rating: "Guter Preis"

  - label: "Nintendo Retro-Konsole (N64/GameCube/DS) ⚠️ Okay"
    match:
      - "nintendo 64"
      - "n64"
      - "gamecube"
      - "nintendo ds"
    # Optimierung: Konsolen-Indikator zwingend erforderlich (require_all_of
    # zusaetzlich zu "match"), sonst matchen auch Einzelspiele/Zubehoer,
    # die die Konsole nur im Titel erwaehnen ("PS2 Spiel GTA", "N64 Modul
    # Zelda"). "match" bleibt als OR-Vorfilter bestehen (Konsolenname
    # muss ohnehin vorkommen), require_all_of ergaenzt die zusaetzliche
    # UND-Bedingung.
    require_all_of:
      - ["nintendo 64", "n64", "gamecube", "nintendo ds"]
      - ["konsole", "gerät", "system", "controller", "netzteil"]
    price_history_model: "nintendo_retro_konsole"
    resale_price_group: "retro_konsole_single"
    max_price: 100
    deal_rating: "Okay"

  # ------------------------------------------------------------
  # Sony (PS1 / PS2)
  # ------------------------------------------------------------
  - label: "Sony Retro-Konsole (PS1/PS2) ★ Top-Deal"
    match:
      - "playstation 1"
      - "ps1"
      - "playstation 2"
      - "ps2"
    # Optimierung: siehe Nintendo-Block oben (identische Begruendung).
    require_all_of:
      - ["playstation 1", "ps1", "playstation 2", "ps2"]
      - ["konsole", "gerät", "system", "controller", "netzteil"]
    price_history_model: "sony_retro_konsole"
    resale_price_group: "retro_konsole_single"
    max_price: 35
    deal_rating: "Top-Deal"

  - label: "Sony Retro-Konsole (PS1/PS2) 👍 Guter Preis"
    match:
      - "playstation 1"
      - "ps1"
      - "playstation 2"
      - "ps2"
    # Optimierung: siehe Nintendo-Block oben (identische Begruendung).
    require_all_of:
      - ["playstation 1", "ps1", "playstation 2", "ps2"]
      - ["konsole", "gerät", "system", "controller", "netzteil"]
    price_history_model: "sony_retro_konsole"
    resale_price_group: "retro_konsole_single"
    max_price: 60
    deal_rating: "Guter Preis"

  - label: "Sony Retro-Konsole (PS1/PS2) ⚠️ Okay"
    match:
      - "playstation 1"
      - "ps1"
      - "playstation 2"
      - "ps2"
    # Optimierung: siehe Nintendo-Block oben (identische Begruendung).
    require_all_of:
      - ["playstation 1", "ps1", "playstation 2", "ps2"]
      - ["konsole", "gerät", "system", "controller", "netzteil"]
    price_history_model: "sony_retro_konsole"
    resale_price_group: "retro_konsole_single"
    max_price: 90
    deal_rating: "Okay"

  # ------------------------------------------------------------
  # Konvolute (Sammlungen: Konsole + mehrere Spiele/Zubehoer)
  # ------------------------------------------------------------
  - label: "Retro-Konsolen-Konvolut ★ Top-Deal"
    match:
      - "konvolut"
    require_all_of:
      - ["konvolut"]
      - ["nintendo", "playstation", "ps1", "ps2", "n64", "gamecube", "retro", "konsole"]
      # Optimierung: Konsolen-Indikator zwingend erforderlich, sonst
      # matchen auch reine Spiele-Konvolute (kein Geraet dabei).
      - ["konsole", "gerät", "system", "controller"]
    price_history_model: "retro_konvolut"
    # Kalibriert anhand 28 realer price_history.jsonl-Datenpunkte
    # (04.08.2026, burst-bereinigt): p10 = 23,50€ -> Top-Deal-Grenze.
    # Vorher 60€ (grober Schaetzwert). Kleinere Stichprobe als bei
    # Nintendo/Sony (28 statt >250 Punkte) -- bei naechster Kalibrierung
    # erneut pruefen, sobald mehr Daten vorliegen.
    max_price: 24
    deal_rating: "Top-Deal"

  - label: "Retro-Konsolen-Konvolut 👍 Guter Preis"
    match:
      - "konvolut"
    require_all_of:
      - ["konvolut"]
      - ["nintendo", "playstation", "ps1", "ps2", "n64", "gamecube", "retro", "konsole"]
      # Optimierung: Konsolen-Indikator zwingend erforderlich, sonst
      # matchen auch reine Spiele-Konvolute (kein Geraet dabei).
      - ["konsole", "gerät", "system", "controller"]
    price_history_model: "retro_konvolut"
    # Kalibriert: Marktpreis (getrimmter Mittelwert p10-p90) = 78,75€ ->
    # gerundet 79€. Vorher 100€ (grober Schaetzwert).
    max_price: 79
    deal_rating: "Guter Preis"

  - label: "Retro-Konsolen-Konvolut ⚠️ Okay"
    match:
      - "konvolut"
    require_all_of:
      - ["konvolut"]
      - ["nintendo", "playstation", "ps1", "ps2", "n64", "gamecube", "retro", "konsole"]
      # Optimierung: Konsolen-Indikator zwingend erforderlich, sonst
      # matchen auch reine Spiele-Konvolute (kein Geraet dabei).
      - ["konsole", "gerät", "system", "controller"]
    price_history_model: "retro_konvolut"
    # Kalibriert: p90 = 117,40€ -> gerundet 117€. Vorher 150€ (grober
    # Schaetzwert). NEUE KONVENTION fuer die dritte ("Okay")-Stufe bei
    # 3-stufigen Kategorien (bisherige Praezedenzfaelle SATA-SSD/Gaming-PC
    # hatten nur 2 Stufen): p90 statt eines frei gewaehlten Aufschlags --
    # nutzt einen bereits in price_stats.py berechneten, konsistenten
    # Perzentil-Wert (auch Grenze des market_price-Trimmbereichs) statt
    # eines weiteren Bauchgefuehl-Werts. Bitte gegenpruefen, ob das fuer
    # kuenftige 3-stufige Kalibrierungen (z.B. Nintendo/Sony nach
    # Neusammlung) ebenfalls die gewuenschte Konvention ist.
    max_price: 117
    deal_rating: "Okay"
