  # FIX (Ruleset-Qualitaetssystem, 251-Listing-Stichprobe 2026-08-14):
  # "Joy-Con" ist wie "Pro Controller" ein eindeutiger Zubehoer-Produktname,
  # der als Standalone-Angebot faelschlich matcht (z.B. "SW - Original
  # Nintendo Switch Joy-Con 2er-Set Grau"). Bewusst NICHT als bare
  # exclude_category-Eintrag -- in einer frueheren Session verworfen
  # (9 verifizierte Kollisionen mit echten Switch-Bundles wie "Nintendo
  # Switch Konsole mit grauen Joy-Cons", siehe Kommentar weiter unten bei
  # "Bewusst NICHT joy-con"). Stattdessen kontextbewusst: blockiert nur,
  # wenn KEIN Geraete-Marker im Titel steht. Eigene Markerliste (nicht der
  # &plattform_geraete_marker-Anker unten) mit zusaetzlich "konsole" --
  # "Nintendo Switch KONSOLE mit grauen Joy-Cons" enthaelt sonst keinen der
  # bestehenden Marker (kein "spielkonsole", keine Speichergroesse). Blast
  # Radius gegen alle 61 Joy-Con-Titel aus found.json + price_history.jsonl
  # geprueft: 0 Kollisionen (jedes Konsole+Joy-Con-Bundle bleibt ueber
  # "konsole" erhalten), alle ca. 21 Standalone-Joy-Con-Sets bleiben
  # korrekt blockiert.
  "joy-con":
    &joy_con_geraete_marker
    - "konsole"
    - "32gb"
    - "64gb"
    - "128gb"
    - "256gb"
    - "500gb"
    - "512gb"
    - "1tb"
    - "2tb"
    - "slim"
    - "pro"
    - "hac-001"
    - "v1"
    - "v2"
    - "oled"
    - "spielkonsole"
    - "spielekonsole"
    - "heimkonsole"
    - "1. generation"
    - "2. generation"
  "joycon": *joy_con_geraete_marker
  "joy con": *joy_con_geraete_marker
  "für nintendo switch": &plattform_geraete_marker
    - "32gb"
    - "64gb"
    - "128gb"
    - "256gb"
    - "500gb"
    - "512gb"
    - "1tb"
    - "2tb"
    - "slim"
    - "pro"
    - "hac-001"
    - "v1"
    - "v2"
    - "oled"
    - "spielkonsole"
    - "spielekonsole"
    - "heimkonsole"
    - "1. generation"
    - "2. generation"
  "für switch": *plattform_geraete_marker
  "für ps4": *plattform_geraete_marker
  "für ps5": *plattform_geraete_marker
  "für playstation 4": *plattform_geraete_marker
  "für playstation 5": *plattform_geraete_marker
  "für xbox": *plattform_geraete_marker
  "für xbox one": *plattform_geraete_marker
  "für xbox series": *plattform_geraete_marker
  # Nachtrag (Dashboard-Match-Validierung Variante C, Schritt 2 --
  # separate Review-Runde): "[Plattform] - [Spieltitel]" ist wie "für
  # [Plattform]" praktisch immer eine Formulierung fuer ein Spiel/
  # Zubehoerteil, NICHT fuer das Geraet selbst (z.B. "Nintendo Switch -
  # Minecraft FRA mit OVP", real bestaetigt in price_history.jsonl).
  # matcher.py::_contains_term() prueft _title.lower()_ als reinen
  # Substring-Check OHNE Interpunktions-Normalisierung (title_l =
  # title.lower(), siehe evaluate()) -- der Bindestrich ist daher ganz
  # regulaer Teil des Suchbegriffs, kein neuer Matcher-Mechanismus
  # noetig, identisches Prinzip wie bei "für [Plattform]" oben,
  # Wiederverwendung desselben Geraete-Marker-Ankers. Zwei Varianten je
  # Plattform, da Kleinanzeigen-Titel sowohl Viertelgeviertstrich "–"
  # als auch Bindestrich "-" nutzen (beide real im Log-Korpus
  # bestaetigt, z.B. "PS4 Slim – funktioniert einwandfrei"). Gegen den
  # vollstaendigen 186-Titel-Rohkorpus (data/gpu_watch.log.*, mit
  # Interpunktion, GESPEICHERT-Zeilen der 5 konsolen_bundles-Regeln)
  # verifiziert: 0 echte Kollisionen -- die beiden Titel mit
  # uebereinstimmendem Muster ("Nintendo Switch Lite - Gelb - 32GB",
  # "... - Playstation 4 - Zustand: gut") enthalten jeweils einen
  # Geraete-Marker (32gb / 500gb+slim) und bleiben ueber die Ausnahme
  # unveraendert erhalten. Nur fuer Nintendo Switch real als
  # Fehltreffer bestaetigt; PS4/PS5/Xbox-Varianten strukturell
  # analog ergaenzt (keine bare "-"-Kollision im Korpus gefunden),
  # aber ohne eigenen bestaetigten Fehltreffer-Fall.
  "nintendo switch -": *plattform_geraete_marker
  "nintendo switch –": *plattform_geraete_marker
  "switch -": *plattform_geraete_marker
  "switch –": *plattform_geraete_marker
  "ps4 -": *plattform_geraete_marker
  "ps4 –": *plattform_geraete_marker
  "ps5 -": *plattform_geraete_marker
  "ps5 –": *plattform_geraete_marker
  "playstation 4 -": *plattform_geraete_marker
  "playstation 4 –": *plattform_geraete_marker
  "playstation 5 -": *plattform_geraete_marker
  "playstation 5 –": *plattform_geraete_marker
  "xbox one s -": *plattform_geraete_marker
  "xbox one s –": *plattform_geraete_marker
  "xbox one x -": *plattform_geraete_marker
  "xbox one x –": *plattform_geraete_marker
  # FIX (Nutzer-Meldung 2026-08-15, Live-Fehltreffer "pro"-Kollision):
  # "Vertical Stand" ist ein spezifischer Zubehör-Produktname (Konsolen-
  # ständer), der als Standalone-Angebot fälschlich matcht, wenn er
  # zusammen mit mehreren Plattform-/Modell-Kompatibilitätsangaben
  # auftaucht -- real bestätigt: "Chin Fai „The Shark" Vertical Stand für
  # PS4 / PS4 Slim / PS4 Pro" (15€, Top-Deal, matchte über "slim"+"pro" in
  # der require_all_of-Gruppe 2, obwohl der Titel gar kein Gerät verkauft).
  # Bewusst NICHT exclude_category_unless_preceded_by (Adjazenz-Check):
  # der einzige echte Bundle-Kollisionsfall "PS4 Slim inkl 1 Controller
  # Vertical Stand und Lampe" (80€, price_history.jsonl) hat "inkl" NICHT
  # unmittelbar vor "Vertical Stand" stehen (dazwischen "1 Controller") --
  # ein Adjazenz-Check würde diesen echten Bundle-Treffer fälschlich
  # ebenfalls blockieren. Stattdessen titelweite Praesenzpruefung auf
  # dieselben Bundle-Konnektoren wie bei "pro controller"/"pro-controller"
  # unten (kein neuer Anker moeglich, da exclude_category_unless_
  # preceded_by mit *bundle_konnektoren erst weiter unten im Dokument
  # definiert wird -- YAML-Anker muessen vor ihrer ersten Verwendung
  # stehen). Verifiziert: 0 Kollisionen (der Bundle-Fall enthaelt "inkl"
  # UND "und" irgendwo im Titel, der Fehltreffer-Fall keins der beiden).
  "vertical stand":
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"

# FIX (kontrollierter Review, "Plattformbegriff ist kein Hardware-Beweis",
# Variante C, KONSOLEN_BUNDLES_REVIEW.md Abschnitt 8): "Pro Controller"
# ist ein spezifischer, bekannter Zubehör-Produktname (z.B. "Nintendo
# Switch Pro Controller"), der als Standalone-Angebot fälschlich matcht,
# wenn er zusammen mit dem Plattformnamen und "ovp" auftaucht. Bewusst
# NICHT als bare "controller"-Exclude (siehe Bericht Abschnitt 4/5,
# Variante verworfen: gegen alle 195 TRUE_POSITIVE-Titel verifiziert,
# dass "controller" in vielen echten Bundles von einer ZAHL statt einem
# Konnektor-Wort eingeleitet wird, z.B. "2 Controller"/"3 Controller" --
# ein bare-Exclude würde diese Bundles zerstören). "Pro Controller" ist
# dagegen ein enger, feststehender Zwei-Wort-Ausdruck ohne diese
# Kollisionsgefahr (0 Kollisionen im vollständigen 195-Titel-Test).
# Wiederverwendung des bereits in controller.yaml produktiven
# "Variante C"-Konnektor-Mechanismus (matcher.py::
# _contains_term_unless_preceded_by()): blockiert "Pro Controller" nur,
# wenn es NICHT unmittelbar einem Bundle-Konnektor folgt (z.B. "mit Pro
# Controller" bleibt erlaubt, "Nintendo Switch Pro Controller" nicht).
exclude_category_unless_preceded_by:
  "pro controller": &bundle_konnektoren
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  # FIX (Nutzer-Meldung 2026-08-15, Live-Fehltreffer "pro"-Kollision):
  # Bindestrich-Variante von "pro controller" oben -- identisches
  # Kompositum-/Schreibweisen-Problem wie bei "zubehör-set"/"zubehörset"/
  # "zubehör set" oben: _contains_term() prüft "pro controller" (Leerzeichen)
  # als eigene Phrase, "Pro-Controller" (Bindestrich) enthält diese Phrase
  # NICHT. Real bestätigt: "Snakebyte PS4 Wireless Pro-Controller PC Bayern
  # München" (52€, Top-Deal) matchte bisher trotz des bestehenden
  # Konnektor-Mechanismus. Selber Konnektor-Anker (*bundle_konnektoren) --
  # erbt dieselbe, bereits gegen den vollständigen Korpus verifizierte
  # 0-Kollisionen-Eigenschaft (kein neues Kollisionsrisiko, da nur die
  # Bindestrich-Schreibweise zusätzlich erfasst wird, "pro controller" mit
  # Leerzeichen bleibt unverändert).
  "pro-controller": *bundle_konnektoren
  # FIX (Nachtrag, Dashboard-Match-Validierung Variante C, Session
  # 2026-08-10): identisches Muster wie "Pro Controller" oben --
  # "GameCube Controller" ist ebenfalls ein spezifischer, feststehender
  # Zubehoer-Produktname (ein an Switch/Switch 2 anschliessbarer
  # GameCube-Style-Controller), der als Standalone-Angebot faelschlich
  # matcht, wenn "Nintendo Switch"+"OVP" ohne echten Geraete-Kontext
  # auftauchen (bestaetigt an zwei realen price_history.jsonl-Treffern:
  # "Nintendo Switch 2 GameCube Controller OVP" und "... Nintendo
  # Classics OVP", vorher nicht durch die "Für Plattform"- oder "Pro
  # Controller"-Excludes abgedeckt, da weder "für" noch "pro controller"
  # vorkommt). KEIN bare "controller"-Exclude (unveraendert verworfen,
  # siehe Begruendung oben) -- "GameCube Controller" ist wie "Pro
  # Controller" ein enger Zwei-Wort-Ausdruck ohne die dortige
  # Zahl-vor-"Controller"-Kollisionsgefahr. Wiederverwendung derselben
  # Konnektor-Liste per Anker (*bundle_konnektoren): "mit GameCube
  # Controller" bleibt erlaubt, "Nintendo Switch 2 GameCube Controller"
  # nicht.
  "gamecube controller": *bundle_konnektoren
  # FIX (UNCLEAR-FP-Root-Cause-Audit 2026-08-16, Cluster C5
  # THIRD_PARTY_ACCESSORY_BRAND_NAME_MARKER_COLLISION): "HORI Split Pad Pro
  # Nintendo Switch Controller Schwarz mit OVP" matchte bisher fälschlich.
  # "Split Pad Pro" ist ein Dritthersteller-Controller-Produktname (analog zu
  # "Pro Controller"/"GameCube Controller" oben); der bereits vorhandene
  # "pro controller"-Phrasen-Exclude greift hier NICHT, weil "Pro" und
  # "Controller" im Titel durch "Nintendo Switch" getrennt stehen
  # ("Split Pad Pro Nintendo Switch Controller"), wodurch der Titel
  # stattdessen über das generische Wort "pro" in der weiter unten
  # definierten exclude_category_unless_also_contains-Verstärkungsliste des
  # Keys "ovp" durchrutscht. Bewusst NICHT das geteilte Wort "pro" aus dieser
  # Liste entfernen (würde den Guard global schwächen, unklares Risiko für
  # "PS4 Pro"/"Xbox ... Pro"-Konsolen außerhalb der geprüften Stichprobe) --
  # stattdessen derselbe, bereits produktiv verifizierte Konnektor-Mechanismus
  # wie bei "pro controller"/"gamecube controller": blockiert "split pad pro"
  # nur, wenn KEIN Bundle-Konnektor unmittelbar davorsteht ("mit HORI Split
  # Pad Pro" bliebe erlaubt). Blast Radius (Vollkorpus:
  # docs/DASHBOARD_MATCH_FORENSICS.json, data/found.json,
  # data/price_history.jsonl, 21320 Titel gesamt geprüft): genau 2 Treffer --
  # der beschriebene FP-Fall sowie ein bereits bestätigter TRUE_POSITIVE
  # ("HORI Split Pad Pro Controller Schwarz für Nintendo Switch"), der
  # unverändert über controller.yaml (Kategorie "controller", nicht
  # "konsolen_bundles") matcht und von dieser Änderung nicht berührt wird
  # (verifiziert per evaluate()). 0 Kollisionen mit einem echten
  # konsolen_bundles-TRUE_POSITIVE.
  "split pad pro": *bundle_konnektoren

