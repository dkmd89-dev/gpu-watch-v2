category: "konsolen_bundles"
label: "Moderne Konsolen & Bundles"

scan_priority: 8
notify_max_price: 180

search_terms:
  - "PS4 Slim"
  - "PS4 Pro"
  - "PlayStation 4"
  - "Xbox One S"
  - "Xbox One X"
  - "Nintendo Switch"
  - "Switch Lite"
  - "Switch OLED"
  - "Konsolen Bundle"

# 'defekt' und 'bastler' werden für DIESE Kategorie gezielt von der
# globalen Sperre (_global.yaml: exclude_global) ausgenommen, siehe neuer
# Key "ignore_global_excludes" (matcher.py). Die eigentliche Trennung
# zwischen "Bastler-Bundle" und "voll funktionsfähig" passiert weiterhin
# über die Regeln selbst: die Bastler-Regel VERLANGT diese Begriffe
# (require_all_of), alle anderen Regeln in dieser Datei SCHLIESSEN sie
# weiterhin explizit über ihr eigenes "exclude:" aus -- ignore_global_excludes
# hebt nur die kategorieweite Blockade auf, nicht die Regel-eigenen Excludes.
ignore_global_excludes:
  - "defekt"
  - "bastler"

exclude_category:
  - "hülle"
  - "case"
  - "tasche"
  - "ovp nur"
  - "nur karton"
  - "leerkarton"
  - "nur spiele"
  - "spiel für"
  - "spiel"
  - "spielesammlung"
  - "spiele sammlung"
  # FIX (Profit-Matching-Root-Cause-Audit 2026-08-16, Cluster A): "PS4
  # Spiele 10€ pro Stück" matchte fälschlich die PS4-Bundle-Regeln. Root
  # Cause: "pro" ist in der require_all_of-Gruppe 2 dieser Regeln UND in
  # der Verstärkungsliste des exclude_category_unless_also_contains-Guards
  # für den Key "spiele" enthalten (gedacht für "PS4 Pro" als
  # Konsolenvariante) -- hier wird "pro" aber als deutsche Praeposition
  # ("je Stück") verwendet, nicht als Modellbezeichnung. Bewusst NICHT das
  # geteilte Wort "pro" aus require_all_of oder der Verstaerkungsliste
  # entfernen (globaler Eingriff, unklares Risiko fuer echte "PS4 Pro"-
  # Konsolenangebote ausserhalb der geprueften Stichprobe) -- stattdessen
  # eine spezifische, eindeutige Phrase: "pro Stück" (= "je Stück") kommt in
  # keinem bekannten Konsolen-Bundle-Titel vor, ausschliesslich bei
  # Stueckverkauf von Einzelartikeln (Spielen). Bekannter Ground-Truth-
  # Konflikt (nicht die Ground-Truth-Datei aendern, siehe
  # docs/DASHBOARD_MATCH_FORENSICS.json): 2 dort als TRUE_POSITIVE
  # gelabelte Faelle ("Ps4 Spiele Einzelverkauf 7€ pro Stück.", "Ps4 Spiele
  # gebraucht 10€ pro Stück") sind inhaltlich eindeutig Spiele-
  # Einzelverkaeufe, keine Konsolenangebote -- vermutlich Label-Fehler,
  # analog zum bereits dokumentierten Switch/Xbox-Ground-Truth-Artefakt aus
  # Batch 20b. Blast Radius (Vollkorpus: docs/DASHBOARD_MATCH_FORENSICS.json
  # + data/found.json + data/price_history.jsonl, 21331 Titel geprueft):
  # genau 3 Treffer fuer "pro stück" in konsolen_bundles, alle drei Spiele-
  # Stueckverkaeufe, 0 Treffer mit einem echten Konsolen-/Geraete-Marker.
  - "pro stück"
  - "nur controller"
  - "station"
  - "lüfter"
  - "ständer"
  # Phase 14 (Data-Quality-Fix): siehe ausfuehrliche Begruendung in
  # rules/handhelds.yaml (identisches Problem bei "Nintendo Switch Lite" --
  # eindeutiger, mehrwortiger Produktname ohne generisches Kurzwort, daher
  # gezielte Exclude-Erweiterung statt zusaetzlicher require_all_of-Gruppe).
  - "netzteil"
  - "ladekabel"
  - "kabel"
  - "ladegerät"
  - "anleitung"
  # FIX (Nutzer-Meldung 2026-08-15): "mainboard"/"motherboard" (bare) --
  # identisches, bereits in office_pc.yaml/gaming_pc.yaml/notebook_resell.
  # yaml etabliertes Muster ("ein blosses Mainboard-Ersatzteil ist kein
  # komplettes System"). Real bestaetigt: "Sony Playstation 4 Pro & PS4
  # Mainboard Pin Buchse / Stecker abgerissen Reparatur" (39€, Top-Deal) --
  # ein defektes Ersatzteil, keine funktionsfaehige Konsole. Blast Radius:
  # 1 Treffer in found.json, 0 Kollisionen (kein echter Bundle-Titel
  # nennt "mainboard"/"motherboard").
  - "mainboard"
  - "motherboard"
  # FIX (Nutzer-Meldung 2026-08-15, found.json-Vollanalyse): "Panzerglas"/
  # "Displayschutz" sind eindeutige Zubehör-Produktnamen (Schutzfolie fürs
  # Konsolen-Display), kein Gerät. Real bestätigt: "Panzerglas Displayschutz
  # Nintendo Switch Lite" (5€, Top-Deal). Blast Radius: 1 Treffer im
  # gesamten Korpus (found.json + price_history.jsonl identisch), 0
  # Kollisionen.
  - "panzerglas"
  - "displayschutz"

  # FIX (Nutzer-Freigabe 2026-08-15, FALSE_POSITIVES_ANALYSE Teil 1 D):
  # drei Einzelfall-Zubehör-/Ersatzteil-Produktnamen, real bestätigt gegen
  # found.json/price_history.jsonl, 0 Kollisionen im vollständigen Korpus:
  # "SanDisk microSDXC Extreme 512GB U3 Nintendo Switch 100MB/s Neu OVP"
  # (SD-Karten-Zubehör, matchte über "512gb", das als Gruppe-2-Signal
  # bewusst erhalten bleibt), "Toshiba MQ01ABD050V ... Interne Festplatte
  # (Original PS4)" und "... (Original PS4 Pro)" (Ersatzfestplatte statt
  # Gerät, matchte über "500gb"/"1tb"), "Nintendo Switch Deluxe
  # System/Travelcase/Tragetasche" (Tragetasche, matchte über "system";
  # das bereits vorhandene bare "tasche" oben greift wegen Wortgrenzen-
  # Matching nicht beim Kompositum "Tragetasche", identisches Muster wie
  # "zubehör-set"/"zubehörset" oben).
  - "microsdxc"
  - "interne festplatte"
  - "travelcase"
  - "tragetasche"

  # Phase 15 (kontrollierter Review, "Service/Modding-Fix"): Reparatur-/
  # Modding-DIENSTLEISTUNGS-Angebote statt Konsolenverkauf. Bewusst als
  # Mehrwort-Phrase, NICHT bare "service" -- ein bare Exclude waere fuer
  # Geraete-Zustandsbeschreibungen riskant.
  - "modding service"
  - "reparatur service"
  - "repair service"

  # Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): unbedingte
  # Ausschlüsse für Standalone-Gehäuse-/Shell-Angebote, die nicht über die
  # kontextbewusste "gehäuse"-Prüfung unten laufen (zusammengesetzte
  # Wörter/englische Begriffe, siehe handhelds.yaml-Begründung).
  - "ersatzgehäuse"
  - "leergehäuse"
  - "wechselgehäuse"
  - "replacement shell"
  - "back shell"
  - "shell replacement"
  - "backplate"
  - "replacement housing"
  - "housing replacement"

  # FIX (kontrollierter Review, found.json-Audit, Option "ovp bleibt
  # Positivsignal"): "ovp" WURDE bewusst NICHT aus den require_all_of-
  # Gruppen entfernt (Auftragsvorgabe) -- stattdessen datenbasiert
  # präzise Phrasen für die beiden konkret gefundenen Fehltreffer-Gruppen
  # ergänzt (49 von 240 sichtbaren found.json-Einträgen dieser
  # Kategorie). Jede Phrase wurde gegen den vollständigen sichtbaren
  # Datensatz verifiziert: 0 Kollisionen mit echten Konsole+Zubehör/
  # Spiele-Bundles.
  #
  # Gruppe 1 -- reine Spiel-Angebote (Spiel-Produktname statt Konsole,
  # z.B. "Nintendo Switch Mini Arcade - Mushihimesama - Limited Run -
  # Neu & OVP"): bewusst NICHT bare "für" (9 Kollisionen mit echten
  # Bundles wie "Wireless Controller für PS4 Slim Pro" verifiziert,
  # ANDERS als bei den Spiele-Titeln selbst wo "für" den Zubehör-/
  # Spiel-Charakter anzeigt) -- stattdessen die tatsächlich in den
  # betroffenen Titeln vorkommenden, eindeutigen Produktlinien-/
  # Titel-Phrasen:
  - "mini arcade"
  - "limited run"
  - "pro skater"
  - "spiele-wahl"
  - "spieleauswahl"
  - "evolution soccer"
  # Bekannte Restlücke (bewusst nicht weiter verfolgt, analog
  # retro_konsolen-Dokumentation): individuelle Spieltitel ohne eines
  # der obigen Muster (z.B. "Pokémon Purpur", "Minecraft") lassen sich
  # nicht per endlicher Phrasenliste abdecken, ohne "ovp"/"bundle"/"pro"
  # als Positivsignal selbst zu verändern -- ausserhalb des Scopes
  # dieses Reviews.
  #
  # Gruppe 2 -- Standalone-Zubehör (Controller/Headset/Lenkrad/Modchip/
  # Schutzhülle), das über "controller"/"bundle" bereits ohne echte
  # Konsole matcht:
  - "controller für"
  - "controller defekt"
  - "wireless controller"
  - "schutzhülle"
  - "gaming headset"
  - "dock set"
  - "modchip"
  - "scuff"
  - "racing wheel"
  # FIX (Nutzer-Meldung 2026-08-15, Live-Fehltreffer "pro"-Kollision):
  # "MixAmp" (Astro) ist ein spezifischer, eindeutiger Audio-Verstärker-
  # Produktname für Gaming-Headsets, kein Konsolen-Bundle -- real bestätigt:
  # "Astro MixAmp Pro TR Gen 4 für PS4/PC – Audio-Verstärker" (50€,
  # Top-Deal, matchte bisher fälschlich über das bare "pro" in der
  # require_all_of-Gruppe 2 der PS4-Regeln). Bare Exclude (kein Konnektor-
  # Mechanismus nötig): eindeutiger Markenname ohne Bundle-Kollisionsrisiko,
  # 0 Treffer im übrigen Korpus außer den 3 real bestätigten MixAmp-Titeln
  # (alle Zubehör, kein Konsolen-Bundle).
  - "mixamp"
  - "zubehör-set"
  - "zubehörset"
  # FIX (Nutzer-Meldung 2026-08-15): "zubehör set" (zwei Woerter, mit
  # Leerzeichen) fehlte -- weder "zubehör-set" (Bindestrich) noch
  # "zubehörset" (zusammengeschrieben) greifen bei getrennter Schreibung
  # ("12-in-1 Sport Zubehör Set für Nintendo Switch / OLED"), da
  # _contains_term() jede Variante als eigene Phrase prueft. Blast Radius:
  # 2 Treffer in found.json, beide echte Standalone-Zubehoer-Sets ohne
  # Konsole.
  - "zubehör set"
  # FIX (UNCLEAR-FP-Root-Cause-Audit 2026-08-16, Cluster C7
  # JOYCON_SET_OLED_MARKER_COLLISION): "Nintendo Switch OLED Joy-Con Set -
  # Pokemon Scarlet & Violet mit Handschlaufaufen" matchte bisher fälschlich,
  # weil der weiter unten definierte exclude_category_unless_also_contains-
  # Kontext-Guard für den Key "joy-con" (siehe "Bewusst NICHT joy-con" unten)
  # "oled" als Geräte-Verstärkungssignal akzeptiert -- hier bezeichnet "OLED"
  # aber nur, für welche Switch-Variante das separate Joy-Con-Set kompatibel
  # ist, kein verkauftes Konsolengehäuse. Bewusst NICHT "oled" aus der
  # joy-con-Markerliste entfernen (würde den "joy-con"-Key global schwächen,
  # unklares Risiko für "Konsole ... OLED ... Joy-Con"-Bundles außerhalb der
  # geprüften Stichprobe) und bewusst NICHT bare "joy-con" (siehe die bereits
  # dokumentierten 9 Kollisionsfälle unten) -- stattdessen die spezifische
  # Zwei-Wort-Phrase "joy-con set" als bare Exclude, analog zu "zubehör set"
  # oben. Blast Radius (Vollkorpus: docs/DASHBOARD_MATCH_FORENSICS.json,
  # data/found.json, data/price_history.jsonl, 21320 Titel gesamt geprüft):
  # genau 1 Treffer, exakt der beschriebene FP-Fall, 0 Kollisionen mit
  # TRUE_POSITIVE- oder anderen UNCLEAR-Fällen.
  - "joy-con set"
  # Nachtrag (kontrollierter Review, found.json-Realdatenabgleich gegen
  # den bereits als Gruppe-2-Zielkategorie dokumentierten Kommentar
  # "Controller/Headset/Lenkrad/Modchip/Schutzhülle" oben): die
  # ENGLISCHE Phrase "racing wheel" deckt reale, deutschsprachige
  # Lenkrad-Angebote nicht ab -- Kleinanzeigen-Titel nutzen durchgängig
  # "Lenkrad", nie "racing wheel". Verifiziert gegen alle 1708 aktuell
  # sichtbaren, eindeutigen Titel aus found.json: "lenkrad" kommt genau
  # zweimal vor, beide Male als Standalone-Zubehör mit Plattform-
  # Kompatibilitätsliste ("... für PC/PS3/PS4/XBOX", "... PS5,PS4,Xbox,
  # PC"), 0 Treffer in Kombination mit "konsole"/"system"/einem
  # Geräte-Marker. Bare Wort, kein Kompositum-/Adjazenzrisiko (analog
  # "modchip"/"scuff" oben). "gamepad" ergänzt dasselbe Root-Cause-Muster
  # für Standalone-Gamepads ohne das Wort "controller" im Titel (z.B.
  # "Wireless Gamepad PS4 Pro Slim ...") -- von den bereits vorhandenen
  # "controller für"/"wireless controller"-Phrasen nicht erfasst, da
  # diese Titel "controller" gar nicht enthalten. Von 14 "gamepad"-
  # Titeln im vollständigen found.json-Korpus sind 13 bereits über
  # "controller"-Phrasen oder die eigene controller.yaml-Kategorie
  # (first-match-wins) korrekt abgedeckt; der verbleibende, bisher nicht
  # abgedeckte Fall ist genau dieses Standalone-Gamepad-Muster. 0
  # Kollisionen mit echten Konsolen-Bundles im vollständigen Korpus.
  - "lenkrad"
  - "gamepad"
  # Bewusst NICHT "joy-con" (9 Kollisionen mit echten Switch-Bundles wie
  # "Nintendo Switch Konsole mit grauen Joy-Cons" verifiziert) und NICHT
  # "dualshock 4" (4 Kollisionen mit echten PS4-Bundles verifiziert).
  #
  # Gruppe 3 -- Ersatzteil-Reseller-Muster (Touchscreen-/LCD-
  # Ersatzteile in mehreren Farbvarianten, z.B. "Nintendo Switch Lite
  # Touchscreen grau Versand aus Deutschland"): bewusst NICHT bare
  # "touchscreen" (könnte legitime Zustands-/Funktionsprüfungs-
  # Beschreibungen eines echten Geräts treffen, z.B. "Touchscreen
  # reagiert einwandfrei" -- identisches Risiko wie beim Gehäuse/Shell-
  # Fix) -- stattdessen die tatsächliche, eindeutige Reseller-Phrase:
  - "versand aus deutschland"

# Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): "gehäuse"
# ist zweideutig (lose Ersatzschale vs. Zustandsbeschreibung einer
# kompletten Konsole, z.B. "Gehäuse leicht vergilbt") -- schließt daher
# nur aus, wenn im GESAMTEN Titel kein Kontextbegriff vorkommt (siehe
# matcher.py::_any_conditional_exclude_presence(), ausführliche
# Begründung in handhelds.yaml).
#
# FIX (kontrollierter Review, "Plattformbegriff ist kein Hardware-Beweis",
# Variante C, KONSOLEN_BUNDLES_REVIEW.md Abschnitt 8): "[Produkt] für
# [Plattform]" ist praktisch immer eine Formulierung für ein Spiel oder
# Zubehörteil, das ZUR Plattform passt -- niemals für die Plattform
# selbst ("Mario Kart für Nintendo Switch", "Wireless Controller für
# PS4"). Bewusst NICHT als unbedingter exclude_category-Eintrag (das
# würde auch echte Geräte blockieren, deren Titel "für"+Plattform als
# reine Kompatibilitäts-/Spec-Angabe nennen, z.B. "Sony PlayStation 4
# Slim ... HDMI USB-A für PS4 Funktioniert einwandfrei", verifiziert im
# Forensik-Datensatz) -- stattdessen kontextbewusst über
# exclude_category_unless_also_contains: blockiert nur, wenn der Titel
# KEINEN der folgenden Geräte-Marker (Speichergröße, Modellvariante,
# Modellcode, Generation, Kompositum-Konsolenbegriff) enthält. "ovp"
# bleibt dadurch unverändert ein gültiges Positivsignal in Gruppe 2 --
# diese Excludes greifen VOR der require_all_of-Prüfung und sind davon
# unabhängig. Datengetestet gegen alle 195 damals sichtbaren
# TRUE_POSITIVE-Treffer: 0 echte Kollisionen (die anfänglich gefundenen
# 3 Kandidaten waren bei Prüfung selbst Fehltreffer -- ein Spiel und zwei
# Standalone-Controller-Angebote, siehe Bericht Abschnitt 7).
exclude_category_unless_also_contains:
  # FIX (Nutzer-Meldung 2026-08-15, found.json-Vollanalyse): "ovp"/"bundle"/
  # "set"/"mit spiele" sind in der require_all_of-Gruppe 2 bewusst erhaltene
  # Positivsignale (siehe Kommentar weiter unten, "ovp bleibt Positivsignal"),
  # reichen aber zusammen mit "spiele" fuer reine Spiele-Sammlungen OHNE jedes
  # Geraet aus (z.B. "Nintendo Switch Spiele Bundle", "PS4 Spiele Bundle mit
  # zwei Controllern", "FIFA & F1 Spiele Paket Bundle (7 Spiele)"). Bare
  # "spiel" (Singular) ist bereits als unbedingter Exclude vorhanden, greift
  # aber wegen Wortgrenzen nicht bei der Pluralform "Spiele" (identisches
  # Muster wie ueberall in diesem Projekt: modul/module, zubehör-set/zubehör
  # set). Systematischer Blast-Radius-Check gegen den vollen found.json+
  # price_history.jsonl-Korpus (120 Titel mit "spiele" in dieser Kategorie):
  # 26 Titel haben "spiele" OHNE jeden Geraete-/Modell-Marker -- ausnahmslos
  # reine Spiele-Angebote. Die uebrigen ~94 haben JEWEILS mindestens einen
  # echten Marker (konsole/slim/pro/500gb/1tb/xl/oled/lite/...) -- 0
  # Kollisionen mit echten Konsole+Spiele-Bundles. Kontextliste identisch zu
  # den group2-Geraete-/Modell-Alternativen aller Regeln dieser Datei
  # (Switch: konsole/spielekonsole/heimkonsole/system; PS4/Xbox: slim/pro/
  # Speichergroessen; Switch-Modellvarianten: xl/oled/lite/v1/v2).
  spiele:
    - "konsole"
    - "spielkonsole"
    - "spielekonsole"
    - "heimkonsole"
    - "system"
    - "slim"
    - "pro"
    - "1tb"
    - "500gb"
    - "128gb"
    - "64gb"
    - "32gb"
    - "256gb"
    - "512gb"
    - "2tb"
    - "xl"
    - "oled"
    - "lite"
    - "v1"
    - "v2"
  # FIX (Nutzer-Freigabe 2026-08-15, FALSE_POSITIVES_ANALYSE Teil 1 A):
  # bare "ovp" OHNE jeden Geräte-Marker matcht Nintendo-Switch-SPIELTITEL
  # als Konsole (18 bestätigte Fehltreffer, z.B. "Nintendo Switch Pokemon
  # Arceus OVP", "Zelda Tears of The Kingdom Nintendo Switch 1 + Ovp").
  # Auftragsvorgabe "ovp bleibt Positivsignal" (siehe Kommentar oben,
  # "ovp bleibt Positivsignal") bleibt UNVERÄNDERT gültig für Titel MIT
  # Geräte-Marker -- "ovp" wird bewusst NICHT aus require_all_of entfernt,
  # sondern wie "spiele" nur kontextbewusst blockiert, wenn im gesamten
  # Titel kein Marker vorkommt. Identische Geräte-Marker-Liste wie
  # "spiele" oben, zusätzlich "bundle"/"set"/"mit spiele" -- das sind die
  # übrigen require_all_of-Gruppe-2-Signale der Switch-/Xbox-Regeln, die
  # ohne diese Ergänzung fälschlich mitblockiert würden (z.B. ein echtes
  # "Xbox One S Bundle mit OVP" ohne sonstigen Marker). Gegen found.json +
  # price_history.jsonl verifiziert: alle 16 aktuell noch aktiven FP aus
  # der Analyse (2 der 18 waren bereits über den "spiele"-Exclude
  # abgefangen) haben KEINEN der Marker, 0 Kollisionen mit den dort
  # ebenfalls über bare "ovp" matchenden echten Bundles ("Nintendo Switch
  # 32GB Konsole mit Dock, Joy-Cons ... & OVP", drei Xbox-One-S-Titel).
  # Bekannte Restlücke (bewusst in Kauf genommen, siehe Analyse Teil 2
  # Fall #40): "nintendo switch 1 nur getestet Garantie rechnung ovp
  # +online" (150€) hat ebenfalls keinen Marker und wird dadurch
  # mitblockiert, obwohl die Analyse ihn als vermutlich echten Verkauf
  # einstuft -- Einzelfall ohne belastbares Unterscheidungsmerkmal zu den
  # 18 Spiele-FP, nicht separat gelöst.
  ovp:
    - "konsole"
    - "spielkonsole"
    - "spielekonsole"
    - "heimkonsole"
    - "system"
    - "slim"
    - "pro"
    - "1tb"
    - "500gb"
    - "128gb"
    - "64gb"
    - "32gb"
    - "256gb"
    - "512gb"
    - "2tb"
    - "xl"
    - "oled"
    - "lite"
    - "v1"
    - "v2"
    - "bundle"
    - "set"
    - "mit spiele"
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"
  # FIX (Category-False-Positive-Forensics, Fix-Queue P1, root_cause
  # ambiguous/manual_review, umgesetzt nach Nutzer-Vorschlag mit
  # Korrektur): "reparatur" (bare Wort) deutet meist auf ein
  # Reparatur-DIENSTLEISTUNGS-/Werkzeug-Angebot statt einen Geräteverkauf
  # hin (bestätigter Fehltreffer: "Playstation 5 PS4 PS5 Slim HDMI Port
  # Nintendo Reparatur USB PRO", matchte über "slim"+"pro" -- weder aus
  # "PS4 Pro" noch "PS4 Slim", sondern aus "PS5 Slim"/"USB PRO"). Bewusst
  # NICHT als unbedingter exclude_category-Eintrag (Risiko: würde echte
  # "frisch repariert, funktioniert einwandfrei"-Zustandsbeschreibungen
  # blockieren, auch wenn im aktuellen Korpus kein solcher Fall
  # nachweisbar ist) -- stattdessen identischer Kontext-Mechanismus wie
  # "spiele"/"ovp" oben. WICHTIG, Korrektur ggü. einem ersten Entwurf:
  # KEINE Markennamen ("nintendo"/"playstation"/"xbox") als Kontext --
  # jede Regel dieser Datei verlangt ohnehin eine Markennennung in
  # require_all_of-Gruppe 1, d.h. ein Titel, der die Kategorie ueberhaupt
  # erreicht, enthaelt fast tautologisch einen Markennamen (der Zielfall
  # selbst enthaelt sowohl "Nintendo" als auch "Playstation" als reine
  # Markennennungen, ohne dass eines der beiden Geraete verkauft wird).
  # Ebenso bewusst OHNE "slim"/"pro"/"bundle"/"mit spiele": die
  # auslösende Regel "PS4 Slim / Pro Bundle" hat "slim"+"pro" selbst in
  # ihrer require_all_of-Gruppe 2 -- als Kontext-Marker verwendet, waeren
  # sie fuer genau diesen Regelfamilien-Fall immer trivial erfuellt und
  # wuerden das Gate wirkungslos machen. Blast Radius: 0 Belege fuer eine
  # echte "repariert"-Zustandsbeschreibung im gesamten verfuegbaren
  # Korpus (docs/DASHBOARD_MATCH_FORENSICS.json, found.json,
  # price_history.jsonl via title_recovery) -- alle 3 gefundenen
  # "reparatur"/"repariert"-Titel in dieser Kategorie sind Reparatur-
  # Dienstleistungs-/Werkzeug-Angebote.
  reparatur:
    - "konsole"
