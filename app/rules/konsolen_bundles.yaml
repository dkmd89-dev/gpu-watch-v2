category: "konsolen_bundles"
label: "Moderne Konsolen & Bundles"

scan_priority: 8
notify_max_price: 180

search_terms:
  - "PS4 Slim"
  - "PS4 Pro"
  - "PlayStation 4"
  - "Xbox One S"
  - "Xbox One X"
  - "Nintendo Switch"
  - "Switch Lite"
  - "Switch OLED"
  - "Konsolen Bundle"

# 'defekt' und 'bastler' werden für DIESE Kategorie gezielt von der
# globalen Sperre (_global.yaml: exclude_global) ausgenommen, siehe neuer
# Key "ignore_global_excludes" (matcher.py). Die eigentliche Trennung
# zwischen "Bastler-Bundle" und "voll funktionsfähig" passiert weiterhin
# über die Regeln selbst: die Bastler-Regel VERLANGT diese Begriffe
# (require_all_of), alle anderen Regeln in dieser Datei SCHLIESSEN sie
# weiterhin explizit über ihr eigenes "exclude:" aus -- ignore_global_excludes
# hebt nur die kategorieweite Blockade auf, nicht die Regel-eigenen Excludes.
ignore_global_excludes:
  - "defekt"
  - "bastler"

exclude_category:
  - "hülle"
  - "case"
  - "tasche"
  - "ovp nur"
  - "nur karton"
  - "leerkarton"
  - "nur spiele"
  - "spiel für"
  - "spiel"
  - "spielesammlung"
  - "spiele sammlung"
  - "nur controller"
  - "station"
  - "lüfter"
  - "ständer"
  # Phase 14 (Data-Quality-Fix): siehe ausfuehrliche Begruendung in
  # rules/handhelds.yaml (identisches Problem bei "Nintendo Switch Lite" --
  # eindeutiger, mehrwortiger Produktname ohne generisches Kurzwort, daher
  # gezielte Exclude-Erweiterung statt zusaetzlicher require_all_of-Gruppe).
  - "netzteil"
  - "ladekabel"
  - "kabel"
  - "ladegerät"
  - "anleitung"
  # FIX (Nutzer-Meldung 2026-08-15): "mainboard"/"motherboard" (bare) --
  # identisches, bereits in office_pc.yaml/gaming_pc.yaml/notebook_resell.
  # yaml etabliertes Muster ("ein blosses Mainboard-Ersatzteil ist kein
  # komplettes System"). Real bestaetigt: "Sony Playstation 4 Pro & PS4
  # Mainboard Pin Buchse / Stecker abgerissen Reparatur" (39€, Top-Deal) --
  # ein defektes Ersatzteil, keine funktionsfaehige Konsole. Blast Radius:
  # 1 Treffer in found.json, 0 Kollisionen (kein echter Bundle-Titel
  # nennt "mainboard"/"motherboard").
  - "mainboard"
  - "motherboard"

  # Phase 15 (kontrollierter Review, "Service/Modding-Fix"): Reparatur-/
  # Modding-DIENSTLEISTUNGS-Angebote statt Konsolenverkauf. Bewusst als
  # Mehrwort-Phrase, NICHT bare "service" -- ein bare Exclude waere fuer
  # Geraete-Zustandsbeschreibungen riskant.
  - "modding service"
  - "reparatur service"
  - "repair service"

  # Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): unbedingte
  # Ausschlüsse für Standalone-Gehäuse-/Shell-Angebote, die nicht über die
  # kontextbewusste "gehäuse"-Prüfung unten laufen (zusammengesetzte
  # Wörter/englische Begriffe, siehe handhelds.yaml-Begründung).
  - "ersatzgehäuse"
  - "leergehäuse"
  - "wechselgehäuse"
  - "replacement shell"
  - "back shell"
  - "shell replacement"
  - "backplate"
  - "replacement housing"
  - "housing replacement"

  # FIX (kontrollierter Review, found.json-Audit, Option "ovp bleibt
  # Positivsignal"): "ovp" WURDE bewusst NICHT aus den require_all_of-
  # Gruppen entfernt (Auftragsvorgabe) -- stattdessen datenbasiert
  # präzise Phrasen für die beiden konkret gefundenen Fehltreffer-Gruppen
  # ergänzt (49 von 240 sichtbaren found.json-Einträgen dieser
  # Kategorie). Jede Phrase wurde gegen den vollständigen sichtbaren
  # Datensatz verifiziert: 0 Kollisionen mit echten Konsole+Zubehör/
  # Spiele-Bundles.
  #
  # Gruppe 1 -- reine Spiel-Angebote (Spiel-Produktname statt Konsole,
  # z.B. "Nintendo Switch Mini Arcade - Mushihimesama - Limited Run -
  # Neu & OVP"): bewusst NICHT bare "für" (9 Kollisionen mit echten
  # Bundles wie "Wireless Controller für PS4 Slim Pro" verifiziert,
  # ANDERS als bei den Spiele-Titeln selbst wo "für" den Zubehör-/
  # Spiel-Charakter anzeigt) -- stattdessen die tatsächlich in den
  # betroffenen Titeln vorkommenden, eindeutigen Produktlinien-/
  # Titel-Phrasen:
  - "mini arcade"
  - "limited run"
  - "pro skater"
  - "spiele-wahl"
  - "spieleauswahl"
  - "evolution soccer"
  # Bekannte Restlücke (bewusst nicht weiter verfolgt, analog
  # retro_konsolen-Dokumentation): individuelle Spieltitel ohne eines
  # der obigen Muster (z.B. "Pokémon Purpur", "Minecraft") lassen sich
  # nicht per endlicher Phrasenliste abdecken, ohne "ovp"/"bundle"/"pro"
  # als Positivsignal selbst zu verändern -- ausserhalb des Scopes
  # dieses Reviews.
  #
  # Gruppe 2 -- Standalone-Zubehör (Controller/Headset/Lenkrad/Modchip/
  # Schutzhülle), das über "controller"/"bundle" bereits ohne echte
  # Konsole matcht:
  - "controller für"
  - "controller defekt"
  - "wireless controller"
  - "schutzhülle"
  - "gaming headset"
  - "dock set"
  - "modchip"
  - "scuff"
  - "racing wheel"
  - "zubehör-set"
  - "zubehörset"
  # FIX (Nutzer-Meldung 2026-08-15): "zubehör set" (zwei Woerter, mit
  # Leerzeichen) fehlte -- weder "zubehör-set" (Bindestrich) noch
  # "zubehörset" (zusammengeschrieben) greifen bei getrennter Schreibung
  # ("12-in-1 Sport Zubehör Set für Nintendo Switch / OLED"), da
  # _contains_term() jede Variante als eigene Phrase prueft. Blast Radius:
  # 2 Treffer in found.json, beide echte Standalone-Zubehoer-Sets ohne
  # Konsole.
  - "zubehör set"
  # Nachtrag (kontrollierter Review, found.json-Realdatenabgleich gegen
  # den bereits als Gruppe-2-Zielkategorie dokumentierten Kommentar
  # "Controller/Headset/Lenkrad/Modchip/Schutzhülle" oben): die
  # ENGLISCHE Phrase "racing wheel" deckt reale, deutschsprachige
  # Lenkrad-Angebote nicht ab -- Kleinanzeigen-Titel nutzen durchgängig
  # "Lenkrad", nie "racing wheel". Verifiziert gegen alle 1708 aktuell
  # sichtbaren, eindeutigen Titel aus found.json: "lenkrad" kommt genau
  # zweimal vor, beide Male als Standalone-Zubehör mit Plattform-
  # Kompatibilitätsliste ("... für PC/PS3/PS4/XBOX", "... PS5,PS4,Xbox,
  # PC"), 0 Treffer in Kombination mit "konsole"/"system"/einem
  # Geräte-Marker. Bare Wort, kein Kompositum-/Adjazenzrisiko (analog
  # "modchip"/"scuff" oben). "gamepad" ergänzt dasselbe Root-Cause-Muster
  # für Standalone-Gamepads ohne das Wort "controller" im Titel (z.B.
  # "Wireless Gamepad PS4 Pro Slim ...") -- von den bereits vorhandenen
  # "controller für"/"wireless controller"-Phrasen nicht erfasst, da
  # diese Titel "controller" gar nicht enthalten. Von 14 "gamepad"-
  # Titeln im vollständigen found.json-Korpus sind 13 bereits über
  # "controller"-Phrasen oder die eigene controller.yaml-Kategorie
  # (first-match-wins) korrekt abgedeckt; der verbleibende, bisher nicht
  # abgedeckte Fall ist genau dieses Standalone-Gamepad-Muster. 0
  # Kollisionen mit echten Konsolen-Bundles im vollständigen Korpus.
  - "lenkrad"
  - "gamepad"
  # Bewusst NICHT "joy-con" (9 Kollisionen mit echten Switch-Bundles wie
  # "Nintendo Switch Konsole mit grauen Joy-Cons" verifiziert) und NICHT
  # "dualshock 4" (4 Kollisionen mit echten PS4-Bundles verifiziert).
  #
  # Gruppe 3 -- Ersatzteil-Reseller-Muster (Touchscreen-/LCD-
  # Ersatzteile in mehreren Farbvarianten, z.B. "Nintendo Switch Lite
  # Touchscreen grau Versand aus Deutschland"): bewusst NICHT bare
  # "touchscreen" (könnte legitime Zustands-/Funktionsprüfungs-
  # Beschreibungen eines echten Geräts treffen, z.B. "Touchscreen
  # reagiert einwandfrei" -- identisches Risiko wie beim Gehäuse/Shell-
  # Fix) -- stattdessen die tatsächliche, eindeutige Reseller-Phrase:
  - "versand aus deutschland"

# Phase 15 (kontrollierter Folge-Review, "Gehäuse/Shell-Fix"): "gehäuse"
# ist zweideutig (lose Ersatzschale vs. Zustandsbeschreibung einer
# kompletten Konsole, z.B. "Gehäuse leicht vergilbt") -- schließt daher
# nur aus, wenn im GESAMTEN Titel kein Kontextbegriff vorkommt (siehe
# matcher.py::_any_conditional_exclude_presence(), ausführliche
# Begründung in handhelds.yaml).
#
# FIX (kontrollierter Review, "Plattformbegriff ist kein Hardware-Beweis",
# Variante C, KONSOLEN_BUNDLES_REVIEW.md Abschnitt 8): "[Produkt] für
# [Plattform]" ist praktisch immer eine Formulierung für ein Spiel oder
# Zubehörteil, das ZUR Plattform passt -- niemals für die Plattform
# selbst ("Mario Kart für Nintendo Switch", "Wireless Controller für
# PS4"). Bewusst NICHT als unbedingter exclude_category-Eintrag (das
# würde auch echte Geräte blockieren, deren Titel "für"+Plattform als
# reine Kompatibilitäts-/Spec-Angabe nennen, z.B. "Sony PlayStation 4
# Slim ... HDMI USB-A für PS4 Funktioniert einwandfrei", verifiziert im
# Forensik-Datensatz) -- stattdessen kontextbewusst über
# exclude_category_unless_also_contains: blockiert nur, wenn der Titel
# KEINEN der folgenden Geräte-Marker (Speichergröße, Modellvariante,
# Modellcode, Generation, Kompositum-Konsolenbegriff) enthält. "ovp"
# bleibt dadurch unverändert ein gültiges Positivsignal in Gruppe 2 --
# diese Excludes greifen VOR der require_all_of-Prüfung und sind davon
# unabhängig. Datengetestet gegen alle 195 damals sichtbaren
# TRUE_POSITIVE-Treffer: 0 echte Kollisionen (die anfänglich gefundenen
# 3 Kandidaten waren bei Prüfung selbst Fehltreffer -- ein Spiel und zwei
# Standalone-Controller-Angebote, siehe Bericht Abschnitt 7).
exclude_category_unless_also_contains:
  gehäuse:
    - "vergilbt"
    - "verkratzt"
    - "zerkratzt"
    - "kratzer"
    - "beschädigt"
    - "delle"
    - "dellen"
    - "macke"
    - "macken"
    - "neuwertig"
    - "gebraucht"
    - "abgenutzt"
    - "riss"
    - "risse"
    - "gesprungen"
    - "gebrauchsspuren"
    - "verfärbt"
  # FIX (Ruleset-Qualitaetssystem, 251-Listing-Stichprobe 2026-08-14):
  # "Joy-Con" ist wie "Pro Controller" ein eindeutiger Zubehoer-Produktname,
  # der als Standalone-Angebot faelschlich matcht (z.B. "SW - Original
  # Nintendo Switch Joy-Con 2er-Set Grau"). Bewusst NICHT als bare
  # exclude_category-Eintrag -- in einer frueheren Session verworfen
  # (9 verifizierte Kollisionen mit echten Switch-Bundles wie "Nintendo
  # Switch Konsole mit grauen Joy-Cons", siehe Kommentar weiter unten bei
  # "Bewusst NICHT joy-con"). Stattdessen kontextbewusst: blockiert nur,
  # wenn KEIN Geraete-Marker im Titel steht. Eigene Markerliste (nicht der
  # &plattform_geraete_marker-Anker unten) mit zusaetzlich "konsole" --
  # "Nintendo Switch KONSOLE mit grauen Joy-Cons" enthaelt sonst keinen der
  # bestehenden Marker (kein "spielkonsole", keine Speichergroesse). Blast
  # Radius gegen alle 61 Joy-Con-Titel aus found.json + price_history.jsonl
  # geprueft: 0 Kollisionen (jedes Konsole+Joy-Con-Bundle bleibt ueber
  # "konsole" erhalten), alle ca. 21 Standalone-Joy-Con-Sets bleiben
  # korrekt blockiert.
  "joy-con":
    &joy_con_geraete_marker
    - "konsole"
    - "32gb"
    - "64gb"
    - "128gb"
    - "256gb"
    - "500gb"
    - "512gb"
    - "1tb"
    - "2tb"
    - "slim"
    - "pro"
    - "hac-001"
    - "v1"
    - "v2"
    - "oled"
    - "spielkonsole"
    - "spielekonsole"
    - "heimkonsole"
    - "1. generation"
    - "2. generation"
  "joycon": *joy_con_geraete_marker
  "joy con": *joy_con_geraete_marker
  "für nintendo switch": &plattform_geraete_marker
    - "32gb"
    - "64gb"
    - "128gb"
    - "256gb"
    - "500gb"
    - "512gb"
    - "1tb"
    - "2tb"
    - "slim"
    - "pro"
    - "hac-001"
    - "v1"
    - "v2"
    - "oled"
    - "spielkonsole"
    - "spielekonsole"
    - "heimkonsole"
    - "1. generation"
    - "2. generation"
  "für switch": *plattform_geraete_marker
  "für ps4": *plattform_geraete_marker
  "für ps5": *plattform_geraete_marker
  "für playstation 4": *plattform_geraete_marker
  "für playstation 5": *plattform_geraete_marker
  "für xbox": *plattform_geraete_marker
  "für xbox one": *plattform_geraete_marker
  "für xbox series": *plattform_geraete_marker
  # Nachtrag (Dashboard-Match-Validierung Variante C, Schritt 2 --
  # separate Review-Runde): "[Plattform] - [Spieltitel]" ist wie "für
  # [Plattform]" praktisch immer eine Formulierung fuer ein Spiel/
  # Zubehoerteil, NICHT fuer das Geraet selbst (z.B. "Nintendo Switch -
  # Minecraft FRA mit OVP", real bestaetigt in price_history.jsonl).
  # matcher.py::_contains_term() prueft _title.lower()_ als reinen
  # Substring-Check OHNE Interpunktions-Normalisierung (title_l =
  # title.lower(), siehe evaluate()) -- der Bindestrich ist daher ganz
  # regulaer Teil des Suchbegriffs, kein neuer Matcher-Mechanismus
  # noetig, identisches Prinzip wie bei "für [Plattform]" oben,
  # Wiederverwendung desselben Geraete-Marker-Ankers. Zwei Varianten je
  # Plattform, da Kleinanzeigen-Titel sowohl Viertelgeviertstrich "–"
  # als auch Bindestrich "-" nutzen (beide real im Log-Korpus
  # bestaetigt, z.B. "PS4 Slim – funktioniert einwandfrei"). Gegen den
  # vollstaendigen 186-Titel-Rohkorpus (data/gpu_watch.log.*, mit
  # Interpunktion, GESPEICHERT-Zeilen der 5 konsolen_bundles-Regeln)
  # verifiziert: 0 echte Kollisionen -- die beiden Titel mit
  # uebereinstimmendem Muster ("Nintendo Switch Lite - Gelb - 32GB",
  # "... - Playstation 4 - Zustand: gut") enthalten jeweils einen
  # Geraete-Marker (32gb / 500gb+slim) und bleiben ueber die Ausnahme
  # unveraendert erhalten. Nur fuer Nintendo Switch real als
  # Fehltreffer bestaetigt; PS4/PS5/Xbox-Varianten strukturell
  # analog ergaenzt (keine bare "-"-Kollision im Korpus gefunden),
  # aber ohne eigenen bestaetigten Fehltreffer-Fall.
  "nintendo switch -": *plattform_geraete_marker
  "nintendo switch –": *plattform_geraete_marker
  "switch -": *plattform_geraete_marker
  "switch –": *plattform_geraete_marker
  "ps4 -": *plattform_geraete_marker
  "ps4 –": *plattform_geraete_marker
  "ps5 -": *plattform_geraete_marker
  "ps5 –": *plattform_geraete_marker
  "playstation 4 -": *plattform_geraete_marker
  "playstation 4 –": *plattform_geraete_marker
  "playstation 5 -": *plattform_geraete_marker
  "playstation 5 –": *plattform_geraete_marker
  "xbox one s -": *plattform_geraete_marker
  "xbox one s –": *plattform_geraete_marker
  "xbox one x -": *plattform_geraete_marker
  "xbox one x –": *plattform_geraete_marker

# FIX (kontrollierter Review, "Plattformbegriff ist kein Hardware-Beweis",
# Variante C, KONSOLEN_BUNDLES_REVIEW.md Abschnitt 8): "Pro Controller"
# ist ein spezifischer, bekannter Zubehör-Produktname (z.B. "Nintendo
# Switch Pro Controller"), der als Standalone-Angebot fälschlich matcht,
# wenn er zusammen mit dem Plattformnamen und "ovp" auftaucht. Bewusst
# NICHT als bare "controller"-Exclude (siehe Bericht Abschnitt 4/5,
# Variante verworfen: gegen alle 195 TRUE_POSITIVE-Titel verifiziert,
# dass "controller" in vielen echten Bundles von einer ZAHL statt einem
# Konnektor-Wort eingeleitet wird, z.B. "2 Controller"/"3 Controller" --
# ein bare-Exclude würde diese Bundles zerstören). "Pro Controller" ist
# dagegen ein enger, feststehender Zwei-Wort-Ausdruck ohne diese
# Kollisionsgefahr (0 Kollisionen im vollständigen 195-Titel-Test).
# Wiederverwendung des bereits in controller.yaml produktiven
# "Variante C"-Konnektor-Mechanismus (matcher.py::
# _contains_term_unless_preceded_by()): blockiert "Pro Controller" nur,
# wenn es NICHT unmittelbar einem Bundle-Konnektor folgt (z.B. "mit Pro
# Controller" bleibt erlaubt, "Nintendo Switch Pro Controller" nicht).
exclude_category_unless_preceded_by:
  "pro controller": &bundle_konnektoren
    - "inkl."
    - "inkl"
    - "mit"
    - "+"
    - "und"
    - "sowie"
  # FIX (Nachtrag, Dashboard-Match-Validierung Variante C, Session
  # 2026-08-10): identisches Muster wie "Pro Controller" oben --
  # "GameCube Controller" ist ebenfalls ein spezifischer, feststehender
  # Zubehoer-Produktname (ein an Switch/Switch 2 anschliessbarer
  # GameCube-Style-Controller), der als Standalone-Angebot faelschlich
  # matcht, wenn "Nintendo Switch"+"OVP" ohne echten Geraete-Kontext
  # auftauchen (bestaetigt an zwei realen price_history.jsonl-Treffern:
  # "Nintendo Switch 2 GameCube Controller OVP" und "... Nintendo
  # Classics OVP", vorher nicht durch die "Für Plattform"- oder "Pro
  # Controller"-Excludes abgedeckt, da weder "für" noch "pro controller"
  # vorkommt). KEIN bare "controller"-Exclude (unveraendert verworfen,
  # siehe Begruendung oben) -- "GameCube Controller" ist wie "Pro
  # Controller" ein enger Zwei-Wort-Ausdruck ohne die dortige
  # Zahl-vor-"Controller"-Kollisionsgefahr. Wiederverwendung derselben
  # Konnektor-Liste per Anker (*bundle_konnektoren): "mit GameCube
  # Controller" bleibt erlaubt, "Nintendo Switch 2 GameCube Controller"
  # nicht.
  "gamecube controller": *bundle_konnektoren

scoring_weights:
  price: 0.85
  ausstattung: 0
  hardware_qualitaet: 0.15
  hersteller: 0
  zustand: 0
  lieferumfang: 0

rules:
  # ============================================================
  # BASTLER / REPARATUR (Überhitzung / HDD-Defekt / Kein Bild)
  # ============================================================
  - label: "PS4 / Xbox One (Defekt / Bastler) ★ Top-Deal"
    price_history_model: "konsole_bastler_bundle"
    require_all_of:
      - ["ps4", "playstation 4", "xbox one"]
      - ["defekt", "bastler", "für bastler", "geht nicht an", "laut", "überhitzt", "piept"]
    exclude:
      - "controller nur"
      - "ohne gehäuse"
    min_vram_gb: 0
    max_price: 25
    deal_rating: "Top-Deal"

  - label: "PS4 / Xbox One (Defekt / Bastler) 👍 Guter Preis"
    price_history_model: "konsole_bastler_bundle"
    require_all_of:
      - ["ps4", "playstation 4", "xbox one"]
      - ["defekt", "bastler", "für bastler", "geht nicht an", "laut", "überhitzt", "piept"]
    exclude:
      - "controller nur"
      - "ohne gehäuse"
    min_vram_gb: 0
    max_price: 35
    deal_rating: "Guter Preis"

  # ============================================================
  # NINTENDO SWITCH (LCD / LITE / OLED - Voll funktionsfähig)
  # ============================================================
  - label: "Nintendo Switch (V1/V2/OLED) ★ Top-Deal"
    price_history_model: "konsole_switch_standard"
    # FIX (kontrollierter Review, Variante C, KONSOLEN_BUNDLES_REVIEW.md
    # Abschnitt 8d): "spielkonsole"/"spielekonsole"/"heimkonsole" sind
    # Kompositum-Varianten von "konsole", die die Wortgrenzen-Pruefung
    # (matcher.py::_contains_term()) bisher nicht als Vorkommen von
    # "konsole" erkannte (identisches, bereits in retro_konsolen.yaml
    # geloestes Muster). Rein additiv -- rettet echte Geraete-Angebote
    # wie "Nintendo Switch Spielkonsole mit Set", schliesst nichts aus.
    require_all_of:
      - ["nintendo switch", "switch oled", "switch konsole"]
      - ["konsole", "spielkonsole", "spielekonsole", "heimkonsole", "bundle", "set", "mit spiele", "ovp", "system"]
    exclude:
      - "lite"
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 110
    deal_rating: "Top-Deal"
    negotiation_tolerance_pct: 15.0

  - label: "Nintendo Switch (V1/V2/OLED) 👍 Guter Preis"
    price_history_model: "konsole_switch_standard"
    # FIX (kontrollierter Review, Variante C, KONSOLEN_BUNDLES_REVIEW.md
    # Abschnitt 8d): siehe Top-Deal-Regel oben, identische Begruendung.
    require_all_of:
      - ["nintendo switch", "switch oled", "switch konsole"]
      - ["konsole", "spielkonsole", "spielekonsole", "heimkonsole", "bundle", "set", "mit spiele", "ovp", "system"]
    exclude:
      - "lite"
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 150
    deal_rating: "Guter Preis"

  - label: "Nintendo Switch Lite ★ Top-Deal"
    price_history_model: "konsole_switch_lite"
    require_all_of:
      - ["switch lite", "nintendo switch lite"]
    exclude:
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 70
    deal_rating: "Top-Deal"

  - label: "Nintendo Switch Lite 👍 Guter Preis"
    price_history_model: "konsole_switch_lite"
    require_all_of:
      - ["switch lite", "nintendo switch lite"]
    exclude:
      - "defekt"
      - "bastler"
    min_vram_gb: 0
    max_price: 95
    deal_rating: "Guter Preis"

  # ============================================================
  # PLAYSTATION 4 (SLIM / PRO - Voll funktionsfähig)
  # ============================================================
  - label: "PS4 Slim / Pro Bundle ★ Top-Deal"
    price_history_model: "konsole_ps4_bundle"
    require_all_of:
      - ["ps4", "playstation 4"]
